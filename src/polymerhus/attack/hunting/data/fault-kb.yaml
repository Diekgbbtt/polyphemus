- abstraction: Base
  applies_if:
    nl: The unit builds an OS command from externally influenced input.
    predicate:
      clauses:
      - form: reachable-via
        key: EXPOSED_VIA
        role: null
        values:
        - WebPresentation
        - RESTApi
        - GraphQLApi
      target: Both
  enum_kinds:
