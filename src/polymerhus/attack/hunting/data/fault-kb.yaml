- abstraction: Base
  applies_if:
    nl: The unit's authorization does not prevent access to another user's resource via a guessable key.
    predicate:
      clauses:
      - form: reachable-via
        key: EXPOSED_VIA
        role: null
        values:
        - WebPresentation
        - RESTApi
        - GraphQLApi
      - form: reachable-via
        key: AUTHORIZED_BY
        role: null
        values:
        - AuthorizationSystem
      target: Both
  enum_kinds:
  - AuthorizationSystem
  - RESTApi
  - GraphQLApi
  fault_id: CWE-639
  materialisation:
    alternate_terms:
    - Broken Object Level Authorization / BOLA BOLA is used in the 2019 OWASP API Security Top 10 and appears to have some overlap, but BOLA may be applicable to other weaknesses in addition to this one.
    - Horizontal Authorization "Horizontal Authorization" is used to describe situations in which two users have the same privilege level, but must be prevented from accessing each other's resources. This is fairly common when using key-based access to resources in a multi-user context.
    - 'Insecure Direct Object Reference / IDOR The "Insecure Direct Object Reference" term, as described in the OWASP Top Ten, is broader than this CWE because it also covers path traversal (CWE-22). Within the context of vulnerability theory, there is a similarity between the OWASP concept and CWE-706: Use of Incorrectly-Resolved Name or Reference.'
    common_consequences: []
    description: The system's authorization functionality does not prevent one user from gaining access to another user's data or record by modifying the key value identifying the data.
    extended_description: |-
      Retrieval of a user record occurs in the system based on some key value that is under user control. The key would typically identify a user-related record stored in the system and would be used to lookup that record for presentation to the user. It is likely that an attacker would have to be an authenticated user in the system. However, the authorization process would not properly check the data access operation to ensure that the authenticated user performing the operation has sufficient entitlements to perform the requested data access, hence bypassing any other authorization checks present in the system.

      For example, attackers can look at places where user specific data is retrieved (e.g. search screens) and determine whether the key for the item being looked up is controllable externally. The key may be a hidden field in the HTML form field, might be passed as a URL parameter or as an unencrypted cookie variable, then in each of these cases it will be possible to tamper with the key value.

      One manifestation of this weakness is when a system uses sequential or otherwise easily-guessable session IDs that would allow one user to easily switch to another user's session and read/modify their data.
    likelihood: High
    related_attack_patterns: []
