- abstraction: Variant
  applies_if:
    nl: The unit passes CRLF sequences from external input into HTTP response headers.
    predicate: null
  enum_kinds:
  - WebPresentation
  - RESTApi
  fault_id: CWE-113
  fold_parent: CWE-93
  materialisation:
    alternate_terms:
    - HTTP Request Splitting
    - HTTP Response Splitting
    common_consequences:
    - 'scope: Integrity, Access Control - impact: Modify Application Data; Gain Privileges or Assume Identity'
    description: The product receives data from an HTTP agent/component (e.g., web server, proxy, browser, etc.), but it does not neutralize or incorrectly neutralizes CR and LF characters before the data is included in outgoing HTTP headers.
    extended_description: |-
      HTTP agents or components may include a web server, load balancer, reverse proxy, web caching proxy, application firewall, web browser, etc. Regardless of the role, they are expected to maintain coherent, consistent HTTP communication state across all components. However, including unexpected data in an HTTP header allows an attacker to specify the entirety of the HTTP message that is rendered by the client HTTP agent (e.g., web browser) or back-end HTTP agent (e.g., web server), whether the message is part of a request or a response.

      When an HTTP request contains unexpected CR and LF characters, the server may respond with an output stream that is interpreted as "splitting" the stream into two different HTTP messages instead of one. CR is carriage return, also given by %0d or \r, and LF is line feed, also given by %0a or \n.

      In addition to CR and LF characters, other valid/RFC compliant special characters and unique character encodings can be utilized, such as HT (horizontal tab, also given by %09 or \t) and SP (space, also given as + sign or %20).

      These types of unvalidated and unexpected data in HTTP message headers allow an attacker to control the second "split" message to mount attacks such as server-side request forgery, cross-site scripting, and cache poisoning attacks.

      HTTP response splitting weaknesses may be present when:

      Data enters a web application through an untrusted source, most frequently an HTTP request. The data is included in an HTTP response header sent to a web user without neutralizing malicious characters that can be interpreted as separator characters for headers.
    functional_areas: []
    likelihood: null
    potential_mitigations:
    - 'phase: Implementation, Implementation, Implementation, Implementation - strategy: Input Validation; Input Validation; Output Encoding; Input Validation'
    related_attack_patterns:
    - CAPEC-105
    - CAPEC-31
    - CAPEC-34
    - CAPEC-85
  name: Improper Neutralization of CRLF Sequences in HTTP Headers ('HTTP Request/Response Splitting')
