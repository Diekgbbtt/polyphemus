- abstraction: Base
  applies_if:
    nl: The unit builds an OS command from externally influenced input.
    predicate:
      clauses:
      - form: reachable-via
        key: EXPOSED_VIA
        role: null
        values:
        - WebPresentation
        - RESTApi
        - GraphQLApi
      target: Both
  enum_kinds:
  - RESTApi
  - GraphQLApi
  - WebPresentation
  fault_id: CWE-78
  materialisation:
    alternate_terms:
    - OS Command Injection
    - Shell injection
    - Shell metacharacters
    common_consequences: []
    description: The product constructs all or part of an OS command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended OS command when it is sent to a downstream component.
    extended_description: |-
      This weakness can lead to a vulnerability in environments in which the attacker does not have direct access to the operating system, such as in web applications. Alternately, if the weakness occurs in a privileged program, it could allow the attacker to specify commands that normally would not be accessible, or to call alternate commands with privileges that the attacker does not have. The problem is exacerbated if the compromised process does not follow the principle of least privilege, because the attacker-controlled commands may run with special system privileges that increases the amount of damage.

      There are at least two subtypes of OS command injection:

      The application intends to execute a single, fixed program that is under its own control. It intends to use externally-supplied inputs as arguments to that program. For example, the program might use system("nslookup [HOSTNAME]") to run nslookup and allow the user to supply a HOSTNAME, which is used as an argument. Attackers cannot prevent nslookup from executing. However, if the program does not remove command separators from the HOSTNAME argument, attackers could place the separators into the arguments, which allows them to execute their own program after nslookup has finished executing. The application accepts an input that it uses to fully select which program to run, as well as which commands to use. The application simply redirects this entire command to the operating system. For example, the program might use "exec([COMMAND])" to execute the [COMMAND] that was supplied by the user. If the COMMAND is under attacker control, then the attacker can execute arbitrary commands or programs. If the command is being executed using functions like exec() and CreateProcess(), the attacker might not be able to combine multiple commands together in the same line.

      From a weakness standpoint, these variants represent distinct programmer errors. In the first variant, the programmer clearly intends that input from untrusted parties will be part of the arguments in the command to be executed. In the second variant, the programmer does not intend for the command to be accessible to any untrusted party, but the programmer probably has not accounted for alternate ways in which malicious attackers can provide input.
    likelihood: High
    related_attack_patterns:
    - CAPEC-108
    - CAPEC-15
    - CAPEC-43
    - CAPEC-6
    - CAPEC-88
  name: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')
