name: polymerhus

networks:
  polymerhus-net:
    driver: bridge

volumes:
  neo4j-data:
  pg-data:
  n8n-data:
  kali-tools:      # persists massdns/puredns/kr so recreation never recompiles
  resolvers:
  work:

services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:v1.5.0rc3
    profiles: ["lightrag"]
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      WORKING_DIR: /app/data/rag_storage
      INPUT_DIR: /app/data/inputs
      PROMPT_DIR: /app/data/prompts
      SUMMARY_LANGUAGE: English
      ENTITY_EXTRACTION_USE_JSON: "false"
      ENTITY_TYPE_PROMPT_FILE: methodology_entities.yml
      LIGHTRAG_PARSER: "*:native-teP,*:legacy-R"
      VLM_PROCESS_ENABLE: "false"
      LLM_BINDING: ${LLM_BINDING:-ollama}
      LLM_BINDING_HOST: ${LLM_BINDING_HOST:-http://localhost:11434}
      LLM_MODEL: ${LLM_MODEL:-mistral-nemo:latest}
      LLM_BINDING_API_KEY: ${LLM_BINDING_API_KEY:-}
      EMBEDDING_BINDING: ${EMBEDDING_BINDING:-ollama}
      EMBEDDING_BINDING_HOST: ${EMBEDDING_BINDING_HOST:-http://localhost:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BINDING_API_KEY: ${EMBEDDING_BINDING_API_KEY:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      EMBEDDING_USE_BASE64: ${EMBEDDING_USE_BASE64:-false}
      MAX_PARALLEL_INSERT: ${MAX_PARALLEL_INSERT:-1}
      MAX_GRAPH_NODES: ${MAX_GRAPH_NODES:-5000}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${LIGHTRAG_PORT:-9621}:9621"
    volumes:
      - ./data/lightrag/rag_storage:/app/data/rag_storage
      - ./data/lightrag/inputs:/app/data/inputs
      - ./data/lightrag/prompts:/app/data/prompts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:9621/health', timeout=3).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  lightrag-writeups:
    image: ghcr.io/hkuds/lightrag:v1.5.0rc3
    profiles: ["lightrag"]
    environment:
      HOST: 0.0.0.0
      PORT: 9621
      WORKSPACE: writeups_0xdf
      WORKING_DIR: /app/data/writeups_rag_storage
      INPUT_DIR: /app/data/writeups_overlay
      PROMPT_DIR: /app/data/prompts
      SUMMARY_LANGUAGE: English
      ENTITY_EXTRACTION_USE_JSON: "false"
      ENTITY_TYPE_PROMPT_FILE: methodology_entities.yml
      LIGHTRAG_PARSER: "*:native-teP,*:legacy-R"
      VLM_PROCESS_ENABLE: "false"
      MAX_PARALLEL_INSERT: ${MAX_PARALLEL_INSERT:-1}
      MAX_GRAPH_NODES: ${MAX_GRAPH_NODES:-5000}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${LIGHTRAG_WRITEUP_PORT:-9622}:9621"
    volumes:
      - ./data/lightrag/writeups_rag_storage:/app/data/writeups_rag_storage
      - ./data/lightrag/inputs/writeups_overlay:/app/data/writeups_overlay
      - ./data/lightrag/prompts:/app/data/prompts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:9621/health', timeout=3).read()\nPY"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: polymerhus
      POSTGRES_PASSWORD: polymerhus
      POSTGRES_DB: polymerhus
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polymerhus -d polymerhus"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/polymerhus
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  kali:
    image: redamon-kali-sandbox:latest
    entrypoint: ["bash", "-lc", "/opt/postrun.sh && /opt/venv/bin/python /opt/mcp_server.py"]
    ports: ["8000:8000"]
    # VPN-in-container (D-HS e2e): OpenVPN needs to create a tun interface so
    # recon pods can reach a target that lives only on a VPN route. Least
    # privilege - NET_ADMIN + the tun device, deliberately NOT --privileged.
    # This replaces routing pod traffic through the host's tun, which does not
    # scale. postrun.sh self-heals the /dev/net/tun node if the host lacks it.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./kali/mcp_server.py:/opt/mcp_server.py:ro
      - ./kali/postrun.sh:/opt/postrun.sh:ro
      - kali-tools:/opt/localbin
      - resolvers:/resolvers
      - work:/work
    extra_hosts:
      # Route app.online.orders.com to the Docker host, where nginx publishes :443
      # and reverse-proxies to the correct backend. host_gateway = host's gateway IP.
      - "app.onlineorders.com:host-gateway"
      - "soupmarket.shop:192.33.91.87"
    networks: [polymerhus-net]

  agent:
    build: { context: ., dockerfile: Dockerfile }
    image: polymerhus-agent:latest
    environment:               # in-network defaults so a clean clone works without .env (I2)
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: polymerhus
      POSTGRES_DSN: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus
      KALI_MCP_URL: http://kali:8000/mcp
      PROJECT_ID: default
      LIGHTRAG_API_URL: http://lightrag:9621
      LIGHTRAG_BASE_API_URL: http://lightrag:9621
      INGESTION_ROOT: /data/ingestion
      INGESTION_NORMALIZED_DIR: /data/ingestion/normalized
      # --- LLM API gateway (#100) - the co-located litellm proxy (#104 T1) ----
      # The proxy is the SECOND ASGI process in this container; it starts BEFORE
      # the agent uvicorn and is polled on /health/liveliness before the agent
      # starts (ADR D10 ordering, see `gateway_entrypoint.py`).
      #
      # `DATABASE_URL` is litellm's own DB pointer. litellm's prisma schema
      # machinery assumes it OWNS its target database: pointed at the agent's
      # database it refuses to migrate (P3005, non-empty schema) or drops the
      # agent's tables (the db push path, verified live 2026-08-17). So the
      # gateway gets its OWN database on the SAME shared postgres instance
      # (STAR_MODEL_IN_DB=True under litellm's own tables) - the instance is
      # shared with the agent's checkpoints (POSTGRES_DSN above), the database
      # is not; the env var names differ between litellm and the agent's own
      # stack, hence the two keys. `polymerhus_gateway` is created by
      # db/postgres/init.sql on first volume init.
      DATABASE_URL: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus_gateway
      # `LITELLM_MASTER_KEY` is the service token authing the management API
      # the T2 sync uses to register models. A dev default ships here so a
      # clean clone runs; the operator's .env overrides it for any non-dev
      # env. NEVER a real production key in the repo (ADR D10).
      LITELLM_MASTER_KEY: sk-polymerhus-dev-gateway
      # The proxy listens on the internal port 4000 (D1); the client seam (T4,
      # #107) will set `LLM_GATEWAY_URL=http://127.0.0.1:4000` to route through
      # it. The port is NOT published to the host - it is intra-container only.
      #
      # Boot determinism: the proxy otherwise fetches the remote model cost map
      # from raw.githubusercontent.com at boot, which added up to 150 s of
      # network variance (and a silent hang on throttled networks) before the
      # proxy even bound its port (verified 2026-08-17). The gateway does NOT
      # use litellm's cost map - models.dev is the capability source (ADR D11)
      # - so we pin litellm to its bundled local copy.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    env_file:
      - path: .env
        required: false
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    volumes:
      - ./data/ingestion:/data/ingestion
    networks: [polymerhus-net]

  n8n:
    image: n8nio/n8n:1.102.4
    profiles: ["lightrag"]
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_USER_FOLDER: /home/node/.n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-change-me-32-bytes-min}
      POLYPHEMUS_AGENT_URL: http://ingestion:8080
      POLYPHEMUS_INGESTION_INBOX: /data/ingestion/inbox
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./data/ingestion:/data/ingestion
      - ./workflows/n8n:/workflows/n8n:ro
    depends_on:
      ingestion: { condition: service_healthy }
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ingestion:
    build: { context: ., dockerfile: src/polymerhus/Dockerfile.ingestion }
    image: polyphemus-ingestion:latest
    profiles: ["lightrag"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: polymerhus
      POSTGRES_DSN: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus
      KALI_MCP_URL: http://kali:8000/mcp
      LIGHTRAG_API_URL: http://lightrag:9621
      LIGHTRAG_BASE_API_URL: http://lightrag:9621
      LIGHTRAG_STORAGE_DIR: ${LIGHTRAG_STORAGE_DIR:-/data/lightrag/rag_storage}
      LIGHTRAG_INGESTION_TIMEOUT_SECONDS: ${LIGHTRAG_INGESTION_TIMEOUT_SECONDS:-1800}
      LIGHTRAG_POLL_INTERVAL_SECONDS: ${LIGHTRAG_POLL_INTERVAL_SECONDS:-2}
      INGESTION_ROOT: /data/ingestion
      INGESTION_NORMALIZED_DIR: /data/ingestion/normalized
      URL_DOWNLOAD_CONNECT_TIMEOUT: ${URL_DOWNLOAD_CONNECT_TIMEOUT:-10.0}
      URL_DOWNLOAD_READ_TIMEOUT: ${URL_DOWNLOAD_READ_TIMEOUT:-30.0}
      URL_DOWNLOAD_TOTAL_TIMEOUT: ${URL_DOWNLOAD_TOTAL_TIMEOUT:-120.0}
      URL_DOWNLOAD_MAX_REDIRECTS: ${URL_DOWNLOAD_MAX_REDIRECTS:-5}
      URL_DOWNLOAD_MAX_WIRE_BYTES: ${URL_DOWNLOAD_MAX_WIRE_BYTES:-10485760}
      URL_DOWNLOAD_MAX_DECODED_BYTES: ${URL_DOWNLOAD_MAX_DECODED_BYTES:-10485760}
      URL_DOWNLOAD_STREAM_CHUNK_SIZE: ${URL_DOWNLOAD_STREAM_CHUNK_SIZE:-65536}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${INGESTION_PORT:-8081}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      lightrag: { condition: service_healthy }
    volumes:
      - ./data/ingestion:/data/ingestion
      - ./data/lightrag/rag_storage:/data/lightrag/rag_storage:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
