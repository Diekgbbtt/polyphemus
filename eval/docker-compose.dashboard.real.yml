# Eval real dashboard overlay (real eval project artifacts).
#
# Brings up the read-only project/eval dashboard beside the normal stack:
#
#   EVAL_ARTIFACT_STORE_HOST_PATH=/srv/eval-artifacts \
#   EVAL_PROJECT_DATA_ROOT_HOST_PATH=/opt/polymerhus-dev/eval/instances/data/eval-server-1 \
#   EVAL_RUNS_ROOT_HOST_PATH=/opt/polymerhus-dev/eval/runs \
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f eval/docker-compose.dashboard.real.yml \
#     up -d --no-deps eval-api eval-dashboard
#
# Only these two services are named, with `--no-deps`: the agent, Neo4j,
# Postgres and the eval workers are never started, recreated or built, and the
# prebuilt images need no `--build`.
#
# Two services, both on the base `polymerhus-net`:
#   eval-api       the read API over the REAL artifact store (read-only host
#                  bind; GET /health, /snapshot, and the graph/artifact routes)
#   eval-dashboard Vite dev server for the project/eval pages, proxying
#                  /eval-api -> eval-api (loopback ports only)
#
# This overlay starts no demo generator and never reads the raw `live/` mirror
# as history. It mounts read-only sources beside the artifact store: the
# operator's real artifact store, the eval instance's persistent project data
# root (the allowlisted Hunting/Skill tree the resolved endpoint falls back to),
# and the primary harness runs root (each finished Trial's authoritative record,
# the source of the recorded-spend block). The agent base URL is used only to
# read the matching instance's current L0/L1 graph; nothing here writes to any
# mount.
#
# Host paths are overridable, and every bind must already exist: each source is
# declared with `bind.create_host_path: false`, so a missing or mistyped root
# fails loudly instead of becoming an empty directory that silently hides data.
#
#   EVAL_ARTIFACT_STORE_HOST_PATH   -> /srv/eval-artifacts      (materialized store)
#   EVAL_PROJECT_DATA_ROOT_HOST_PATH-> /srv/eval-project-data   (raw project data)
#   EVAL_RUNS_ROOT_HOST_PATH        -> /srv/eval-runs           (current records)
#   EVAL_GRAPH_TIMEOUT_SECONDS      -> the current-graph read timeout (default 20;
#                                      finite, 1..30 s, else the safe default)
#
# Historical records live in a second, OPTIONAL root. New installations do not
# need it; a host that still holds earlier eval records adds the companion
# overlay, which mounts that tree read-only and sets EVAL_RUNS_LEGACY_ROOT:
#
#   EVAL_RUNS_LEGACY_ROOT_HOST_PATH=/opt/eval-platform-model/eval/runs \
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f eval/docker-compose.dashboard.real.yml \
#     -f eval/docker-compose.dashboard.legacy.yml \
#     up -d --no-deps eval-api eval-dashboard
#
# The read API searches both runs roots; a record present in two different roots
# is ambiguous (never arbitrarily chosen), and the same root mounted twice - or
# listed twice - is read once. Verify every host root exists before starting: a
# missing one is a stop-and-confirm, never a directory to invent. On the existing
# eval server `.eval-dashboard.env` still pins the previous
# EVAL_RUNS_ROOT_HOST_PATH; a shell export takes precedence, so pass the current
# value on the command line and leave that file untouched.

volumes:
  # The frontend's dependencies, kept out of the bind-mounted working tree.
  eval-dashboard-node-modules:

services:
  eval-api:
    image: polymerhus-agent:latest
    restart: unless-stopped
    working_dir: /srv/eval
    environment:
      PYTHONPATH: /srv/eval
      # The real store is mounted read-only at this fixed container path.
      EVAL_ARTIFACT_STORE: /srv/eval-artifacts
      EVAL_DATASET_ID: webexploitbench
      EVAL_DATASET_NAME: WebExploitBench
      # The resolved workspace sources. The project data root is the eval
      # instance's raw project directory; the agent base URL is read only for
      # the current L0/L1 graph of the matching instance. EVAL_INSTANCE_ID gates
      # fallback: only a Trial from this instance may read these sources.
      EVAL_PROJECT_DATA_ROOT: /srv/eval-project-data
      EVAL_AGENT_BASE_URL: http://agent:8080
      # The current L0/L1 graph read is bounded: a large project (thousands of
      # nodes) can take several seconds, so the default is 20 s (finite, 1..30;
      # an invalid value falls back to 20). The SPA allows a slightly longer
      # wait than the server so a slow-but-successful read is never cut early.
      EVAL_GRAPH_TIMEOUT_SECONDS: ${EVAL_GRAPH_TIMEOUT_SECONDS:-20}
      EVAL_INSTANCE_ID: ${EVAL_INSTANCE_ID:-eval-server-1}
      # The primary harness runs root holds each finished Trial's authoritative
      # record (arbitrary filename); the recorded-spend block resolves it by full
      # Trial identity. Mounted read-only, and never required for the rest of
      # the report: an unset host path leaves spend "non disponibile".
      # The optional historical root is added by the legacy overlay, which sets
      # EVAL_RUNS_LEGACY_ROOT beside this one.
      EVAL_RUNS_ROOT: /srv/eval-runs
    volumes:
      # Every source is a read-only bind that must already exist.
      - type: bind
        source: ./eval
        target: /srv/eval
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${EVAL_ARTIFACT_STORE_HOST_PATH:-/srv/eval-artifacts}
        target: /srv/eval-artifacts
        read_only: true
        bind:
          create_host_path: false
      # The eval instance's persistent project data root (the driver's
      # EVAL_DATA_ROOT default), always read-only.
      - type: bind
        source: ${EVAL_PROJECT_DATA_ROOT_HOST_PATH:-/opt/polymerhus-dev/eval/instances/data/eval-server-1}
        target: /srv/eval-project-data
        read_only: true
        bind:
          create_host_path: false
      # The primary harness runs root, always read-only. It is a separate source
      # from the artifact store: the store holds the materialized Trial, the
      # runs root holds the harness's own record with its spend fields.
      - type: bind
        source: ${EVAL_RUNS_ROOT_HOST_PATH:-/opt/polymerhus-dev/eval/runs}
        target: /srv/eval-runs
        read_only: true
        bind:
          create_host_path: false
    command:
      - python
      - -m
      - uvicorn
      - read_api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    ports:
      - "127.0.0.1:${EVAL_API_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [polymerhus-net]

  eval-dashboard:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /srv/frontend
    environment:
      VITE_EVAL_API_BASE_URL: /eval-api
      EVAL_PROXY_TARGET: http://eval-api:8090
      AGENT_PROXY_TARGET: http://agent:8080
    volumes:
      - ./frontend:/srv/frontend
      - eval-dashboard-node-modules:/srv/frontend/node_modules
    command:
      - sh
      - -c
      - >-
        npm ci --no-audit --no-fund
        && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:${EVAL_DASHBOARD_PORT:-5173}:5173"
    depends_on:
      eval-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5173/eval')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [polymerhus-net]
