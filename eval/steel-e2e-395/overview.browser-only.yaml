login_endpoint: /api/login
required_headers:
  - 'Content-Type: application/json'
mechanism: password
defences:
  - >-
    steel-e2e fixture overlay: request replay is deliberately disabled for this
    run. The target is actually request-replayable; this is test configuration,
    not a target fact.
fingerprinting: >-
  Apache Shiro session cookie JSESSIONID plus a rememberMe cookie; every API
  answer carries the JSON envelope {code, message, result}; the SPA shell is a
  Vue 2 build titled 白卷 - White Jotter, and no Server header is returned.
technical_conditions:
  - name: session-cookie-replay
    check: >-
      GET /api/authentication with Cookie JSESSIONID=<session> returns HTTP 200
      and the body 身份认证成功; the same request without the cookie, or with a
      stale identifier, answers HTTP 302 with Location /nowhere.
  - name: admin-role-gate
    check: >-
      GET /api/admin/user with the administrator session returns HTTP 200,
      code 200 and a result list carrying username admin with role sysAdmin;
      the same call from the member session returns HTTP 200 with a zero-byte
      body (URLPathMatchingFilter denies by returning false, so an
      authorization denial carries no status code).
  - name: login-failure-envelope
    check: >-
      POST /api/login with a wrong password returns HTTP 200 with
      {"code":400,"message":"密码错误"}; an unknown username returns
      {"code":400,"message":"账号不存在"}. Neither is a 401, a 403 or a 429.
  - name: session-process-bound
    check: >-
      Shiro keeps sessions in the JVM (no session DAO; Redis is a cache only),
      so the JSESSIONID stops authenticating after a wj restart or roughly 30
      minutes idle; re-run sign-in when session-cookie-replay answers 302.
  - name: signup-duplicate
    check: >-
      POST /api/register with an existing username returns HTTP 200 and
      {"code":400,"message":"用户已存在"}; an empty username or password returns
      {"code":400,"message":"用户名和密码不能为空"}; a fresh username returns
      {"code":200,"result":"注册成功"}.
anti-bot: steel-e2e-browser-only-fixture
http-client-replayability: false
auth_probe:
  url: /api/authentication
notes: >-
  White Jotter (Spring Boot + Apache Shiro + Vue 2 SPA) served behind a
  path-stripping proxy at the target root. Authentication is a JSON password
  POST to /api/login; success sets a JSESSIONID cookie plus a rememberMe cookie
  and returns {"code":200,"result":"<username>"}. The rememberMe cookie alone
  does not authenticate (a request carrying only rememberMe answers the 302
  /nowhere), so replay is the JSESSIONID cookie alone, with no required header,
  no CSRF token and no client-hint binding. Probes saw no blocking defence: no
  WAF header, no challenge script, no bot-management cookie, and twelve rapid
  failed logins all answered HTTP 200 with the application envelope, so no
  rate_limited or waf_protected signal fired. Self-service registration exists
  at POST /api/register and mints an enabled account with no admin role.
  STEEL E2E FIXTURE OVERLAY: the operator sets anti-bot truthy and
  http-client-replayability false to force the browser-only branch for this
  test. This is not a claim that the target requires a browser. The live Steel
  session wj-gateway-e2e holds the pre-authenticated browser context.
  THE ORACLE: GET /api/authentication answers 2xx with the authenticated
  session and 302 /nowhere without it. 2xx passes, 401/403/3xx fails, anything
  else is indeterminate and stops the run.
