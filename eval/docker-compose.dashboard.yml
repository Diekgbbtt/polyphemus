# Eval demo dashboard overlay (#278).
#
# One command brings up the whole demo beside the normal stack:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f eval/docker-compose.dashboard.yml up --build
#
# Three throwaway services, all on the base `polymerhus-net`:
#   eval-store     one-shot: writes the SYNTHETIC demo store into a dedicated volume
#   eval-api       the read API (read-only store mount, GET /health + /snapshot on 0.0.0.0:8090)
#   eval-dashboard Vite dev server for the /eval pages (0.0.0.0:5173, proxies /eval-api -> eval-api)
#
# The store volume is demo-only by construction: it is a separate named volume,
# never the operator's `EVAL_ARTIFACT_STORE`. Nothing here reads or writes a real
# artifact store, and no credential or host path is baked in. Both published
# ports bind to loopback only. Neither the base nor the dev file is touched, so
# the normal `docker compose up` is unchanged.

volumes:
  # The synthetic demo store: generated by `eval-store`, mounted read-only by
  # `eval-api`. Deliberately NOT the real artifact store.
  eval-dashboard-store:
  # The frontend's dependencies, kept out of the bind-mounted working tree.
  eval-dashboard-node-modules:

services:
  # One-shot generator: reuse the Python runtime Polyphemus already builds, bind
  # the eval tree and put it on PYTHONPATH. No new dependency - the image already
  # carries uvicorn/fastapi/pyyaml, and the generator is stdlib + PyYAML.
  eval-store:
    image: polymerhus-agent:latest
    working_dir: /srv/eval
    environment:
      PYTHONPATH: /srv/eval
    volumes:
      - ./eval:/srv/eval:ro
      - eval-dashboard-store:/srv/eval-store
    command:
      - python
      - -m
      - read_api.demo_data
      - --output
      - /srv/eval-store
    restart: "no"
    networks: [polymerhus-net]

  # The read API. It only ever reads: the source tree and the store are both
  # mounted read-only, and the app exposes only `GET /snapshot` and `GET /health`.
  eval-api:
    image: polymerhus-agent:latest
    working_dir: /srv/eval
    environment:
      PYTHONPATH: /srv/eval
      EVAL_ARTIFACT_STORE: /srv/eval-store
      EVAL_DATASET_ID: webexploitbench
      EVAL_DATASET_NAME: WebExploitBench
    volumes:
      - ./eval:/srv/eval:ro
      - eval-dashboard-store:/srv/eval-store:ro
    command:
      - python
      - -m
      - uvicorn
      - read_api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    ports:
      - "127.0.0.1:${EVAL_API_PORT:-8090}:8090"
    depends_on:
      eval-store:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [polymerhus-net]

  # The Vite dev server. The SPA keeps its relative `/eval-api` base, which the
  # dev server proxies to the read API; the agent proxy target is pointed at the
  # stack's agent so the non-eval pages keep working from the same server.
  eval-dashboard:
    image: node:22-alpine
    working_dir: /srv/frontend
    environment:
      VITE_EVAL_API_BASE_URL: /eval-api
      EVAL_PROXY_TARGET: http://eval-api:8090
      AGENT_PROXY_TARGET: http://agent:8080
    volumes:
      - ./frontend:/srv/frontend
      - eval-dashboard-node-modules:/srv/frontend/node_modules
    command:
      - sh
      - -c
      - >-
        npm ci --no-audit --no-fund
        && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:${EVAL_DASHBOARD_PORT:-5173}:5173"
    depends_on:
      eval-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5173/eval')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [polymerhus-net]
