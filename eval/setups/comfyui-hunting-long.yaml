# A seeded-project hunting trial (#277): hunt directly against a pre-recon'd
# project whose L0/L1 already exists, instead of re-running recon/analysis.
#
# The project below is the known-good local example (L1 24 services / 8
# systems); its pg + neo4j volumes are transferred onto the eval instance and
# its `target_seed` is updated to this run's synthetic Host before the trial.
# The transfer and verification procedure is `eval/SEEDED-L0L1.md`.
#
# With `existing_project_id` set the trial makes no project-creating or
# project-mutating call and runs no scaffold command: it asserts the project
# exists, asserts its L1 carries services, places any pre-mined artifacts, and
# enters hunting. `start_phase: hunting` is therefore required (and is also the
# default when the key is omitted).

schema_version: 1

# Outside the repo (D7/D12: the store is a durable sink, never the data root).
artifact_store: /srv/eval-artifacts

datasets:
  - webexploitbench

# Eval-wide pre-eval data dependencies (D14/N12). A seeded run needs no L1
# projection work item: the L1 is transferred in, not scaffolded.
work_items:
  - name: auth-bootstrap
    status: incomplete
    required: false
  - name: l1-surface
    status: complete
  - name: hunting-artifacts
    status: complete

instances:
  - instance_id: eval-server-1
    env_file: eval-server-1/.env
    targets:
      - target_key: webexploitbench/comfyui
        target_id: comfyui-1
        # #277: enter at hunting by reusing the transferred project.
        start_phase: hunting
        existing_project_id: 12da8565-a266-4610-9968-9ebfb86dd563
        # A small cap for a short seeded hunting run (3 consumed hunt configs).
        target_config:
          operator_kb: eval/data/webexploitbench/comfyui/operator_kb.md

# `alignment:` is intentionally absent: no migrations/rebuilds are declared.
