# A mock local-target setup: verifies the local target wiring (D45/D46) end to
# end without a real WebExploitBench build. The `webmock` target
# (`eval/mock/webmock/`) is copied into the dataset checkout (`$EVAL_WEB_DIR`,
# default `~/WebExploitBench`) so `scripts/targetctl` discovers it, and the
# orchestrator parametrises it exactly like a real target.
#
# Two TargetRuns of the same target let `next-target` exercise the whole chain:
# advancing from `webmock-1` to `webmock-2` tears the first down, reclaims its
# image, provisions and brings up the second, and verifies health.
#
# The instance is the eval server's running instance: `next-target` reuses its
# kali container for the synthetic-Host alias, so the instance stack itself is
# never touched (the target lifecycle is the code under test, not the stack).

schema_version: 1

artifact_store: /srv/eval-artifacts

work_items:
  - name: auth-bootstrap
    status: complete
  - name: l1-surface
    status: complete
  - name: hunting-artifacts
    status: complete

instances:
  - instance_id: eval-server-1
    env_file: eval-server-1/.env
    targets:
      - target_id: webmock-1
        target_config:
          lifecycle: targetctl
          params:
            target: webmock
      - target_id: webmock-2
        target_config:
          lifecycle: targetctl
          params:
            target: webmock
