# The data-loading services: n8n (the workflow orchestrator) and the ingestion
# ASGI service it drives. Deliberately NOT part of the baseline stack - bring
# them up explicitly, without any compose `profiles` mechanism, only when data
# needs to be loaded:
#
#   docker compose -f docker-compose.yml -f docker-compose.ingestion.yml \
#     up -d ingestion n8n
#
# The base `docker-compose.yml` supplies the shared `polymerhus-net` network and
# the `postgres`/`neo4j`/`lightrag` dependencies; `n8n-data` is declared here
# because it is owned solely by this overlay.
services:
  n8n:
    image: n8nio/n8n:1.102.4
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_USER_FOLDER: /home/node/.n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-dev-change-me-32-bytes-min}
      POLYPHEMUS_AGENT_URL: http://ingestion:8080
      POLYPHEMUS_INGESTION_INBOX: /data/ingestion/inbox
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./lightrag/data/ingestion:/data/ingestion
      - ./lightrag/workflows/n8n:/workflows/n8n:ro
    depends_on:
      ingestion: { condition: service_healthy }
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  ingestion:
    build: { context: ., dockerfile: src/polymerhus/Dockerfile.ingestion }
    image: polyphemus-ingestion:latest
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: polymerhus
      POSTGRES_DSN: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus
      KALI_MCP_URL: http://kali:8000/mcp
      LIGHTRAG_API_URL: http://lightrag:9621
      LIGHTRAG_BASE_API_URL: http://lightrag:9621
      LIGHTRAG_STORAGE_DIR: ${LIGHTRAG_STORAGE_DIR:-/data/lightrag/rag_storage}
      LIGHTRAG_INGESTION_TIMEOUT_SECONDS: ${LIGHTRAG_INGESTION_TIMEOUT_SECONDS:-1800}
      LIGHTRAG_POLL_INTERVAL_SECONDS: ${LIGHTRAG_POLL_INTERVAL_SECONDS:-2}
      INGESTION_ROOT: /data/ingestion
      INGESTION_NORMALIZED_DIR: /data/ingestion/normalized
      URL_DOWNLOAD_CONNECT_TIMEOUT: ${URL_DOWNLOAD_CONNECT_TIMEOUT:-10.0}
      URL_DOWNLOAD_READ_TIMEOUT: ${URL_DOWNLOAD_READ_TIMEOUT:-30.0}
      URL_DOWNLOAD_TOTAL_TIMEOUT: ${URL_DOWNLOAD_TOTAL_TIMEOUT:-120.0}
      URL_DOWNLOAD_MAX_REDIRECTS: ${URL_DOWNLOAD_MAX_REDIRECTS:-5}
      URL_DOWNLOAD_MAX_WIRE_BYTES: ${URL_DOWNLOAD_MAX_WIRE_BYTES:-10485760}
      URL_DOWNLOAD_MAX_DECODED_BYTES: ${URL_DOWNLOAD_MAX_DECODED_BYTES:-10485760}
      URL_DOWNLOAD_STREAM_CHUNK_SIZE: ${URL_DOWNLOAD_STREAM_CHUNK_SIZE:-65536}
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${INGESTION_PORT:-8081}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      lightrag: { condition: service_healthy }
    volumes:
      - ./lightrag/data/ingestion:/data/ingestion
      - ./lightrag/data/lightrag/rag_storage:/data/lightrag/rag_storage:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  n8n-data: