# E2E overlay for the #206 live tier from the merged tree.
#
# The base `docker-compose.yml` reads `env_file: .env` (missing in a
# worktree - .env is gitignored and lives only in the main checkout), so
# without this overlay the agent would boot without API keys or Langfuse.
# This file points the service at the MAIN tree .env (`../../.env` from a
# `.worktrees/<name>` checkout, or whatever `POLYPHEMUS_MAIN_ENV` names):
# same credentials, same components as production. Test knobs
# (detection bound, threshold, model override, output budget) are NOT set
# here - they ride `docker compose exec -e` on the driven snippets only,
# so the agent/gateway processes themselves run the production env.
#
# Usage (from this worktree):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#     -f docker-compose.e2e.yml up -d postgres neo4j kali agent
services:
  agent:
    env_file:
      # Overridable so the overlay is not tied to one machine's absolute path;
      # `required: false` keeps a worktree that has its own `.env` symlink
      # working, and degrades to "agent boots without the overlay keys" only
      # when neither the symlink nor the main-tree file exists.
      - path: ${POLYPHEMUS_MAIN_ENV:-../../.env}
        required: false
    # --- #238 (Task 9): the deterministic LOCAL model provider --------------
    # The functional E2E must traverse the real actor loop, so only model
    # INFERENCE is replaced: both long-horizon recon roles are routed at the
    # local fixture through the production provider-selection seam
    # (`LLM_GATEWAY_URL` = gateway mode, `openai:<model>` = the role's model).
    # The key is inert by construction - the fixture authenticates nothing.
    #
    # `depends_on` MERGES with the base service's postgres/neo4j dependency, so
    # the agent cannot start a run before the fixture answers its healthcheck.
    environment:
      LLM_GATEWAY_URL: http://rate-limit-llm:8080/v1
      LLM_JOB_ORCHESTRATOR: openai:rate-admission-fixture
      LLM_TRIAGER: openai:rate-admission-fixture
      API_KEY_OPENAI: e2e-inert-key
    depends_on:
      rate-limit-llm:
        condition: service_healthy
  # The deterministic OpenAI-compatible provider (Task 9). One process, no
  # state beyond its request counters; it answers from the conversation state
  # alone and refuses any state it does not implement with a content-free 422.
  rate-limit-llm:
    image: python:3.12-alpine
    command: ["python", "/srv/deterministic_llm_provider.py"]
    environment:
      RATE_LLM_HOST: "0.0.0.0"
      RATE_LLM_PORT: "8080"
    volumes:
      - ./tests/e2e/deterministic_llm_provider.py:/srv/deterministic_llm_provider.py:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
  # --- WAF fixtures (#196) -------------------------------------------------
  # Two shapes of "the target defends itself", both on port 80 so the lease's
  # REDIRECT (tcp/80 and tcp/443) captures them:
  #   * waf-e2e-target       - OWASP ModSecurity CRS: a real engine, BLOCKING a
  #                            payload with 403 + its own action page.
  #   * challenge-e2e-target - vendor-shaped CHALLENGE (interstitial + cf-ray),
  #                            whose cookie is the control group (one request,
  #                            challenge off).
  waf-e2e-target:
    image: owasp/modsecurity-crs:nginx
    environment:
      PORT: "8080"
      BACKEND: "http://http-e2e-target:80"
      SERVER_NAME: "waf.e2e.local"
      MODSEC_RULE_ENGINE: "on"
      PARANOIA: "1"
      # The default inbound anomaly threshold is 5; a single XSS/LFI payload
      # scores exactly that, so one rule-based block is enough to produce 403.
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    networks: [polymerhus-net]
  # The engine runs unprivileged on 8080 (it refuses privileged ports); this
  # front makes it reachable on port 80 INSIDE the network, which is what the
  # lease's transparent REDIRECT (tcp/80, tcp/443) can capture.
  waf-e2e-front:
    image: python:3.12-alpine
    command: ["python", "/srv/tcp_forwarder.py"]
    environment:
      LISTEN_PORT: "80"
      UPSTREAM_HOST: "waf-e2e-target"
      UPSTREAM_PORT: "8080"
    volumes:
      - ./tests/e2e/tcp_forwarder.py:/srv/tcp_forwarder.py:ro
    networks:
      polymerhus-net:
        ipv4_address: 172.28.0.21
  challenge-e2e-target:
    image: python:3.12-alpine
    command: ["python", "/srv/http_challenge_target.py"]
    environment:
      PORT: "80"
      BACKEND: "http://http-e2e-target:80"
    volumes:
      - ./tests/e2e/http_challenge_target.py:/srv/http_challenge_target.py:ro
    networks:
      polymerhus-net:
        ipv4_address: 172.28.0.22
  http-e2e-target:
    image: python:3.12-alpine
    command: ["python", "/srv/http_e2e_target.py"]
    environment:
      PORT: "80"
      KALI_HTTP_E2E_COOKIE_VALUE: "e2e-session"
    volumes:
      - ./tests/e2e/http_e2e_target.py:/srv/http_e2e_target.py:ro
    networks:
      polymerhus-net:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/?q=health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  # --- rate-limit fixture (#238 Task 8) ------------------------------------
  # The DETERMINISTIC limiter the rate-mapping E2E measures: a known token
  # bucket on /canonical (stable 429 fingerprint), a route-normalization
  # variant on the unlimited /canonical/ that serves the SAME resource, and
  # per-request counters for the aggregate-load assertions. Local by design -
  # a mapping gate must never aim the load generator at the internet.
  rate-limit-e2e-target:
    image: python:3.12-alpine
    command: ["python", "/srv/rate_limit_e2e_target.py"]
    environment:
      PORT: "80"
      # Capacity 1 at 1 rps: a sustained 1 rps step fits (with the fixture's
      # documented scheduling tolerance), and 2 rps refuses even in the
      # mapper's one-second boundary probe. That is the transition the mapper
      # has to bracket.
      RATE_PER_S: "1.0"
      RATE_JITTER_S: "0.15"
    volumes:
      - ./tests/e2e/rate_limit_e2e_target.py:/srv/rate_limit_e2e_target.py:ro
    networks:
      polymerhus-net:
        ipv4_address: 172.28.0.23
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/counters', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
  # --- #238 follow-up (Task 8): the deterministic posture matrix --------------
  # ONE application, five isolated instances: identical route logic, a different
  # `RATE_FIXTURE_POSTURE` each, and never shared counters. Each is reachable by
  # its Compose DNS alias from the agent/Kali (no host ports needed), and each
  # control endpoint bypasses limiter accounting.
  rate-matrix-no-limiter:
    image: python:3.12-alpine
    command: ["python", "/srv/rate_limit_matrix_target.py"]
    environment:
      PORT: "80"
      RATE_FIXTURE_POSTURE: "no_limiter"
    volumes:
      - ./tests/e2e/rate_limit_matrix_target.py:/srv/rate_limit_matrix_target.py:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
  rate-matrix-high-limit:
    image: python:3.12-alpine
    command: ["python", "/srv/rate_limit_matrix_target.py"]
    environment:
      PORT: "80"
      RATE_FIXTURE_POSTURE: "high_limit"
    volumes:
      - ./tests/e2e/rate_limit_matrix_target.py:/srv/rate_limit_matrix_target.py:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
  rate-matrix-low-limit:
    image: python:3.12-alpine
    command: ["python", "/srv/rate_limit_matrix_target.py"]
    environment:
      PORT: "80"
      RATE_FIXTURE_POSTURE: "low_limit"
    volumes:
      - ./tests/e2e/rate_limit_matrix_target.py:/srv/rate_limit_matrix_target.py:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
  rate-matrix-false-bypass:
    image: python:3.12-alpine
    command: ["python", "/srv/rate_limit_matrix_target.py"]
    environment:
      PORT: "80"
      RATE_FIXTURE_POSTURE: "false_bypass"
    volumes:
      - ./tests/e2e/rate_limit_matrix_target.py:/srv/rate_limit_matrix_target.py:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
  rate-matrix-burst-inconclusive:
    image: python:3.12-alpine
    command: ["python", "/srv/rate_limit_matrix_target.py"]
    environment:
      PORT: "80"
      RATE_FIXTURE_POSTURE: "burst_inconclusive"
    volumes:
      - ./tests/e2e/rate_limit_matrix_target.py:/srv/rate_limit_matrix_target.py:ro
    networks: [polymerhus-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health', timeout=2).read()"]
      interval: 5s
