# The ONE e2e compose for a side worktree.
#
# A side worktree runs its own `agent` (built from THIS tree, live-mounted) as a
# sibling of the main-worktree stack: the same shared network, service DNS
# identical to production, and the MAIN tree `.env` (gateway keys, Langfuse,
# thresholds). The base services (postgres/neo4j/kali/lightrag) stay owned by
# the base `polymerhus` project - bring them up from the main tree FIRST (that
# creates the shared `polymerhus_polymerhus-net`), then from this worktree:
#
#   docker compose -f docker-compose.e2e.yml up -d --build agent
#
# `name:` gives this sibling its OWN project so it never clobbers the main
# `polymerhus-agent-1` container (the base `docker-compose.yml` pins
# `name: polymerhus`, which every worktree would otherwise reuse).
#
# This file also carries the e2e fixtures (the WAF / challenge / plain HTTP
# targets) on the same shared network, so the single side-worktree overlay is
# the whole e2e surface. The agent's loopback-bound gateway (ADR D1) is exposed
# for host-side probing through 127.0.0.1:14000, relayed in-container by
# `tools/gateway_relay.py`.
#
# The main-tree `.env` is gitignored and lives only in the main checkout, so it
# is pointed at relatively by default (`../../.env`, i.e. `<main>/.env` from a
# `<main>/.worktrees/<name>` checkout) and overridable through
# `POLYPHEMUS_MAIN_ENV`. `required: false` keeps a worktree that carries its own
# `.env` working.
name: polymerhus-e2e

services:
  agent:
    build: { context: ., dockerfile: Dockerfile }
    image: polymerhus-agent-e2e:latest
    environment:
      # In-network view - identical to the base agent's defaults.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: polymerhus
      POSTGRES_DSN: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus
      KALI_MCP_URL: http://kali:8000/mcp
      PROJECT_ID: e2e
      LIGHTRAG_API_URL: http://lightrag:9621
      LIGHTRAG_BASE_API_URL: http://lightrag:9621
      INGESTION_ROOT: /data/ingestion
      INGESTION_NORMALIZED_DIR: /data/ingestion/normalized
      # The co-located litellm proxy (#100) gets its OWN database on the SHARED
      # postgres instance (ADR D1): litellm owns its schema and refuses/destroys
      # a shared one (P3005, verified 2026-08-17). Created by db/postgres/init.sql.
      DATABASE_URL: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus_gateway
      LITELLM_MASTER_KEY: sk-polymerhus-dev-gateway
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Live source: edits apply without a rebuild (the tier tests the edited
      # tree, never the baked image layer). The proxy never reloads (ADR D1).
      AGENT_UVICORN_ARGS: "--reload --reload-dir /srv/src --reload-dir /srv/lightrag"
    env_file:
      - path: ${POLYPHEMUS_MAIN_ENV:-../../.env}
        required: false
    # 8081: the side-worktree agent's published port, kept distinct from the main
    # agent's 8080. 14000: the in-container gateway relay (tools/gateway_relay.py
    # rebinds 0.0.0.0:14000 -> 127.0.0.1:4000) so a host-side probe can reach it.
    ports: ["8081:8080", "127.0.0.1:14000:14000"]
    volumes:
      - ./src:/srv/src
      - ./data:/srv/data   # app-owned data root (#234): skills + hunting memory
      - ./lightrag:/srv/lightrag
      - ./db:/srv/db
      - ./skills:/srv/skills
      - ./gateway:/srv/gateway
      - ./lightrag/data/ingestion:/data/ingestion
    networks:
      - polymerhus-net

  # --- WAF fixtures (#196) -------------------------------------------------
  # Two shapes of "the target defends itself", both on port 80 so the lease's
  # REDIRECT (tcp/80 and tcp/443) captures them:
  #   * waf-e2e-target       - OWASP ModSecurity CRS: a real engine, BLOCKING a
  #                            payload with 403 + its own action page.
  #   * challenge-e2e-target - vendor-shaped CHALLENGE (interstitial + cf-ray),
  #                            whose cookie is the control group (one request,
  #                            challenge off).
  waf-e2e-target:
    image: owasp/modsecurity-crs:nginx
    environment:
      PORT: "8080"
      BACKEND: "http://http-e2e-target:80"
      SERVER_NAME: "waf.e2e.local"
      MODSEC_RULE_ENGINE: "on"
      PARANOIA: "1"
      # The default inbound anomaly threshold is 5; a single XSS/LFI payload
      # scores exactly that, so one rule-based block is enough to produce 403.
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    networks: [polymerhus-net]
  # The engine runs unprivileged on 8080 (it refuses privileged ports); this
  # front makes it reachable on port 80 INSIDE the network, which is what the
  # lease's transparent REDIRECT (tcp/80, tcp/443) can capture.
  waf-e2e-front:
    image: python:3.12-alpine
    command: ["python", "/srv/tcp_forwarder.py"]
    environment:
      LISTEN_PORT: "80"
      UPSTREAM_HOST: "waf-e2e-target"
      UPSTREAM_PORT: "8080"
    volumes:
      - ./tests/e2e/tcp_forwarder.py:/srv/tcp_forwarder.py:ro
    networks:
      polymerhus-net:
        ipv4_address: 172.28.0.21
  challenge-e2e-target:
    image: python:3.12-alpine
    command: ["python", "/srv/http_challenge_target.py"]
    environment:
      PORT: "80"
      BACKEND: "http://http-e2e-target:80"
    volumes:
      - ./tests/e2e/http_challenge_target.py:/srv/http_challenge_target.py:ro
    networks:
      polymerhus-net:
        ipv4_address: 172.28.0.22
  http-e2e-target:
    image: python:3.12-alpine
    command: ["python", "/srv/http_e2e_target.py"]
    environment:
      PORT: "80"
      KALI_HTTP_E2E_COOKIE_VALUE: "e2e-session"
    volumes:
      - ./tests/e2e/http_e2e_target.py:/srv/http_e2e_target.py:ro
    networks:
      polymerhus-net:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/?q=health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

networks:
  polymerhus-net:
    external: true
    name: polymerhus_polymerhus-net
