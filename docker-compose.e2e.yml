# Sibling hunting-e2e agent (agent-1) for the candidates-rewrite worktree.
# Brings up a SEPARATE agent container from the polymerhus-agent image that
# loads THIS worktree's tree (src/db/skills/gateway), attached to the existing
# polymerhus-<...> stack's network so it resolves neo4j/postgres/kali by
# service DNS. Published on 8081 so it does not collide with the main agent's
# 8080. The walking-tier tests point at this container (AGENT_HTTP_URL).
#
# Usage from this worktree:
#   docker compose -f docker-compose.e2e.yml up -d agent-1
name: polymerhus-hunting-e2e

services:
  agent-1:
    image: polymerhus-agent:latest
    container_name: polymerhus-hunting-e2e-agent-1
    # Same in-network defaults as the base compose `agent` service so the
    # sibling resolves its datastores exactly like the real agent; the layer
    # below env_file (compose: environment > env_file).
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: polymerhus
      POSTGRES_DSN: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus
      KALI_MCP_URL: http://kali:8000/mcp
      PROJECT_ID: default
      DATABASE_URL: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus_gateway
      LITELLM_MASTER_KEY: sk-polymerhus-dev-gateway
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    env_file:
      - path: .env
        required: true
    ports: ["8081:8080"]
    volumes:
      - ./src:/srv/src
      - ./db:/srv/db
      - ./skills:/srv/skills
      - ./gateway:/srv/gateway
    networks:
      polymerhus-net:
        aliases: [agent-1]

networks:
  polymerhus-net:
    external: true
    name: polymerhus_polymerhus-net