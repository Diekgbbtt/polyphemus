# Standalone synthetic *storage-compatibility* demo (see
# eval/read_api/storage_compat_corpus.py).
#
# This single file is a whole, self-contained Compose project: it starts a
# generator, the read API and the production frontend, and nothing else. It is
# NOT merged with the base stack, so no agent, Neo4j, Postgres, Kali or eval
# worker is ever started, and the real artifact store, raw project data,
# benchmark ground truth and Neo4j are never mounted. It has its own project
# name, its own network and its own named volumes, under `demo-*` identities.
#
#   docker compose -f docker-compose.storage-compat-demo.yml up -d
#   docker compose -f docker-compose.storage-compat-demo.yml port eval-dashboard 5173
#   docker compose -f docker-compose.storage-compat-demo.yml down
#
# Both published ports bind to loopback only, so reach the dashboard through an
# SSH tunnel (recommended) rather than exposing it:
#
#   ssh -N -L 25173:127.0.0.1:25173 root@<host>
#
# The corpus is generated by a one-shot `eval-corpus` service into a dedicated
# named volume; the read API mounts that same volume read-only. To add one new
# Trial, one new allowlisted artifact and one new/updated spend record WITHOUT
# restarting the API (the frontend's own polling then picks them up), run the
# generator again as an explicit, one-off action - never a background timer:
#
#   docker compose -f docker-compose.storage-compat-demo.yml \
#     run --rm eval-corpus python -m read_api.storage_compat_corpus \
#     --root /srv/corpus --refresh
#
# The demo verifies integration and rendering only: operator ground truth and
# live token usage are out of scope, and it does not recover artifacts deleted
# from any historical capture.
name: polyphemus-storage-compat-demo

networks:
  # A dedicated network: the demo never joins the real `polymerhus-net`.
  storage-compat-net:

volumes:
  # The synthetic corpus (store + raw + runs + runs-legacy), written by the
  # generator and read read-only by the API. Deliberately NOT a host path and
  # never the operator's real `EVAL_ARTIFACT_STORE`.
  storage-compat-corpus:
  # The frontend's dependencies, kept out of the bind-mounted working tree.
  storage-compat-node-modules:

services:
  # One-shot generator: reuses the Python runtime Polyphemus already builds and
  # writes only the four roots under /srv/corpus. Deterministic and idempotent;
  # it never deletes anything it did not write.
  eval-corpus:
    image: polymerhus-agent:latest
    working_dir: /srv/eval
    environment:
      PYTHONPATH: /srv/eval
    volumes:
      - ./eval:/srv/eval:ro
      - storage-compat-corpus:/srv/corpus
    command:
      - python
      - -m
      - read_api.storage_compat_corpus
      - --root
      - /srv/corpus
    restart: "no"
    networks: [storage-compat-net]

  # The read API over the four synthetic roots. Read-only everywhere it points;
  # the app itself exposes only GETs.
  eval-api:
    image: polymerhus-agent:latest
    restart: unless-stopped
    working_dir: /srv/eval
    environment:
      PYTHONPATH: /srv/eval
      EVAL_ARTIFACT_STORE: /srv/corpus/store
      EVAL_PROJECT_DATA_ROOT: /srv/corpus/raw
      EVAL_RUNS_ROOT: /srv/corpus/runs
      EVAL_RUNS_LEGACY_ROOT: /srv/corpus/runs-legacy
      EVAL_DATASET_ID: storage-compatibility
      EVAL_DATASET_NAME: "Synthetic — storage compatibility"
      EVAL_INSTANCE_ID: demo-instance-1
    volumes:
      - ./eval:/srv/eval:ro
      - storage-compat-corpus:/srv/corpus:ro
    command:
      - python
      - -m
      - uvicorn
      - read_api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    ports:
      - "127.0.0.1:${STORAGE_COMPAT_API_PORT:-28090}:8090"
    depends_on:
      eval-corpus:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [storage-compat-net]

  # The production frontend (unchanged): the same Vite dev server the real
  # overlay runs, proxying /eval-api -> eval-api and waiting for its health.
  eval-dashboard:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /srv/frontend
    environment:
      VITE_EVAL_API_BASE_URL: /eval-api
      EVAL_PROXY_TARGET: http://eval-api:8090
    volumes:
      - ./frontend:/srv/frontend
      - storage-compat-node-modules:/srv/frontend/node_modules
    command:
      - sh
      - -c
      - >-
        npm ci --no-audit --no-fund
        && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:${STORAGE_COMPAT_DASHBOARD_PORT:-25173}:5173"
    depends_on:
      eval-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:5173/eval')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [storage-compat-net]
