# LiteLLM gateway proxy config (ADR D1, D8, D10 - #100 LLM API gateway programme).
#
# Brought up by `polymerhus.app.gateway_entrypoint` as the FIRST ASGI process
# in the agent container, on the internal port 4000. The agent ASGI (port 8080)
# starts AFTER `/health/liveliness` answers and the bootstrap sync (T2, #105)
# has run.
#
# ADR D10 (verbatim): the proxy config is minimal here. T2 (#105) fills the
# model_list via the management API; this file ships the EMPTY `model_list: []`
# and the D8 auto-inject stanza only.
#
# SECRETS NEVER LIVE HERE. `LITELLM_MASTER_KEY` and `DATABASE_URL` are env-only
# (the docker-compose agent service wires them; .env carries the real values
# and is gitignored). ADR D10: "from env, never in the repo".
#
# D8: PROMPT CACHING - auto-inject + passthrough; NO response cache.
# - `enable_anthropic_prompt_caching: true` (litellm v1.94+) is the
#   gateway-wide auto-inject primitive: a system-prompt breakpoint + a
#   trailing-turn breakpoint on every Claude-family model T2 registers,
#   zero client cost. For the current openai-compatible provider set it is a
#   no-op (DeepSeek + OpenAI cache automatically server-side, D8 fact 2).
# - Client-sent `cache_control` / `prompt_cache_key` are forwarded unchanged
#   (litellm passthrough; no gateway config needed).
# - `LITELLM_CACHE_TYPE` (the response cache) is INTENTIONALLY ABSENT. ADR D8
#   rules it out: a stateful agent loop's requests mutate each turn, so the
#   cacheable surface is the PREFIX (handled provider-side, above), not the
#   whole request - caching the whole request would risk stale tool results
#   and corrupted observability.
#
# D1: STORE_MODEL_IN_DB=True against the SHARED postgres INSTANCE, in the
#   gateway's DEDICATED database (`polymerhus_gateway`, created by
#   db/postgres/init.sql - litellm's prisma machinery owns its target database
#   and destroys or refuses shared ones). The mgmt API writes to
#   `LiteLLM_ProxyModelTable`; the YAML `model_list` is bootstrap-only and
#   OVERLAYED by the DB on subsequent boots (litellm's documented semantics).
#
# SCHEMA MIGRATIONS ARE A DEPLOYMENT STEP, NOT A BOOT STEP: the entrypoint
#   (`gateway_entrypoint.py::_run_migrations`) runs `prisma migrate deploy`
#   itself BEFORE spawning the proxy. This flag makes litellm SKIP its own
#   internal migrate - litellm wraps it in a hard-coded 60s subprocess timeout
#   while the prisma CLI alone costs 110-165s on this hardware (measured
#   2026-08-17), so litellm's internal step times out non-deterministically
#   and kills the boot. With the flag litellm instead runs a WARN-ONLY, no-
#   timeout `prisma migrate diff` check at startup - the schema itself is
#   guaranteed current because the entrypoint migrated it moments earlier.

model_list: []  # empty - T2 (#105) fills via management API

general_settings:
  store_model_in_db: true  # liteLLM persists model records in the shared postgres (ADR D1)
  disable_prisma_schema_update: true  # the entrypoint owns migrations (see above)
  # master_key + database_url come from env: LITELLM_MASTER_KEY, DATABASE_URL
  # (litellm reads these env vars natively; no YAML key needed, no secret in repo).

litellm_settings:
  # The role thinking baseline (providers.py `thinking`) sends the OpenAI
  # `reasoning_effort` param in gateway mode. The openai-compatible upstream
  # wire has NO such param, and litellm's openai provider class rejects it
  # with `UnsupportedParamsError` at the proxy (400, verified live 2026-08-18
  # via the E7 reasoning-replay walkthrough) unless the proxy drops it.
  # `drop_params: true` makes litellm strip unsupported params before routing,
  # exactly as litellm's own error text directs, so the reasoning NODE still
  # arrives (deepseek returns reasoning_content natively) while the effort
  # tuning hint is dropped instead of 400ing the whole turn. A D5 D10 concern:
  # the proxy is the transport; client tuning params it does not understand
  # must not become a hard failure.
  drop_params: true
  # ADR A5 (increment-3): the thinking-effort dial adapts the declared
  # `reasoning_effort` to what the model actually offers (negotiate_thinking);
  # `drop_params: true` would silently STRIP the adapted level for generic
  # `openai/` deployments before it reaches the upstream. `allowed_openai_params`
  # force-forwards `reasoning_effort` specifically for the reasoning-capable
  # deployments the sync registers, while `drop_params` stays the safety net
  # for genuinely unknown params (operator-ratified 2026-08-22, litellm 1.96.0
  # has no `passthrough_unknown_openai_params`).
  allowed_openai_params: ["reasoning_effort"]
  # D8 auto-inject: gateway-wide prompt-caching breakpoints for Claude-family
  # models. No-op on the current openai-compatible provider set (DeepSeek +
  # OpenAI cache automatically server-side). Forwards client `cache_control`
  # / `prompt_cache_key` unchanged (litellm passthrough - no config here).
  enable_anthropic_prompt_caching: true
  # NO `litellm_settings.cache:` stanza - that is the RESPONSE cache
  # (LITELLM_CACHE_TYPE), explicitly OUT per ADR D8. The KV cache lives only
  # at the provider; the gateway influences hit rate via auto-inject + the
  # passthrough above, nothing more.
