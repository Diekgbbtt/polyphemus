[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polymerhus"
version = "0.1.0"
description = "Autonomous web-application vulnerability-discovery system"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polymerhus.attack.hunting.data" = ["fault-kb.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e_live: exercises a live docker-compose stack; opt in with PH_E2E_LIVE=1",
]
