# External bootstrap - the eval-server regeneration run (issue #358).
#
# From the repository root, with the example config in CFG:
#
#   CFG=tools/bootstrap/run.example.yaml
#   python3 tools/bootstrap/run_external_bootstrap.py plan   --config $CFG
#   python3 tools/bootstrap/run_external_bootstrap.py run    --config $CFG
#   python3 tools/bootstrap/run_external_bootstrap.py status --rundir .bootstrap-runs/w2.6
#   python3 tools/bootstrap/run_external_bootstrap.py resume --rundir .bootstrap-runs/w2.6
#
# Everything a run cannot guess is here; every omitted field keeps the pinned
# default in runner/config.py. The run is serial (one target up at a time) and
# tears a target down before the next one starts. `worktree` is omitted, so the
# checkout that ships this file is the run's worktree; uncomment it to run from
# another one.

run:
  id: w2.6
  targets:
    # Heavy targets first, while the server has the most headroom; the run is
    # serial and verifies a teardown before it starts the next target.
    - dataease
    - comfyui
    - geoserver
    - jetlinks
    - phpbb
    - prestashop
    - siyucms
    - white-jotter
  # worktree: .
  agent: data-dep-worker
  # The entitled provider lane (the same one the operator's own sessions use).
  # The free `opencode` tier answers interactive probes but rejects automated
  # session dispatches intermittently with a 403 FreeTierError, so it is not a
  # usable worker lane for an hours-long regeneration.
  model:
    providerID: opencode-go
    id: deepseek-v4.1-flash
    variant: high
  turn_timeout_s: 3600
  repair_attempts: 3
  timeout_reprompts: 1
  retry:
    attempts: 3
    backoff_s: [60, 300, 900]
  readiness:
    # The server recipe: poll 60 times, 5s apart (5 minutes per deployment).
    retries: 60
    interval_s: 5
    # The platform's HTTP answer rule; a per-target `false` relaxes it to "the
    # transport answered at all" for a target with a known, permanent 5xx on the
    # probed route. The original eval-server config relaxes it for prestashop
    # only: under amd64 emulation its web SAPI hits the ICU defect
    # (Transliterator::create null), so the storefront root answers 500 while
    # the containers are up and the authenticated surface is workable.
    require_http: true
    per_target_require_http:
      prestashop: false
  teardown_on_failure: true
  continue_on_failure: true

environment:
  driver: ssh
  ssh: eval-server-polyphemus
  web_root: /root/WebExploitBench
  targetctl: /root/wb
  # `targetctl ps` prints the wildcard bind (http://0.0.0.0:<port>/); workers get
  # that URL with this host substituted.
  public_host: 46.224.225.245

paths:
  # Relative paths resolve against the worktree above.
  kbs: eval/data/webexploitbench
  staging: eval/data-dependencies
