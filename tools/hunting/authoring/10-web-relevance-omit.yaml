comment: 'Web-domain relevance filter (operator task 2). Scores from the critic subagent pass (fault-relevance-rankings.md);
  threshold 0.6 with semantic evaluation of the 0.5-0.7 band. Adversarial critique pass (critical-thinking-logical-reasoning
  skill, 2026-08-05) argued against each rationale and restored 17 entries: Windows path-equivalence family (CWE-42,43,44,45,46,53,54,56,58),
  CWE-59/61 (symlink-slip via archive extraction), CWE-231 (HTTP parameter pollution), CWE-529 (.htaccess/web.config
  exposure), CWE-649 (client-state crypto without integrity), CWE-1254 (timing side-channel), CWE-1269 (non-release
  configuration), CWE-1289 (unsafe identifier equivalence, SSRF/URL-parser differentials). Full verdicts in docs/design/hunting-66-fault-omit-critique.md.'
