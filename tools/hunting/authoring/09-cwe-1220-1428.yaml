    enum_kinds: [WebPresentation, RESTApi]
  CWE-1336:
    nl: "The unit inserts externally influenced input into a template without neutralizing it."
    enum_kinds: [WebPresentation, RESTApi]
  CWE-1385:
    nl: "The unit's WebSocket endpoint does not verify the origin of connections."
    enum_kinds: [WebPresentation, RESTApi]
  CWE-1386:
    nl: "The unit opens a file or directory without preventing Windows junction/mount-point resolution."
  CWE-1392:
    nl: "The unit uses default credentials for critical functionality."
    enum_kinds: [AuthenticationMechanism]
  CWE-1393:
    nl: "The unit uses a default password for critical functionality."
    enum_kinds: [AuthenticationMechanism]
  CWE-1394:
    nl: "The unit uses a default cryptographic key for critical functionality."
    enum_kinds: [AuthenticationMechanism]
  CWE-1395:
    nl: "The unit depends on a third-party component with a known vulnerability."
    enum_kinds: [WebPresentation, RESTApi]
  CWE-1427:
    nl: "The unit builds LLM prompts from externally provided input without neutralization."
    enum_kinds: [WebPresentation, RESTApi]
  CWE-1428:
    nl: "The unit relies on HTTP where HTTPS is available."
    enum_kinds: [WebPresentation, RESTApi]
