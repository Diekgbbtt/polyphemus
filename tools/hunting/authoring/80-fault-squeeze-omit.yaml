# Authoring sidecar: the fault-squeeze omits (#66, the 2026-08-17 squeeze pass).
#
# The second screening over the folded catalogue (254 -> 203 entries), six
# lenses in parallel (squeeze-mode-1..6 verdict reports under
# /var/folders/gs/p9fl4f1s1yqfl8801x50nhjc0000gn/T/opencode/squeeze-mode-*.md):
#   * mode-1  recon-observable / low-impact: a single atomic legitimate
#             interaction fully establishes the fault (headers, Set-Cookie,
#             default error pages, TLS presentation) - underutilised as hunt;
#   * mode-2  naive / very-unlikely / recon-reducible: plain-HTTP transport
#             posture and served-certificate presentation, effectively-never
#             conditions, and umbrellas whose concrete members are separately
#             catalogued;
#   * mode-3  very-narrow variants: the "huntable fault" is the fold parent's
#             broader fault, label-only recipes (framework tags never change
#             the probe sequence);
#   * mode-4  framework/technology-named entries: J2EE/Struts-only mechanisms
#             whose hunt shape a selection-tier generic capture already holds;
#   * mode-5  blatant redundants: verbatim re-spells of a capture's content;
#   * mode-6  not test-actionable under the L1 abstraction model, plus the
#             AI/GenAI surface declared OUT OF SCOPE.
#
# Conflict resolution (across lenses): REMOVE wins over GENERALISE/KEEP when
# multiple lenses agree or the removal lens is the operator-named authority
# (CWE-296/297/298 TLS presentation, CWE-5/1428 plain HTTP, CWE-756/1269
# recon-observable); KEEP wins on content-grounds (CWE-1393 default password,
# the 1104/1329/1395 supply-chain family, the 22/23/24/28 traversal family).
# Each omission is a later-file override of the range sidecar's authored
# matching facet (the documented OMIT layer); fold_variants re-folds any
# surviving child automatically.
