adversarial_capabilities:
- unauthenticated network access to the public registration surface (an HTTP client
  able to submit a registration request)
- knowledge of the role identifiers the system accepts, sufficient to name a privileged
  role (e.g. sysadmin / contentmanager) in the registration submission
assumptions:
- the registration endpoint binds a client-supplied roles parameter to the new account,
  per the contract's 'binds any roles submitted with the registration'
- the assignable role set includes at least one role granting privileges beyond the
  registering actor's own
- no server-side allow-list restricts self-assignable roles to non-privileged ones
- the account is enabled immediately, so a self-assigned privileged role is usable
  without further approval
fault_class: CWE-1220
hunt_id: Service:account-registration::CWE-1220::Privilege Escalation
prior_hunt_insights: []
prompt_template:
  l0_evidence:
  - 'deterministic witness: harness reduced batch Service:account-registration::CWE-1220
    (applies)'
  - service contract binds 'any roles submitted with the registration' to the new
    account; exposure=public; graph_view confirms the Service node carries no outbound
    edges
  rationale: 'CWE-1220 at Service:account-registration: the unit is a public-exposure
    registration flow whose service contract binds ''any roles submitted with the
    registration'' to the newly created account, while the AuthorizationSystem card
    shows privileged roles (sysadmin, contentmanager) exist in the system. The access-control
    enforcement at this locus is too coarse-grained to express the intended policy
    - role assignment should require administrative privilege or be restricted to
    non-privileged roles, yet a single public route guard admits an unauthenticated
    actor to the role-binding capability. CAPEC-1 (accessing functionality not properly
    constrained by ACLs) and CAPEC-180 (exploiting incorrectly configured access-control
    security levels) from the materialisation support this reading; the account is
    enabled immediately, so a self-assigned privileged role is usable at once. Competing
    prune reading (the contract text describes the data model, not client-controlled
    input, and the server filters roles) is not positively established - no evidence
    of server-side role filtering exists, and the deterministic verdict is ''applies'';
    the contract''s ''any roles submitted'' wording is the witness.'
  research_direction: probe whether the public account-registration flow permits an
    unauthenticated actor to bind privileged roles to a newly created account, i.e.
    whether role assignment at this locus is enforced at the granularity the intended
    policy requires
status: ratified
sub_fault_ids: []
surface_context:
  connected_data_items: []
  connected_systems: []
  exposure: public
  kind: Service
  relevant_system_cards:
    AuthorizationSystem: 'roles: sysadmin (system administrator), contentmanager (content
      administrator), visitor, test, seeded accounts'
  service_contract: Creates a new user account from the submitted credentials and
    profile details, hashing the password with a freshly generated salt and enabling
    the account immediately. The flow rejects empty credentials and duplicate usernames,
    and binds any roles submitted with the registration to the new account.
  unit: Service:account-registration
target_caveats:
- the role-binding path is inferred from the service contract text; the unit projects
  no data edges, data items, or cooperating systems, so no observed data flow corroborates
  the roles parameter
- the privileged role vocabulary (sysadmin, contentmanager) is an L1 inference from
  the AuthorizationSystem card, not direct evidence that the registration endpoint
  accepts those identifiers
- the registration surface may be served over cleartext HTTP (AuthenticationMechanism
  card); orthogonal to this fault but relevant to test transport
technique_primitives:
- submit a registration request carrying a privileged role identifier in the roles
  field and inspect the role bound to the created account
- submit a baseline registration without a roles field and compare, to confirm the
  role binding is client-influenced rather than server-derived
- exercise a privileged surface (e.g. user-administration or role-editing) with the
  created account to confirm the self-assigned role grants elevated access
tool_registry:
