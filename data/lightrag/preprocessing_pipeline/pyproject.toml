[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightrag-docprep"
version = "0.3.4"
description = "Source-aware document preprocessing for later LightRAG ingestion"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "beautifulsoup4>=4.12,<5",
  "markdownify>=0.14",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
docling = ["docling"]
pymupdf = ["pymupdf4llm"]
all = ["docling", "pymupdf4llm"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
lightrag-docprep = "lightrag_docprep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
