# Pod e2e overlay (worktree-local): a TRUE SIBLING agent container for the
# test-executor pod holistic e2e tier (#84, E5-E8).
#
# Loaded AFTER docker-compose.yml + docker-compose.dev.yml. Adds a NEW service
# `pod-e2e-agent` - deliberately distinct from the fleet `agent` service, so it
# never collides with the operator's running container. It:
#   - uses the SAME polymerhus-agent:latest image;
#   - mounts THIS WORKTREE's src/ + tests/ (plus db/skills/gateway) so the
#     regrounded pod code and the driver/fixtures are the edited tree, never
#     the baked image layer;
#   - joins the polymerhus-net network so it resolves neo4j/postgres/kali by
#     service DNS exactly as the fleet agent does;
#   - wires the pod-role models to the operator-chosen model
#     (opencode:muse-spark-1.2-contributor-free - the same model the hunting
#     hunter uses, verified live 2026-08-22);
#   - MOCKS kb_retrieve: the symptom-technique KB workstream is not merged, so
#     the driver injects a canned KB (POD_E2E_MOCK_KB=1) instead of a live KB
#     call. Taints realism, acknowledged.
#
# The service stays DOWN until the operator green-lights the live run (the
# parallel REST-exposure stream lands on dev, this branch ffs): the holistic
# tests skip while `pod-e2e-agent` has no container, and run when it does.
# Bring it up with:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#                  -f tests/e2e/harness/compose.pod-e2e.yml \
#                  up -d --no-deps pod-e2e-agent
services:
  pod-e2e-agent:
    image: polymerhus-agent:latest
    working_dir: /srv
    volumes:
      - ./src:/srv/src
      - ./db:/srv/db
      - ./skills:/srv/skills
      - ./gateway:/srv/gateway
      - ./tests:/srv/tests
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: polymerhus
      POSTGRES_DSN: postgresql://polymerhus:polymerhus@postgres:5432/polymerhus
      KALI_MCP_URL: http://kali:8000/mcp
      PROJECT_ID: pod-e2e
      PYTHONPATH: /srv/src
      LLM_MODEL_POD_RUNNER: "opencode:muse-spark-1.2-contributor-free"
      LLM_MODEL_POD_TRIAGER: "opencode:muse-spark-1.2-contributor-free"
      POD_E2E_MOCK_KB: "1"
      POD_E2E_MOCK_KB_FILE: "/srv/tests/e2e/fixtures/mock-kb.yaml"
      # The model API keys the muse-spark (opencode provider) needs to
      # authenticate - interpolated from the host environment at compose up.
      API_KEY_OPENCODE: "${API_KEY_OPENCODE:-}"
      API_KEY_OPENCODE_GO: "${API_KEY_OPENCODE_GO:-}"
    env_file:
      - path: "/Users/diekgbbtt/polymerhus/.env"
        required: false
    entrypoint: ["sh", "-c", "sleep infinity"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      kali: { condition: service_started }
    networks: [polymerhus-net]