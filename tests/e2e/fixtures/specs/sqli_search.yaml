name: sqli-search-blind-boolean
# The reduced D4 (S5 8.4, S3 8.6). The retired `testing_pattern`,
# `payload_vector_space`, and `interpretation_guidance` fields are absent by
# design (T10b #397); the operational detail lives in the procedure excerpt and
# the assumptions.
target_identity:
  url: "https://soupmarket.shop/"
  unit_id: "service:web:soupmarket"
verification_symptoms:
  - >-
    A boolean differential: the response to q with a payload that makes the
    predicate TRUE (e.g. an AND 1=1 that yields the full catalogue) differs from
    the response to the FALSE variant (AND 1=2 that yields an empty data array),
    while both return HTTP 200. Confirmed means the two queries observably
    return different result sets through a boolean-conditioned filter.
  - >-
    Error-based echo: an injected marker appears verbatim in the error page's
    server-rendered title (the SQLite error text reflects the unescaped marker),
    demonstrating server-side SQL string interpolation reaction to the payload.
assumptions:
  - network egress allowed; https://soupmarket.shop reachable
  - the search endpoint is anonymous
  - q is wrapped in a parenthesised SQL expression, so the injection must close
    the paren (a bare single quote is treated as a plain character, not a
    delimiter)
  - the search endpoint returns JSON; the SQLite error path returns the 500 HTML
    with the unescaped marker in the title (observed live)
  - no WAF in front that normalises the probes (the differential pair must not
    be rewritten into identical requests)
rationale: >-
  The parenthesised interpolation is Juice Shop's blind SQLi surface: a
  well-formed boolean pair either filters the catalogue or does not, which is
  machine-observable through the JSON result-set difference. This discriminates
  the "SQL string-injection reachable" hypothesis with a control and two
  structural twins - the cleanest blind-boolean execution the pod can run and
  interpret from raw HTTP responses alone.
provenance:
  threat_id: threat-2
  unit_id: "service:web:soupmarket"
  canonical_class: injection
  web_vulnerability_class: sql-injection
  assumption_ref: fault-2
  source_recon_refs:
    - "GET /rest/products/search?q=banana"
  playbook: blind-boolean SQL injection in a parenthesised search predicate
  skill_procedure:
    recon_action: >-
      Confirm the search endpoint answers anonymously and returns the catalogue
      as JSON.
    bypass_technique: >-
      Close the enclosing parenthesis, then send a TRUE and a FALSE boolean pair
      with identical structure except the constant.
    technology_grounding: >-
      The server-side query is built by string interpolation inside a
      parenthesised expression over SQLite.
    pro_tips: >-
      Keep the control, TRUE, FALSE, and error probes structurally identical so
      the response shape, not a literal string, is the discriminator.
    advanced_technique: >-
      Use a union/column-count probe and an error-forcing marker to confirm raw
      interpolation.
    preliminary_chaining: >-
      Chain the control and boolean pair into the error-echo probe.
    interpretation_pitfalls: >-
      A blanket blockade across all probes is technical infeasibility, not
      absence; identical full catalogues across the pair is absence.
