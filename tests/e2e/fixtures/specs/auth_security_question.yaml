name: auth-security-question-recovery
# The reduced D4 (S5 8.4, S3 8.6): target identity, observable verification
# symptoms, falsifiable assumptions, the vulnerability-level rationale, and the
# dispatch provenance. `testing_pattern`, `payload_vector_space`, and
# `interpretation_guidance` are RETIRED (T10b #397) and `extra="forbid"`
# rejects them.
target_identity:
  url: "https://soupmarket.shop/"
  unit_id: "service:web:soupmarket"
verification_symptoms:
  - >-
    Account takeover via the recovery flow: a freshly-registered account whose
    security question leaks unauth at /rest/user/security-question?email= is
    reset through /rest/user/reset-password with the leaked question's answer,
    and the NEW password then authenticates at /rest/user/login (200/ok
    instead of 401). Confirmed = the whole chain completes with the new
    credential accepted.
  - >-
    The question-leak alone is a corroborating symptom: the unauth response
    to /rest/user/security-question?email=<address of an existing user> names a
    question, which would not be disclosed if recovery were designed against
    account enumeration.
assumptions:
  - network egress allowed; https://soupmarket.shop reachable
  - registration with a fresh random email is unauthenticated and open (Juice
    Shop default)
  - "the security question is disclosed pre-auth for an existing user (observed live: admin's question leaks unauth)"
  - the answer space of the observed question family is small/guessable (the
    hypothesis under test); the sacrificial account uses a deliberately weak
    answer so the positive control is valid
  - reset is rate-limited at 100/hour (observed header) - stay under it
rationale: >-
  Recovery flows with disclosed, low-entropy questions are the classic broken
  authentication pattern (Juice Shop deliberately ships it): if the question
  is disclosed pre-auth AND the reset honours a guessable answer, an attacker
  takes over any account whose question is weak. The chain - register, leak,
  reset, login - is fully observable from raw HTTP and has a built-in negative
  control (the wrong answer must fail), so the run discriminates "recovery
  abuse via weak question" from "no such exposure" cleanly.
provenance:
  loop_id: loop-1
  unit_id: "service:web:soupmarket"
  canonical_class: authentication
  web_vulnerability_class: broken-authentication
  assumption_ref: fault-1
  source_recon_refs:
    - "GET /rest/user/security-question?email=admin@juice-sh.op"
    - "POST /rest/user/reset-password"
  playbook: password-recovery abuse via a disclosed low-entropy security question
  skill_procedure:
    recon_action: >-
      Map the password-recovery REST endpoints and confirm which of them answer
      without a session.
    bypass_technique: >-
      Leak the security question pre-auth, then reset with a guessed answer and
      re-authenticate with the new credential.
    technology_grounding: >-
      Juice Shop's recovery flow is built on the user's security question; the
      reset endpoint accepts {email, answer, new, repeat}.
    pro_tips: >-
      Register a fresh sacrificial account so the probe never touches a real
      user's password.
    advanced_technique: >-
      Use a deliberately wrong answer as the negative control; it must fail
      while the correct answer succeeds.
    preliminary_chaining: >-
      Chain the question leak into the reset and the login probe.
    interpretation_pitfalls: >-
      A reset that succeeds regardless of the answer is a different finding
      (no-answer-check bypass), not confirmation of this one.
