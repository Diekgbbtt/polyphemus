    suite_class: ssrf
    rung: FALSIFIED
    evidences: ["probes.log: mode=http://ssrf-listener:8000/... -> byte-identical cached list", "ssh oracle: no listener hits", "dropped: no attacker-controlled fetch is reachable through mode"]
  - id: V-D3
