failure_modes:
  - id: FM-1
    vulnerability_ref: V-1
    runtime_failure_mode: >-
      a caller submits a mixed record; the worker fetches url A's bytes and writes them under
      record B's filename and save_path; the model directory holds content whose name and
      location do not correspond to its source, and a later loader consumes the misplaced or
      mistyped artifact
    feasible: true
    drop_reason: null
    rung: OBSERVED
    evidences: ["probes.log: mixing accepted -> 200", "probes.log: e2e write mechanics observed for a verbatim record (installed False -> True)"]
  - id: FM-2
    vulnerability_ref: V-3
    runtime_failure_mode: >-
      a third-party page visited by the operator issues a simple-content-type POST with a
      catalog-valid record and a GET to /manager/queue/start; downloads start and run
      without the operator's intent
