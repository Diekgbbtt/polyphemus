assumptions:
  - id: A-1
    statement: >-
      Developer assumption: a posted model record is validated as a unit, so the fields the
      worker uses (url, filename, save_path) describe one artifact and its destination.
    induced_fault: >-
      membership is checked per field over the union of catalog values instead of binding the
      record, so catalog values can be recombined freely (induced fault F-1).
    boundary_ref: IA-1
    dimension: [interpretation, spatial]
    propagation:
      kind: local
      origin_ref: null
    rung: OBSERVED
    evidences: ["probes.log: field mixing -> 200", "probes.log: single-field deviations -> 400/403"]
  - id: A-2
    statement: >-
      Developer assumption: ui_id is the caller's job identity and can be trusted as the
      correlation key for status reporting.
    induced_fault: >-
      an unvalidated, unbound client string is stored on the job record and echoed in broadcast
      status events (induced fault F-2).
    boundary_ref: IA-1
    dimension: [identity, interpretation]
    propagation:
      kind: local
      origin_ref: null
    rung: OBSERVED
    evidences: ["probes.log: bogus ui_id -> 200", "model-manager.js onQueueStatus matches event.detail.target === item.hash"]
  - id: A-3
    statement: >-
      Developer assumption: only the deployment's operator reaches the manager routes, so
      triggering downloads and advancing the queue need no principal gate.
    induced_fault: >-
      no privilege layer exists on state-changing, egress-producing, filesystem-writing
      operations (induced fault F-3).
    boundary_ref: IA-2
    dimension: [identity]
    propagation:
      kind: local
      origin_ref: null
    rung: OBSERVED
    evidences: ["auth_methods [none]; exposure public in the unit spine", "probes.log: anonymous 200s on install/start/reset"]
  - id: A-4
    statement: >-
      Developer assumption: the pending queue belongs to the caller that filled it and stays
      stable until that caller starts it.
    induced_fault: >-
      the queue is a single global set with no ownership binding, so third-party resets and
      starts act on foreign work (induced fault F-4).
    boundary_ref: IA-2
    dimension: [temporal, identity]
    propagation:
      kind: local
      origin_ref: null
    rung: OBSERVED
    evidences: ["probes.log: reset cleared a pending job queued by another probe sequence", "probes.log: start advanced the pending job"]
  - id: A-5
    statement: >-
      Developer assumption: queue transitions are atomic with respect to in-flight work; a
      reset cannot disturb a job the worker is already consuming.
    induced_fault: >-
      pending/in-progress states are not distinguished for reset, and the in-flight guard is
      client-side only (induced fault F-5).
    boundary_ref: T-8
    dimension: [temporal]
    propagation:
      kind: local
      origin_ref: null
    rung: ASSUMED
    evidences: ["unprobed: needs a long-running job", "model-manager.js client-side is_processing block only"]
  - id: A-6
    statement: >-
      Developer assumption: the bytes fetched from the catalog url are the artifact the
      catalog intends; size is informational and integrity need not be verified.
    induced_fault: >-
      no hash, signature or size enforcement gates the install (induced fault F-6).
    boundary_ref: IA-6
    dimension: [interpretation]
    propagation:
      kind: local
      origin_ref: null
    rung: OBSERVED
    evidences: ["probes.log: accepted record with declared size 1.01KB paired with a 4.71MB url", "probes.log: e2e installed True with no integrity assertion in the response path"]
  - id: A-7
    statement: >-
      Developer assumption: catalog-derived strings are inert when the manager shell renders
      them.
    induced_fault: >-
      catalog fields are interpolated into the grid DOM with an unquoted attribute and no
      escaping (induced fault F-7).
    boundary_ref: IA-7
    dimension: [interpretation]
    propagation:
      kind: propagated
      origin_ref: IA-6
    rung: OBSERVED
    evidences: ["model-manager.js (target-served): `<a href=${rowItem.reference} target=\"_blank\"><b>${name}</b></a>`", "catalog and content arrive from outside the unit (raw.githubusercontent.com channel)"]
  - id: A-8
    statement: >-
      Developer assumption: membership in the catalog value sets is sufficient proof that a
      save_path/filename is path-safe.
    induced_fault: >-
      path safety is delegated entirely to catalog membership; no normalization or canonical
      check guards accepted values (induced fault F-8).
    boundary_ref: IA-1
    dimension: [spatial]
    propagation:
      kind: local
      origin_ref: null
    rung: ASSUMED
    evidences: ["traversal-shaped values are rejected because they are not catalog values (observed)", "the same check would admit a traversal-shaped catalog value; no such value could be forged in a probe"]
  - id: A-9
    statement: >-
      Developer assumption: malformed bodies cannot reach business logic (missing keys and
      wrong types are impossible through the shell).
    induced_fault: >-
      unguarded field access and type use in the validation path raise unhandled exceptions
      (induced fault F-9).
    boundary_ref: IA-1
    dimension: [interpretation]
    propagation:
      kind: local
      origin_ref: null
    rung: OBSERVED
    evidences: ["probes.log: {} -> 500", "probes.log: filename as number -> 500"]
faults:
  - id: F-1
    name: per-field membership check in place of record-identity binding (validation scope confusion)
    rung: OBSERVED
    evidences: ["probes.log: mixing accepted -> 200", "probes.log: single-field deviations rejected"]
  - id: F-2
    name: unvalidated, unbound client-supplied ui_id used as job identity and echoed in status events
    rung: OBSERVED
    evidences: ["probes.log: bogus ui_id -> 200", "model-manager.js onQueueStatus row matching"]
  - id: F-3
    name: no principal gate, no CSRF/origin check, no media-type check on download-triggering and queue-advancing operations; state transitions reachable with GET
    rung: OBSERVED
    evidences: ["probes.log: anonymous install/start/reset 200s", "probes.log: text/plain body accepted", "probes.log: GET start/reset"]
  - id: F-4
    name: global, unowned pending queue with no binding between job and submitter
    rung: OBSERVED
    evidences: ["probes.log: reset cleared foreign pending work", "probes.log: global queue status"]
  - id: F-5
    name: non-atomic queue transitions; pending/in-progress not distinguished for reset; in-flight guard exists only in the client
    rung: ASSUMED
    evidences: ["unprobed in-progress reset", "model-manager.js client-side is_processing check"]
  - id: F-6
    name: no content integrity verification of downloaded artifacts (no hash, signature or size enforcement)
    rung: INFERRED
    evidences: ["no integrity check surfaced in the response path", "probes.log: declared size not enforced"]
  - id: F-7
    name: unescaped interpolation of catalog-derived strings into the manager shell DOM (unquoted href attribute)
    rung: OBSERVED
    evidences: ["model-manager.js name-column formatter, served by the target over HTTP"]
  - id: F-8
    name: path-safety delegated entirely to catalog value membership (no normalization or canonicalization of accepted values)
    rung: ASSUMED
    evidences: ["observed equality-based rejection of traversal-shaped deviations", "observed acceptance of nested save_path values"]
  - id: F-9
    name: unguarded parsing of malformed bodies (missing keys, non-string types) raising 500s
    rung: OBSERVED
    evidences: ["probes.log: {} -> 500", "probes.log: filename as number -> 500"]
vulnerabilities:
  - id: V-1
    fault_ref: F-1
    class: >-
      catalog record recombination (validation-scope confusion): any catalog url can be paired
      with any other record's filename and save_path, so the fetch source and the write
      destination need not belong together
    suite_class: business-logic
    rung: OBSERVED
    evidences: ["probes.log: field mixing url A + filename/save_path B -> 200", "probes.log: single-field deviations -> 400/403"]
  - id: V-2
    fault_ref: F-2
    class: >-
      unbound job-identifier spoofing: ui_id is a caller-chosen correlation key rendered by
      other clients' shells, with no binding to the submitting session
    suite_class: two-principal-authz
    rung: OBSERVED
    evidences: ["probes.log: arbitrary ui_id accepted", "model-manager.js onQueueStatus matching by target/ui_target"]
  - id: V-3
    fault_ref: F-3
    class: >-
      forced operations via cross-site request forgery: download-triggering POSTs accept
      simple content types without a token or origin check, and queue advancement/clearing
      happens over GET
    suite_class: csrf
    rung: OBSERVED
    evidences: ["probes.log: text/plain body -> same validation", "probes.log: GET /manager/queue/start|reset -> 200", "no auth: auth_methods [none]"]
  - id: V-4
    fault_ref: F-4
    class: >-
      shared-queue manipulation without ownership binding: any caller can clear pending work
      or advance another submitter's jobs, with no notification to the owner
    suite_class: business-logic
    rung: OBSERVED
    evidences: ["probes.log: reset cleared a foreign pending job; start advanced it", "probes.log: global unfiltered queue status"]
  - id: V-5
    fault_ref: F-5
    class: >-
      TOCTOU/race between queue reset-start and the worker's fetch-write: state transitions are
      not atomic and the in-flight guard is client-side only
    suite_class: race-conditions
    rung: ASSUMED
    evidences: ["probes.log: reset semantics observed for pending jobs", "server-side in-progress behaviour unprobed (blocked)"]
  - id: V-6
    fault_ref: F-6
    class: >-
      unverified third-party artifact installation: model files land in the model directories
      with no integrity check; the artifacts are later loaded by a pickle-capable stack
    suite_class: rce
    rung: INFERRED
    evidences: ["probes.log: declared size not enforced; e2e install with no integrity assertion", "unit context: models consumed by ComfyUI loaders"]
  - id: V-7
    fault_ref: F-7
    class: >-
      catalog-driven DOM injection in the manager shell: record name and reference are
      interpolated into the grid with an unquoted attribute and no escaping (stored XSS shape)
    suite_class: xss
    rung: OBSERVED
    evidences: ["model-manager.js formatter served by the target over HTTP", "catalog records carry name/reference from the remote channel"]
  - id: V-8
    fault_ref: F-8
    class: >-
      path traversal contingent on a catalog entry value: membership is the only path-safety
      control, so a catalog value containing traversal segments would be admitted verbatim
    suite_class: path-traversal-lfi-rfi
    rung: ASSUMED
    evidences: ["observed equality-based rejection of traversal-shaped client values", "no catalog value with traversal could be forged in a probe"]
  - id: V-9
    fault_ref: F-9
    class: >-
      validation-layer oracle: differentiated rejections (400 invalid request / 403 security
      error / 500 server trouble) tell a caller which field failed and which layer guards it
    suite_class: information-disclosure
    rung: OBSERVED
    evidences: ["probes.log: 403 url deviation, 400 filename/save_path deviation, 500 malformed body"]
  - id: V-D1
    fault_ref: F-1
    class: >-
      DROPPED (falsified): server-side request forgery via the client-supplied url field of an
