unit_id: Service:model-download
kind: Service
state: COMPLETED
trial: t1-tbsg-service-model-download
environment:
  base_url: http://46.224.225.245:47745
  baseurl_in_projection: http://comfyui-manager:8288
  http_history: none
  previous_models: none
  target_stack: >-
    aiohttp/3.14.3 on Python/3.11; ComfyUI core v0.3.76 + ComfyUI-Manager V3.37;
    single application, no TLS, no login surface, single seeded default profile;
    manager routes mirrored under /api; background work queue publishes over a
    websocket client channel keyed by caller-supplied client id.
  oracle: >-
    ssrf-listener:8000 callback container on the target network; read via ssh
    docker exec; no hits recorded during the whole trial.
technical_sharpening:
  interface_agreements:
    - id: IA-1
      statement: >-
        A model install is requested by POSTing a full catalog record plus a caller-chosen
        ui_id; the receiving side admits the record to the global work queue after
        per-field membership checks against the served catalog.
      artifact: >-
        JSON object with catalog fields {name, type, base, save_path, description,
        reference, filename, url, size, installed} plus ui_id.
      establishes:
        - item: generic HTTP layer accepts the request; route resolves on POST only (GET -> 404)
          layer: edge routing and gateway
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/queue/install_model -> 404 | method discipline", "probes.log: POST /manager/queue/install_model (verbatim record) -> 200"]
        - item: >-
            JSON body is parsed regardless of the declared Content-Type
            (application/json accepted; text/plain with a JSON body produces the same
            validation outcome); "no validation present" for the media type
          layer: parsing and validation
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 400 | content-type text/plain w/ forged url"]
        - item: >-
            url must equal a value present in the served catalog url set; a deviation
            returns 403 with body "A security error has occurred. Please check the terminal logs"
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 403 | url with catalog-url prefix + suffix", "probes.log: POST /manager/queue/install_model -> 400 | correct md5 ui_id, forged url+filename"]
        - item: >-
            filename must equal a value present in the served catalog filename set;
            a deviation returns 400 with body "Invalid model install request is detected";
            traversal-shaped filenames are rejected by the same equality test
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 400 | forged filename only", "probes.log: POST /manager/queue/install_model -> 400 | filename with traversal suffix"]
        - item: >-
            save_path must equal a value present in the served catalog save_path set;
            deviation and traversal-shaped values return 400
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 400 | forged save_path=vae_approx->checkpoints", "probes.log: POST /manager/queue/install_model -> 400 | save_path traversal variant vae_approx/.."]
        - item: >-
            name, type, base, description, reference and size carry "no validation present":
            description and reference can be forged while the record is accepted; a record can
            declare a size that does not match the url's artifact
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 200 | forged description+reference only", "probes.log: POST /manager/queue/install_model -> 200 | field mixing (url from A, filename/save_path from B)"]
        - item: >-
            ui_id carries "no validation present": any value is accepted (bogus hex string and
            free-form marker both queued); it is not bound to a session or principal
          layer: authentication and identity
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 200 | verbatim record with bogus ui_id", "probes.log: POST /manager/queue/install_model -> 200 | field mixing ... ui_id=tmprobe-mix1"]
        - item: >-
            the membership test is per-field over the union of catalog values, not a
            record-identity test: url from record A combined with filename and save_path
            from record B is accepted
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 200 | field mixing (url from A, filename/save_path from B)", "probes.log: POST /manager/queue/install_model -> 400 | forged save_path", "probes.log: POST /manager/queue/install_model -> 400 | forged filename only"]
        - item: >-
            input shape is not validated: a body of {} returns 500 and a non-string filename
            (number 123) returns 500 "Server got itself in trouble" from an unhandled exception
          layer: parsing and validation
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 500 | empty body probe", "probes.log: POST /manager/queue/install_model -> 500 | filename as number"]
        - item: >-
            an accepted request enqueues one pending job; duplicate submissions enqueue
            duplicates (three verbatim posts produced total_count 3)
          layer: internal services and dependencies
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/queue/status -> 200 | queue state after accepted verbatim installs (total_count 3, is_processing false)"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:11:40Z .. 13:18:13Z"]
    - id: IA-2
      statement: >-
        Queue advancement and queue clearing are unauthenticated GET requests; start begins
        processing of the pending set and reset removes pending jobs while retaining the
        completed history.
      artifact: HTTP GET request with no body.
      establishes:
        - item: "no validation present: no body, token, origin or identity check on start or reset"
          layer: authentication and identity
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/queue/start -> 200 | start processing: e2e transition", "probes.log: GET /manager/queue/reset -> 200 | restore: clear queued probe jobs"]
        - item: start on an empty queue is a no-op returning 200 with an empty body
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/queue/start -> 200 | queue start endpoint shape (idle)"]
        - item: reset clears pending jobs and retains completed entries (after reset the queue showed the done e2e job only)
          layer: data access and persistence
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/queue/status -> 200 | final queue state (total 1, done 1 after reset of a pending job)"]
        - item: GET /manager/queue/start with the wrong method (POST) is refused with 405
          layer: edge routing and gateway
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/start -> 405 | method discipline"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:11:28Z, 13:15:02Z, 13:18:35Z"]
    - id: IA-3
      statement: >-
        Queue state is readable without authentication; the status endpoint returns global
        counts {total_count, done_count, in_progress_count, is_processing} and is mirrored
        under /api.
      artifact: HTTP GET request.
      establishes:
        - item: "no validation present: no identity filtering; the single queue is reported whole, whoever asks"
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/queue/status -> 200 (five reads across the trial, all unfiltered JSON)", "probes.log: GET /api/manager/queue/status -> 200 | api mirror of queue status"]
        - item: >-
            per-job correlation data (ui_target and target=ui_id) is delivered to clients over
            the websocket channel and consumed by the shell to match grid rows
          layer: response construction
          rung: INFERRED
          evidences: ["/extensions/comfyui-manager/model-manager.js (target-served): onQueueStatus matches event.detail.target against item.hash and ui_target against 'model_manager'", "note: websocket channel not probeable with curl; recorded in evidence_gaps"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:11:28Z .. 13:18:35Z"]
    - id: IA-4
      statement: >-
        The external model catalog is served as one JSON document of 564 records; the mode
        parameter is accepted but does not change the served list.
      artifact: 'HTTP GET request with ?mode=, response JSON {"models": [...]}'
      establishes:
        - item: the route requires a mode parameter in practice (no-mode request returns 500) but does not validate its value
          layer: parsing and validation
          rung: OBSERVED
          evidences: ["probes.log: GET /api/externalmodel/getlist -> 500 | external model catalog list (no mode)", "probes.log: GET /externalmodel/getlist?mode=__tm_unknown_mode__ -> 200"]
        - item: >-
            mode values default, recent, __tm_unknown_mode__ and a URL-shaped value all return
            byte-identical 265778-byte responses (md5 e691130fe522a680d803f955b72ef61b)
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: GET /externalmodel/getlist?mode=<default|recent|__tm_unknown_mode__|http://ssrf-listener:8000/...> -> 200", "local md5 comparison of the four response bodies"]
        - item: the installed flag is recomputed against disk state at request time (False -> True after a completed download)
          layer: data access and persistence
          rung: OBSERVED
          evidences: ["probes.log: GET /externalmodel/getlist?mode=default -> 200 | catalog state after e2e: installed flag flip (GroundingDINO_SwinT_OGC.cfg.py installed True)"]
        - item: the /api mirror serves the same 265778-byte document
          layer: edge routing and gateway
          rung: OBSERVED
          evidences: ["probes.log: GET /api/externalmodel/getlist?mode=default -> 200 | api mirror of catalog list with mode"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:11:40Z .. 13:16:52Z"]
    - id: IA-5
      statement: >-
        The catalog channel selection is read and mutated through
        /manager/channel_url_list; mutation accepts only predefined channel names.
      artifact: HTTP GET request with optional ?value=<channel name>.
      establishes:
        - item: 'read returns {"selected": ..., "list": [<6 name::url pairs>]} with selected default at rest'
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/channel_url_list -> 200 | channel config recon (default/recent/legacy/forked/dev/tutorial)"]
        - item: a known name mutates the selection (selected tutorial observed, then restored to default)
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/channel_url_list?value=tutorial -> 200 | select mutation", "probes.log: GET /manager/channel_url_list -> 200 | read back selected after tutorial select"]
        - item: >-
            an injected value shaped name::url is accepted with 200 but produces no observable
            state change and no outbound fetch; the url list itself is not client-editable
          layer: application and business logic
          rung: OBSERVED
          evidences: ["probes.log: GET /manager/channel_url_list?value=tmprobe::http://ssrf-listener:8000/... -> 200 | list unchanged, selected default", "ssh oracle: no listener hits"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:17:22Z .. 13:18:05Z"]
    - id: IA-6
      statement: >-
        The outbound fetch worker downloads the catalog record's url and writes the bytes
        under the record's save_path and filename inside the model directories.
      artifact: outbound HTTPS GET of the catalog url; downloaded bytes written to disk.
      establishes:
        - item: "no validation present of response content: no hash, signature or size check on the downloaded artifact surfaces anywhere in the response path"
          layer: internal services and dependencies
          rung: INFERRED
          evidences: ["probes.log: POST ... -> 200 | field mixing (declared size 1.01KB paired with a 4.71MB artifact url accepted)", "no integrity error observed on the completed e2e download"]
        - item: >-
            end-to-end completion: one accepted 1.01KB record was processed (total 1, done 1) and
            the catalog then reported installed True for exactly that record
          layer: data access and persistence
          rung: OBSERVED
          evidences: ["probes.log: POST /manager/queue/install_model -> 200 | e2e accepted job (GroundingDINO_SwinT_OGC.cfg.py)", "probes.log: GET /manager/queue/start -> 200 | e2e transition", "probes.log: GET /manager/queue/status -> 200 | post-start status (total 1, done 1)", "probes.log: GET /externalmodel/getlist?mode=default -> 200 | installed False -> True"]
        - item: >-
            the fetch target observed during the trial is the catalog host (huggingface.co for the
            e2e record); the worker is also the manager's requests/urllib/huggingface machinery
          layer: internal services and dependencies
          rung: INFERRED
          evidences: ["record url https://huggingface.co/ShilongLiu/GroundingDINO/raw/main/GroundingDINO_SwinT_OGC.cfg.py", "unit dossier: IntegrationSystem:model-download::outbound-fetch"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:16:34Z .. 13:16:52Z"]
    - id: IA-7
      statement: >-
        The manager shell renders catalog records; record fields are interpolated into the
        grid DOM by string concatenation.
      artifact: catalog record fields (name, reference, description, url) consumed by the shell.
      establishes:
        - item: >-
            "no validation present": the name column formatter returns
            `<a href=${rowItem.reference} target="_blank"><b>${name}</b></a>` (unquoted href
            attribute, raw interpolation); description is rendered into an auto-height cell
          layer: response construction
          rung: OBSERVED
          evidences: ["GET /extensions/comfyui-manager/model-manager.js -> 200: formatter at the name column returns the interpolated anchor; autoHeightColumns includes description"]
        - item: the rendered name/reference originate from the remote catalog document (channel sourced from raw.githubusercontent.com)
          layer: internal services and dependencies
          rung: OBSERVED
          evidences: ["IA-5 channel list: default::https://raw.githubusercontent.com/ltdrdata/ComfyUI-Manager/main", "IA-4 catalog records carry name/reference"]
      rung: OBSERVED
      evidences: ["probes.log: GET /extensions/comfyui-manager/model-manager.js -> 200 | model manager ui js"]
  control_flows:
    - id: CF-1
      statement: >-
        Install flow: shell selection -> per item POST /manager/queue/install_model
        (item.originalData + ui_id = md5(name+reference)) -> per-field membership check ->
        enqueue pending -> explicit GET /manager/queue/start -> worker loop -> per job fetch and
        file write -> status events (cm-queue-status with ui_target/target) and counts -> shell
        refresh of getlist/status.
      rung: OBSERVED
      evidences: ["model-manager.js installModels(): install_model then queue/start then showTerminal", "probes.log end-to-end sequence 13:16:28Z..13:16:52Z"]
    - id: CF-2
      statement: >-
        Queue administration flow: GET /manager/queue/reset clears pending work; GET
        /manager/queue/start advances it; both are reachable by any caller with no prior state.
      rung: OBSERVED
      evidences: ["probes.log: GET /manager/queue/reset -> 200 (clears pending)", "probes.log: GET /manager/queue/start -> 200 (idle no-op and processing start)"]
    - id: CF-3
      statement: >-
        Listing flow: GET /externalmodel/getlist?mode=<channel> -> server-side catalog document
        with installed flags computed from disk.
      rung: OBSERVED
      evidences: ["probes.log: GET /externalmodel/getlist?mode=default -> 200, 265778 bytes", "probes.log: installed flag flip after e2e"]
    - id: CF-4
      statement: >-
        Channel selection flow: GET /manager/channel_url_list?value=<name> mutates the selected
        channel among six predefined names; the served model list is unaffected.
      rung: OBSERVED
      evidences: ["probes.log: select tutorial -> selected tutorial; restore default -> selected default", "probes.log: model list byte-identical across modes"]
  data_flows:
    - id: DF-1
      statement: >-
        Catalog record fields (url, filename, save_path) -> request body -> validated per-field ->
        worker download parameters -> filesystem path models/<save_path>/<filename> receives the
        fetched bytes; disk state then feeds the installed flag.
      rung: OBSERVED
      evidences: ["probes.log e2e run: installed False->True for GroundingDINO_SwinT_OGC.cfg.py", "probes.log: field mixing accepted (destination fields need not belong to the url's record)"]
    - id: DF-2
      statement: >-
        Caller-supplied ui_id -> queue job correlation key -> status events (target=ui_id,
        ui_target=model_manager) -> shell row matching and install-state refresh.
      rung: INFERRED
      evidences: ["model-manager.js: data.ui_id = item.hash; onQueueStatus uses event.detail.target/ui_target", "probes.log: bogus ui_id accepted (no validation)"]
    - id: DF-3
      statement: >-
        Disk state (model files present) -> installed flags in the catalog document -> shell
        rendering of installed/not-installed rows.
      rung: OBSERVED
      evidences: ["probes.log: getlist before/after the e2e download (False -> True)"]
    - id: DF-4
      statement: >-
        Remote catalog document fields (name, reference, description) -> manager shell DOM via
        string interpolation.
      rung: OBSERVED
      evidences: ["model-manager.js formatter interpolating name/reference", "catalog sourced from raw.githubusercontent.com per IA-5"]
trust_model:
  trust_agreements:
    - id: TA-1
      statement: >-
        The receiving side of IA-1 treats the posted record as a single catalog record: one
        legitimate artifact, one legitimate destination, submitted by an entitled caller.
      requires:
        - item: url, filename and save_path jointly belong to one catalog record (the destination belongs to the source)
          kind: attribute
          rung: OBSERVED
          evidences: ["gap: field mixing url A + filename/save_path B accepted -> 200", "probes.log: field mixing probe"]
        - item: the declared size bounds the artifact that will be fetched
          kind: attribute
          rung: OBSERVED
          evidences: ["gap: mixing record declared 1.01KB with a 4.71MB url and was accepted", "probes.log: no size enforcement observed"]
        - item: ui_id identifies the submitting client's own job and cannot steer other clients' views
          kind: attribute
          rung: OBSERVED
          evidences: ["gap: arbitrary ui_id accepted; UI matches rows by it", "probes.log: bogus ui_id -> 200"]
        - item: the request originates from the manager shell operated by the deployment's single user
          kind: context
          rung: OBSERVED
          evidences: ["gap: no origin or CSRF check observed; JSON parsed for text/plain bodies", "probes.log: text/plain probe -> same validation"]
        - item: the caller holds the privilege to trigger outbound fetches and writes into shared model storage
          kind: privilege
          rung: OBSERVED
          evidences: ["gap: no privilege layer exists (auth_methods [none]); every request is the default profile", "probes.log: unauthenticated 200s on install/start/reset"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:11:40Z .. 13:18:13Z"]
    - id: TA-2
      statement: >-
        The receiving side of IA-2 treats queue advancement as the operator's decision over the
        operator's own pending work.
      requires:
        - item: the caller is entitled to advance or clear the shared queue
          kind: privilege
          rung: OBSERVED
          evidences: ["gap: start/reset are unauthenticated GETs; no entitlement check observed"]
        - item: the pending set is stable between enqueue and start (the submitter's work is not removable by third parties)
          kind: attribute
          rung: OBSERVED
          evidences: ["gap: reset cleared a pending job queued by another probe sequence without ownership binding", "probes.log: reset cleared pending, kept done history"]
        - item: completed history observed by a caller reflects only work that caller cares about
          kind: context
          rung: OBSERVED
          evidences: ["gap: global queue view, no filtering", "probes.log: status shows other probes' jobs"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:15:02Z, 13:18:35Z"]
    - id: TA-3
      statement: >-
        The receiving side of IA-3/IA-4 treats queue counts and the catalog document as
        non-sensitive operational state of the deployment.
      requires:
        - item: the caller is entitled to read the global queue state and the full model catalog
          kind: privilege
          rung: OBSERVED
          evidences: ["gap: no auth on status/getlist; full 564-record document served", "probes.log: getlist/status anonymous 200s"]
        - item: the catalog document faithfully represents the operator's configured channel
          kind: attribute
          rung: OBSERVED
          evidences: ["gap: mode ignored for the model list (byte-identical across modes); channel selection has no observable effect on it", "probes.log: mode probes"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:11:40Z, 13:15:10Z"]
    - id: TA-4
      statement: >-
        The receiving side of IA-6 treats the remote origin as the authoritative publisher of
        the artifact named by the catalog record, and the resolved path as confined to the
        intended model directory.
      requires:
        - item: the origin serves exactly the artifact the catalog intends (identity, integrity)
          kind: attribute
          rung: INFERRED
          evidences: ["gap: no hash/signature/size verification observed end to end", "probes.log: e2e download accepted with no integrity assertion"]
        - item: the resolved destination path stays inside the model root
          kind: attribute
          rung: OBSERVED
          evidences: ["established by exact catalog-value checks on save_path and filename (traversal-shaped deviations rejected 400)", "probes.log: traversal probes rejected"]
        - item: every catalog value is itself path-safe (the allowlist carries the whole guarantee)
          kind: attribute
          rung: ASSUMED
          evidences: ["no probe can forge a catalog value; blocked with reason (see evidence_gaps)", "nested save_path values such as embeddings/SD1.5 exist in the catalog"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:16:34Z .. 13:16:52Z"]
    - id: TA-5
      statement: >-
        The receiving side of IA-5 treats the selected channel as the operator's intended
        catalog source.
      requires:
        - item: the caller is entitled to change the selected channel
          kind: privilege
          rung: OBSERVED
          evidences: ["gap: select mutation works without authentication (tutorial observed)", "probes.log: channel select probe"]
        - item: the channel cannot be pointed outside the predefined name::url list
          kind: attribute
          rung: OBSERVED
          evidences: ["established: injected name::url value produced no state change and no fetch", "probes.log: channel injection probe"]
      rung: OBSERVED
      evidences: ["probes.log lines 2026-10-18T13:17:22Z .. 13:18:05Z"]
    - id: TA-6
      statement: >-
        The receiving side of IA-7 (the manager shell) treats catalog-derived strings as inert
        text when rendering the model grid.
      requires:
        - item: catalog fields are safe for direct DOM interpolation (escaping, quoted attributes)
          kind: attribute
          rung: OBSERVED
          evidences: ["gap: `<a href=${rowItem.reference} ...>${name}</a>` interpolation with an unquoted attribute", "GET model-manager.js -> 200"]
        - item: the catalog document that reaches the shell is the trusted one fetched from the configured channel
          kind: context
          rung: ASSUMED
          evidences: ["the shell trusts whatever the manager serves as the model list", "see evidence_gaps: catalog refresh source not observable"]
      rung: OBSERVED
      evidences: ["probes.log: GET /extensions/comfyui-manager/model-manager.js -> 200"]
  dynamic_state_trust:
    states:
      - id: S0
        name: IDLE
        definition: no pending jobs; done history may exist; is_processing false
        rung: OBSERVED
        evidences: ["probes.log: queue/status 0/0/0 at rest", "probes.log: total 1 done 1 after reset of pending work"]
      - id: S1
        name: PENDING
        definition: one or more queued jobs not yet started; total_count > done_count; is_processing false
        rung: OBSERVED
        evidences: ["probes.log: total_count 3 after three accepted installs", "probes.log: total 2 done 1 with the mixing job pending"]
      - id: S2
        name: PROCESSING
        definition: the worker loop is consuming the pending set; is_processing true
        rung: OBSERVED
        evidences: ["probes.log: post-start status done 1/1 (the 1.01KB job completed inside the status round trip; in_progress window too short to sample)", "unit dossier: background work queue publishes progress over the client channel"]
      - id: S3
        name: DONE_HISTORY
        definition: jobs completed and retained in the queue record until a reset clears pending items; done_count >= 1
        rung: OBSERVED
        evidences: ["probes.log: done_count 1 retained across resets", "probes.log: final queue state total 1 done 1"]
      - id: S4
        name: INSTALLED
        definition: the artifact exists in the model directory and the catalog reports installed True for its record
        rung: OBSERVED
        evidences: ["probes.log: installed flag False -> True after the e2e download", "note: a file at S4 survives any queue reset (no rollback path observed)"]
      - id: S5
        name: JOB_FAILED
        definition: a job that fails during fetch/write; the queue count semantics for failed jobs
        rung: ASSUMED
        evidences: ["not observed: the single e2e job succeeded", "unit dossier: work queue reports progress per job"]
    transitions:
      - id: T-1
        state_from: S0
        state_to: S1
        trigger: "POST /manager/queue/install_model (+/api mirror) with a membership-passing record"
        artifact: posted catalog record plus ui_id; queue write
        establishes:
          - item: per-field membership of url/filename/save_path in the served catalog sets
            rung: OBSERVED
            evidences: ["probes.log: verbatim -> 200; single-field deviations -> 400/403; mixing -> 200"]
          - item: "no validation present for name/description/reference/size/ui_id and no input-shape validation"
            rung: OBSERVED
            evidences: ["probes.log: bogus ui_id -> 200; filename=123 -> 500; {} -> 500"]
        requires:
          - item: the queued job's destination fields belong to the record's url (joint identity)
            kind: invariant
            rung: OBSERVED
            evidences: ["not established: mixing accepted"]
          - item: the enqueued job is owned by the submitting client
            kind: trust_transition
            rung: OBSERVED
            evidences: ["not established: no session/ownership binding; ui_id is free-form"]
          - item: the queue carries the state attributes (pending count, ui_id) that later steps rely on
            kind: state_attribute
            rung: OBSERVED
            evidences: ["queue status counts observed; ui_id echoed per the shell JS"]
        side_effects: pending count +1; job record in the global queue; status events
        rung: OBSERVED
        evidences: ["probes.log sequence 13:11:40Z..13:18:13Z"]
      - id: T-2
