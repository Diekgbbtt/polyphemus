    suite_class: ssrf
    rung: FALSIFIED
    evidences: ["probes.log: forged reference -> 200 accepted", "ssh oracle: no listener hits", "dropped: reference is never fetched (display-only)"]
  - id: V-D4
    fault_ref: F-3
    class: >-
      DROPPED (falsified): catalog-source redirection by injecting a name::url value into the
