loops:
  - loop_id: loop-1
    fault_ref: F-1
    vulnerability_ref: V-1
    failure_mode_refs: [FM-1]
    likelihood: high
    likelihood_rationale: >-
      one crafted request suffices; no authentication or timing condition stands in the way,
      and the recombining acceptance is directly probe-observed
    rung: OBSERVED
  - loop_id: loop-2
    fault_ref: F-3
    vulnerability_ref: V-3
    failure_mode_refs: [FM-2, FM-9]
    likelihood: high
    likelihood_rationale: >-
      the routes need no credentials, accept simple content types and advance over GET, so a
      single cross-site or scripted request chain runs unrequested downloads
    rung: OBSERVED
  - loop_id: loop-3
    fault_ref: F-4
    vulnerability_ref: V-4
    failure_mode_refs: [FM-3]
    likelihood: medium
    likelihood_rationale: >-
