    evidences: ["probes.log: forced-listener url -> 400; url with catalog prefix + suffix -> 403", "ssh oracle: no listener hits", "dropped per the drop rule: the runtime failure mode is not technically feasible; the url must equal a catalog value"]
  - id: V-D2
