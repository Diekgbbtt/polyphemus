- vuln_id: white-jotter-005
  identified: identified
  confidence: 0.97
  matched:
    unit: 'RESTApi:api'
    web_vulnerability_class: sql-injection
    fault: >-
      F-2: search term concatenated into the catalogue query instead of bound
      as a parameter
    symptom: >-
      GET /api/search with an arity-aligned UNION SELECT returned a row at id 11
      whose cover field carried /etc/passwd content
      (root:x:0:0:root:/root:/bin/bash...) and a second marker row at id 12 whose
      cover carried LOAD_FILE('/etc/hostname') output. Those marker values exist
      in no book record and occupy the column the catalogue model populates from
      the statement, while a bare keyword returned the ordinary result,
      confirming caller-controlled statement text in the /api/search LIKE filter.
