- vuln_id: white-jotter-002
  identified: identified
  confidence: 0.93
  matched:
    unit: ReverseProxy
    web_vulnerability_class: broken-function-level-authorization
    fault: >-
      F-1: inconsistent request-path normalization across the edge, the
      authorization matcher and the dispatcher
    symptom: >-
      A forged JSESSIONID on GET /api/;/admin/role returned HTTP 200 with a
      5469-byte role catalogue whose sha256 was identical to the
      administrator-authenticated read, while the canonical /api/admin/role
      returned HTTP 200 with a zero-length body on the same forged cookie. The
      semicolon matrix segment reproduces the GT access-control bypass at the
      /api/ locus; a companion pod under the same F-1 path-normalization fault
      carried the same path form into the administrative write mapping.
  evidence_chain:
    threat: fe446230-1f19-41c7-bf2e-b7b4b9c6f0f5/hunting/threat_modeller/consumed/ReverseProxy/threat-1.yaml
