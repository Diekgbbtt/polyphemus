- vuln_id: white-jotter-001
  identified: partial
  confidence: 0.5
  matched:
    unit: AuthenticationMechanism
    web_vulnerability_class: session-management
    fault: >-
      F-1: session authority not bound to the credential; lifecycle events reach
      only the acting session
    symptom: >-
      Inside the successful session-management status-change pod, POST /api/login
      with the shipped default administrator pair admin/123 returned HTTP 200
      {"code":200,"message":"成功","result":"admin"} with a fresh JSESSIONID, while
      the wrong-credential control returned the account-not-found envelope. The
      default-credential symptom is therefore confirmed at the exact /api/login
      locus, but the pod's confirmed web vulnerability class and fault are
      session-management / F-1, not weak-or-default credentials, and no threat or
      test spec was scoped to that class, so the vulnerability is partial rather
      than identified.
