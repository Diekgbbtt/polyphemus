  - Why did the trial client record `stopped` at 08:33:26 while the hunting run continued to 14:45:24? Was this an operator stop whose project-scoped stop call did not reach the running sessions, or a client failure?
  - Was the 7M budget reached because the gateway guard stopped the run at 14:45, or did the run stop for another reason and the ledger merely reached 7,003,931? The trial record carries neither a budget stop nor an overshoot.
  - How was the model string corrupted into "Invalid model name" for the 14:41-14:43 triager sessions, and does it recur on a fresh run?
  - Are the 13 non-GT confirmations reproducible against a clean target instance, or are any of them target-instance artifacts (e.g. the actuator exposure and the source-map disclosure)?
  - Is the 3600 s pod watchdog appropriate for pods that issue 30-65 probes, or should the watchdog be per-phase?
  - Is the per-vuln duplication of the threat list (118 rows for 27 threats) intended by the deterministic script, or should the narrowing block count distinct artifacts?
