    body: |-
      ## Observed
      In trial white-jotter-1-20261028T083326-1618c524 (project fe446230-1f19-41c7-bf2e-b7b4b9c6f0f5) both units that own the JNDI/Log4j2 chain were modelled: Service:register (duplicate creation, name canonicalisation, credential policy) and Service:user-administration (the dead roster, zero threats). Neither binds a logging sink or a lookup evaluation, and a case-insensitive search of the entire hunting tree for JNDI, log4j or Log4Shell finds nothing.

