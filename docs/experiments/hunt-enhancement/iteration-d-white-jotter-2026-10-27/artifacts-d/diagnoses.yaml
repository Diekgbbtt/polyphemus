    note: |-
      Names double percent-encoding "where the front-end decodes to a second encoding that the application decodes again" and requires the separator axis and an in-root control; the run tried the dot-encoding axis and alternate separators, not the double-encoded forward slash.
  - source: design_doc
    ref: eval/instances/eval-server-1/docs/design/threat-model-impact-elicitation-adr.md
    note: |-
      "A precursor is a capability entity, not a row"; only a threat carries a victim and damaged property and reaches the hunter. An ASSUMED read primitive filed as a precursor therefore produces no probe.
  closest_issue: null
  proposed_issue:
    title: "Traversal-read closes /api/file/ as an ASSUMED precursor without the double-encoded separator or an in-root control"
    body: |-
      ## Observed
      In trial white-jotter-1-20261028T083326-1618c524 (project fe446230-1f19-41c7-bf2e-b7b4b9c6f0f5) ReverseProxy V-4 bound the /api/file/ path traversal at ASSUMED standing and filed it as precursor IA-24/P-5; no traversal threat was produced. Service:media-asset-serving, which owns the namespace, explicitly refused to re-open the hunt and closed with zero threats.

      The deployed handler is `LibraryController.readCoverFile` (`setup_files/environment/inserted_vulns/white-jotter-upload-file-read-traversal.patch`), which strips the prefix, decodes twice and joins the result to the upload directory with no containment check; it returns an empty 404 when the target is not a file. The GT exploit reads /etc/passwd with `..%252f..%252f..%252fetc%252fpasswd`.

      The run's probes used `..;/..;/..;/windows/win.ini`, `..%5c..%5cwindows%5cwin.ini`, `%2e%2e%5c`, `%252e%252e%255c`, `....//....//windows/win.ini` and `%2e%2e/%2e%2e`; it never tried the literal-dot, double-encoded forward-slash separator. It also had no in-root control because the published cover name returns 404, so it treated the containment as uncalibrated rather than promoting the capability.

      ## Impact
      white-jotter-006 is missed because a live, double-decoding read primitive was closed as an ASSUMED precursor with no probe of the shape that works. The one channel that carries the GT read produced no threat, no spec and no pod.

      ## Proposed direction
      1. Require a `%252f` (double-encoded forward-slash) separator probe as a first-class shape whenever a wildcard read route is mapped, distinct from the double-encoded dot shapes.
      2. Treat a uniform empty 404 under a mapped API prefix as ambiguous, not as route absence: require an in-root control that certainly resolves, or an out-of-band proof, before closing the containment question.
      3. Do not let a live read primitive close as a zero-threat ASSUMED precursor; emit a hunter-dispatchable threat for the cheapest falsifying probe, or record the un-dispatched capability on the run terminal.
      4. Correct V-4's handler attribution to the live mapping so the containment reasoning starts from a hand-written reader, not a framework resolver.
