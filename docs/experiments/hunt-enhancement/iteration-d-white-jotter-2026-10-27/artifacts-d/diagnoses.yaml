# The issue bank was unavailable for this dispatch: EVAL_GITHUB_TOKEN is unset
# and `python3 -m orchestrator issue-search` refuses with "EVAL_GITHUB_TOKEN is
# not set; the issue-bank search cannot authenticate". Every row therefore
# carries a proposed_issue for the operator instead of a closest_issue.
