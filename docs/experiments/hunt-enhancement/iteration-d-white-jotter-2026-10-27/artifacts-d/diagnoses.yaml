  closest_issue: null
  proposed_issue:
    title: "A confirming pod is exported as unsuccessful when the triager misses the 3600 s watchdog"
    body: |-
      ## Observed
      In trial white-jotter-1-20261028T083326-1618c524 (project fe446230-1f19-41c7-bf2e-b7b4b9c6f0f5) the mass-assignment spec `mass-assignment-nested-relation-write__roles-array-by-id__sysadmin-role` executed the GT test and its experiment log confirms the exact symptom: registering with `roles:[{"id":1}]` yields a 1575 B admin menu, `/api/admin/role` 5549 B including sysAdmin id 1, durable across a fresh login, while the no-roles control yields `[]`.

      The durable PodExport is nevertheless `verdict: unsuccessful`, `terminal_reason: pod-watchdog-timeout`, `iterations: 1`, `clean: false`, `interpretations: []`. The runner concluded and wrote the summary; the triager never returned a decision, and the 3600 s session window expired. A sibling pod (`...__role-grant-set`) even carries a `symptom-confirmed` interpretation and is still exported as unsuccessful with the same watchdog reason.

      `surfer.py` sets `DEFAULT_POD_SESSION_TIMEOUT_S = 3600.0` and, on timeout, calls `finalize_pod(PodTerminal.infrastructure(reason=POD_WATCHDOG_TIMEOUT))`, which is always `unsuccessful` and `clean=False`. The domain terminal is only reached after the triager returns. 17 of the run's 47 pod exports are watchdog timeouts, so this is the normal path rather than a backstop.

      ## Impact
      A fully confirmed GT vulnerability is scored partial because the pod's terminal, not the pod's evidence, decided the verdict. The same mechanism can hide any confirmed symptom whose triage is slow.

      ## Proposed direction
      1. Let the pod exceed or renew its window while the triager is progressing, or bound the triager's stages so a confirming run always reaches its terminal.
      2. When the watchdog fires, salvage any durable `experiment_summary` or `symptom-confirmed` interpretation into the export instead of unconditionally stamping unsuccessful and clean false.
      3. Emit a distinct harness terminal (for example `pod-triager-stalled`) so the assessment can separate a harness failure from a genuine negative.
      4. Treat the watchdog as a backstop: investigate why 17 of 47 pods consume it before treating any watchdog export as evidence of absence.
    labels: [bug, needs-triage]
