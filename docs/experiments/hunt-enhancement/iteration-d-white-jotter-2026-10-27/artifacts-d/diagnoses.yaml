- vuln: white-jotter-007
  failure_mode: pod_diverged_trajectory
  root_cause:
    type: implementation_defect
    combination_of: [design_defect]
    extended_description: |-
      The ground truth is mass assignment at the public registration endpoint. The exploit keeps the normal register fields and adds roles:[{"id":1}] (the sysAdmin role), then signs in and reads the back office as an administrator (white-jotter-007/metadata.json and report.md).

      The hunter authored the correct spec and the pod executed it. RESTApi-api__threat-1 dispatched mass-assignment-nested-relation-write__roles-array-by-id__sysadmin-role; its experiment log 1 is an explicit confirmation: "CONFIRMED privilege escalation via nested relation write on unauthenticated POST /api/register", with the control body (no roles) returning /api/menu {code:200,result:[]} 43 B and the payload body returning a 1575 B four-node admin tree, /api/admin/role 5549 B including sysAdmin id 1, role/perm 293 B, durable across a fresh re-login. That is exactly the GT symptom.

      The pod's durable export nevertheless says verdict unsuccessful, terminal_reason pod-watchdog-timeout, iterations 1, clean false, interpretations []. The runner had concluded and written the summary; the triager never produced a decision and the 3600 s session window expired, so the watchdog finaliser stamped an infrastructure terminal and the confirmed symptom was discarded. A sibling pod proves the same loss with a completed triage: mass-assignment-nested-relation-write__roles-array-by-id__role-grant-set carries an interpretation classified "symptom-confirmed" (role id 14 with a caller-authored grant set), yet its export is also verdict unsuccessful, pod-watchdog-timeout, clean false.

      The mechanism is in the code: surfer.py gives every pod session DEFAULT_POD_SESSION_TIMEOUT_S = 3600.0 and, on asyncio.TimeoutError, calls finalize_pod with PodTerminal.infrastructure(reason=POD_WATCHDOG_TIMEOUT), which by construction has verdict unsuccessful and clean False. The finalizer returns an existing terminal unchanged, but the domain terminal node is only reached after the triager returns; a slow or stalled staged triage therefore loses a confirmed runner summary.

      The design makes this the normal path, not a backstop: 17 of the run's 47 PodExports carry pod-watchdog-timeout, and 5 more carry no-symptom-evidence. A pod that confirms the GT symptom but loses its domain terminal is scored unsuccessful, so the assessment can only mark the vulnerability partial.
  diagnosis_overview: |-
    white-jotter-007 is mass assignment at POST /api/register: the body keeps the five normal fields and adds roles:[{"id":1}], then the new account reads the back office as administrator.
    The hunter authored the right spec (RESTApi-api__threat-1, roles-array-by-id/sysadmin-role) and the pod executed it. Its experiment log records the exact GT symptom: the roles payload yields a 1575 B admin menu, /api/admin/role 5549 B with sysAdmin id 1, durable across a fresh login, while the no-roles control yields [].
    The pod's durable export is nevertheless unsuccessful with terminal_reason pod-watchdog-timeout, iterations 1, clean false and no interpretation: the runner concluded, the triager never produced a decision, and the 3600 s window expired. A sibling mass-assignment pod shows the same loss with a symptom-confirmed interpretation but a watchdog terminal.
    The watchdog finaliser always stamps unsuccessful and clean false, and 17 of 47 pod exports hit it, so a confirming pod routinely loses its verdict.
    Typed root cause: an implementation defect in the pod terminal path (watchdog finalisation discards a confirmed runner summary and triager interpretation), combined with a design in which the watchdog is the normal path rather than a backstop.
