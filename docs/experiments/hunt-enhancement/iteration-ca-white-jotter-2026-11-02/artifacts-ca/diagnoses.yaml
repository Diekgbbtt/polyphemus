- vuln: white-jotter-007
  failure_mode: pod_diverged_trajectory
  root_cause:
    type: implementation_defect
    combination_of: [design_defect]
    extended_description: |-
      The ground truth is mass assignment at the public registration endpoint: keep the normal fields, add roles:[{"id":1}] (sysAdmin), register, sign in, and read the back office as an administrator (white-jotter-007/metadata.json, report/report.md).

      The hunter authored the correct threat and spec: RESTApi-api threat-2 is mass-assignment, and the consumed spec mass-assignment__roles-array-multi__existing-sysadmin-plus-content-manager requires a two-element roles array (ids 2 and 1) whose union of menu branches proves whole-collection binding, against a role-less control.

      The pod executed a different shape. Its raw trail registers single-role accounts: role id 1 gives a 1575-byte administrative menu, role id 2 gives 1000 bytes, and the role-less control gives []. That is the GT /api/register privilege-escalation symptom (single role id 1), but it is not the spec's two-element union. The pod then tried to re-confirm the account and role reads and hit the target substitution: at 07:25:17Z the host answered PrestaShop 401 on /api/register; at 07:47:46Z it briefly answered white-jotter /api/menu 302 with JSESSIONID; at 08:01:17Z it answered 502; from 08:08Z to 08:49Z it answered PrestaShop 401. The pod kept polling until the 5400 s watchdog and its export is verdict unsuccessful, terminal_reason pod-watchdog-timeout, iterations 1, interpretations [].

      The code makes that terminal lossy: surfer.py sets DEFAULT_POD_SESSION_TIMEOUT_S = 3600.0 (the run's env raises it to 5400) and on asyncio.TimeoutError finalizes with PodTerminal.infrastructure(reason=POD_WATCHDOG_TIMEOUT), which is always verdict unsuccessful and clean False; finalize.py fixes that binary; graph.py reaches the domain terminal only after the triager returns. A pod that has already observed the GT symptom therefore exports as unsuccessful, and the assessment can only mark the vulnerability partial.

      The target substitution is the proximate cause of the timeout: the white-jotter container stayed up on its published host port 46271 throughout (started 2026-11-02T18:16:05Z, image pentestbench-white-jotter:1.0.1), while the synthetic host t-1618c524.target was re-pointed to SIYUCMS at 21:19Z and to PrestaShop by 07:25Z. The front conf for the host currently points back to 46271 and was last rewritten at 13:55:40Z. The hunting pipeline has no target-identity assertion, so the pod kept probing the substituted upstream instead of aborting or terminating on the symptom it had already seen.

      The design compounds it: the watchdog is the normal path for a large share of pods, and the pod's spec was not enforced at execution time (single-role instead of two-element array). The result is a partial verdict for a symptom the pod actually observed.
  diagnosis_overview: |-
    white-jotter-007 is mass assignment at POST /api/register: the body keeps the five normal fields and adds roles:[{"id":1}], then the new account reads the back office as administrator.
    The hunter authored the right threat and spec (RESTApi-api threat-2; mass-assignment__roles-array-multi...), requiring a two-element roles array and a role-less control.
    The pod registered single-role accounts instead: role id 1 gives a 1575-byte admin menu, role id 2 gives 1000 bytes, the control gives []. That is the GT symptom but not the spec's two-element union.
    The synthetic host was then re-pointed: PrestaShop 401 at 07:25Z, a brief white-jotter window at 07:47Z, 502 at 08:01Z, PrestaShop 401 through 08:49Z. The pod kept polling until the 5400 s watchdog and exported unsuccessful, pod-watchdog-timeout, iterations 1, interpretations [].
    surfer.py/finalize.py/graph.py make the watchdog terminal unconditionally unsuccessful and clean false; a pod that observed the GT symptom still cannot land a domain verdict. The white-jotter container stayed up on 46271; the front conf was re-pointed and last rewritten at 13:55:40Z, and the pipeline has no target-identity guard.
    Typed root cause: an implementation defect in the pod terminal path and the missing target-identity guard (implementation_defect), combined with a design in which the watchdog is the normal path and the spec's multi-role shape is not enforced (design_defect).
