  proposed_issue:
    title: "Probe the media unit's own /api/file/ route before closing it as a zero-threat unit"
    body: |-
      ## Observed
      In trial white-jotter-1-20261103T143924-1618c524 (project cbd28a7d-30cb-498b-8e7a-eaa9bc8f37c8) Service:media-asset-serving was modelled but closed with zero threats and archived under `abandoned/`. Its wellformedness note refuses path-traversal-lfi-rfi because "the only traversal I can cite is the OLD layer's encoded %2e%2e attempt, which the container refused with its own 400 ... and the cover store's path was never requested". The unit never sent a request to `/api/file/`.

      The GT is a double-decoded read: `LibraryController.readCoverFile` (`setup_files/environment/inserted_vulns/white-jotter-upload-file-read-traversal.patch`) strips `/api/file/`, calls `decodeTwice`, joins the result to the upload directory, and returns an empty 404 when the target is not a file. The GT exploit reads `/etc/passwd` with `..%252f..%252f..%252fetc%252fpasswd`.

      The unit was created at 21:26:09Z, seven minutes after the synthetic host was re-pointed to SIYUCMS at 21:19Z, so it had no white-jotter window in which to probe the route. The earlier Service:library-catalog unit saw only external i.loli.net cover URLs and never enumerated the API namespace.

      ## Impact
      white-jotter-006 is missed because the one unit that owns `/api/file/` never requested the route, closed the containment question on the old static layer's 400, and was archived as abandoned. No threat, spec or pod was produced for the double-decoded read.

      ## Proposed direction
      1. Require a direct request to the unit's own mapped route before a unit can close with zero threats; a projection naming "static files under the API namespace" is enough to probe `/api/file/<name>`.
      2. Treat a uniform empty 404 under a mapped API prefix as ambiguous, not as route absence; require an in-root control or an out-of-band proof before closing the containment question.
      3. Require a `%252f` (double-encoded forward-slash) separator probe as a first-class shape whenever a wildcard read route is mapped, distinct from the double-encoded dot shapes.
      4. Do not let an ASSUMED precursor or an unobserved unit close a live read primitive with no hunter work; emit a hunter-dispatchable threat for the cheapest falsifying probe.
      5. Add a target-identity assertion so a substituted host is not mistaken for route absence, and do not schedule a unit whose surface has been replaced.
    labels: [bug, needs-triage]
