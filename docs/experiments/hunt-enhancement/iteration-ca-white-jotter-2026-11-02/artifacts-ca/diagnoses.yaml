  closest_issue: null
  proposed_issue:
    title: "A pod that observes the GT mass-assignment symptom is exported unsuccessful after the target is re-pointed and the watchdog fires"
    body: |-
      ## Observed
      In trial white-jotter-1-20261103T143924-1618c524 (project cbd28a7d-30cb-498b-8e7a-eaa9bc8f37c8) the mass-assignment spec `mass-assignment__roles-array-multi__existing-sysadmin-plus-content-manager` observed the GT symptom in its raw trail: a role id 1 registration gives a 1575-byte administrative menu, role id 2 gives 1000 bytes, and the role-less control gives `[]`.

      The durable PodExport is nevertheless `verdict: unsuccessful`, `terminal_reason: pod-watchdog-timeout`, `iterations: 1`, `clean: false`, `interpretations: []`. The pod then saw the synthetic host re-pointed: PrestaShop 401 at 07:25:17Z, a brief white-jotter window at 07:47:46Z, 502 at 08:01:17Z, and PrestaShop 401 through 08:49Z. It kept polling until the 5400 s watchdog.

      `surfer.py` sets `DEFAULT_POD_SESSION_TIMEOUT_S = 3600.0` and, on timeout, calls `finalize_pod(PodTerminal.infrastructure(reason=POD_WATCHDOG_TIMEOUT))`, which is always `unsuccessful` and `clean=False`. The domain terminal is only reached after the triager returns. The white-jotter container stayed up on 46271 throughout; the front conf for `t-1618c524.target` was re-pointed and last rewritten at 13:55:40Z.

      The pod also diverged from the spec's two-element roles array: it tested single-role accounts, so even the positive observation was not the spec's union.

      ## Impact
      A fully observed GT vulnerability is scored partial because the pod's terminal, not the pod's evidence, decided the verdict. The same mechanism can hide any confirmed symptom whose triage is slow or whose target is re-pointed mid-run.

      ## Proposed direction
      1. Let the pod exceed or renew its window while the triager is progressing, or bound the triager's stages so a confirming run always reaches its terminal.
      2. When the watchdog fires, salvage any durable runner summary or confirmed raw observation into the export instead of unconditionally stamping unsuccessful and clean false.
      3. Add a target-identity assertion on every pod probe: when the upstream product changes, abort the pod with a distinct harness terminal (for example `pod-target-substituted`) instead of polling until the watchdog.
      4. Enforce the spec's discriminator at execution time so a `roles-array-multi` spec cannot silently degrade to single-role registrations.
      5. Treat the watchdog as a backstop: investigate why so many pods consume it before treating any watchdog export as evidence of absence.
    labels: [bug, needs-triage]
