units:
- unit: IdentificationSystem
  scope: in
  scope_reason: The rows are session-lifetime and cross-site logout directions on
    the target's own authentication surface; none depends on a volumetric defence,
    a plain-text channel, or a preliminary step outside the target.
  rows:
  - id: IA-1
    mining: sufficient
    rationale: 'The unbounded-identifier capability is the honest end here: the model
      records that the copy is the holder''s own and the cross-origin channels that
      would carry it to a third party are closed, so no concrete end damage was achievable
      from this row.'
    impact_description: 'No end damage is claimed by this row. Holding an identifier
      without a lifetime bound damages nobody on its own: the copy that exists is
      the holder''s own, the service publishes the second representation only into
      the holder''s own address bar and history, and the cross-origin channels that
      would carry a copy to a third party (a framed console, a cross-origin Referer)
      are closed by browser defaults rather than by the application. What the row
      records is the capability''s shape: this plane has no window that closes by
      itself, so any future primitive that exposes an identifier - a delivery, a log,
      a shared URL, a theft - is amplified from a bounded incident into permanent
      authority. The damage such a chain would reach (an end user''s account confidentiality
      and integrity) belongs to whichever unit finds the exposure, and the rotation
      half of the composition is already scored by Service:sign-in.'
    exploitability_description: 'No request achieves this: it is a property of the
      plane, measured by comparing an identifier''s state across a long sequence of
      requests (still 200 with no challenge, no reissue, no re-authentication) against
      the two controls that show the store and the logout path are healthy (a fresh
      identifier is terminated durably by the logout path, and an identifier logged
      out earlier still answers 302). The gap is the missing exposure step, which
      this surface does not provide; the capability is complete and waits for one.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: none
      integrity: none
      availability: none
    risk: 0.0
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N
  - id: IA-2
    mining: sufficient
    rationale: 'Threat row: it carries a CIA-bearing end damage (a third-party navigation
      can repeatedly terminate the victim''s authenticated session) and is always
      sufficient.'
    impact_description: 'Victim: a signed-in end user, and through them the availability
      of the session they are working in. Damaged property: availability, low - a
      third-party page or redirect can terminate the victim''s authenticated session
      without the victim doing anything but visiting it, so the session ends, in-progress
      work is lost and the user is forced to re-authenticate; the same mechanism can
      be repeated whenever they sign in. The damage stops there by construction: the
      transition only destroys the identifier, it does not disclose or alter anything
      the identifier reaches, and every other state change on this surface requires
      a JSON body on a non-GET method that a cross-site simple request cannot produce,
      so no write of the back office is reachable this way.'
    exploitability_description: 'One link or one redirect on an attacker-controlled
      page, followed by the victim as a top-level navigation: the browser attaches
      the identity cookie because no SameSite attribute is set and the Lax default
      still covers top-level GETs, the route is unguarded so no second check applies,
      there is no token to match anywhere on the surface, and the response is a bare
      status that needs no rendering. Nothing has to be circumnavigated and no second
      phase is needed; the only cost is the victim''s visit, which is why the interaction
      is active rather than passive.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: active
      confidentiality: none
      integrity: none
      availability: low
    risk: 5.1
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:A/VC:N/VI:N/VA:L/SC:N/SI:N/SA:L
- unit: Service:navigation-menu
  scope: in
  scope_reason: The row is a role-revocation integrity direction on the target's own
    console; it is not a volumetric, plain-text, or external preliminary-step direction.
  rows:
  - id: IA-1
    mining: sufficient
    rationale: 'Threat row: it carries a CIA-bearing end damage (a revoked role keeps
      its console navigation and authority) and is always sufficient.'
    impact_description: 'Victim: the application''s authorization state and the entitlement
      boundary of the account whose role was withdrawn. Damaged properties: integrity,
      low - the operator''s disable is written to the role record and the console
      reports it, but the derivation that decides the caller''s function set never
      reads it, so a revocation control silently does nothing on this decision; and
      confidentiality, low - the withdrawn role''s screen and route inventory stays
      disclosed and rendered to its holders, who keep the back-office client''s entries
      and therefore the function surface that role named. Bounded because the tree
      is navigation metadata rather than data: what sits behind those routes is a
      separate authorization decision owned by the controller units, and the grant
      dimension of this same derivation is honoured immediately.'
    exploitability_description: 'No special position and no further capability: the
      caller holds an account that was granted the role - a basic authenticated role
      - and the failing action is the operator''s own routine disable. The caller
      does nothing but load the console; there is no defence to circumnavigate, no
      second phase, and no victim interaction beyond the operator''s standard revocation.
      The window is not bounded by the session either, since the derivation is evaluated
      per request and the disable simply never reaches it.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: low
      user_interaction: none
      confidentiality: low
      integrity: low
      availability: none
    risk: 5.3
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:L/VI:L/VA:N/SC:L/SI:L/SA:N
- unit: Service:register
  scope: in
  scope_reason: The rows are registration-uniqueness and name-canonicalisation directions
    on the target's own registration surface, outside every fenced category.
  rows:
  - id: IA-1
    mining: sufficient
    rationale: 'Threat row: it carries a CIA-bearing end damage (duplicate accounts
      make the account store unresolvable and take the roster out of service) and
      is always sufficient.'
    impact_description: 'Victim: the application - specifically its account-administration
      plane and the account store behind it. Damaged properties: availability, low
      - the administrative account roster, the only surface that enumerates accounts,
      answers the generic error envelope to every request and stayed that way for
      the whole observation window, while the role catalogue, credential verification,
      registration and the keyed account writes all kept working, so the loss is the
      operator''s ability to see and account for the roster rather than the service
      itself; and integrity, low - the store is left holding an identity that its
      own uniqueness lookup calls free and its own credential lookup calls absent,
      so the account data no longer reconciles with the service''s view of it. No
      end user''s data is disclosed by this and no credential is exposed; the damage
      is to the administrative plane''s integrity and observability, which is what
      an auditor or an operator relies on.'
    exploitability_description: 'One anonymous caller, no account, no victim and no
      interaction: a handful of identical registration bodies submitted inside the
      same commit window all receive the success envelope, because the uniqueness
      verdict is taken in a read that nothing re-establishes at insert time. There
      is no defence to circumnavigate and no second phase - the same request the service
      offers to every visitor is the whole attack, and the durable consequence is
      confirmed indirectly because the surface that would show the row set is the
      surface that stopped answering (a re-submission is rejected by a store constraint
      while the lookup reports the name free, and credential verification reports
      no such account).'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: none
      integrity: low
      availability: low
    risk: 6.9
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:L/VA:L/SC:N/SI:L/SA:L
  - id: IA-2
    mining: sufficient
    rationale: 'Threat row: it carries a CIA-bearing end damage (a lookalike principal
      occupies another account''s name for name-addressed administration) and is always
      sufficient.'
    impact_description: 'Victim: the end user whose account an operator intends to
      administer, and the application''s account and authorization store. Damaged
      property: integrity, low - the administration surface is addressed by account
      name, and a name submitted with a leading space produces a second, distinct
      principal that is indistinguishable from the original in every rendering the
      operator is given, so a routine disable, credential reset or role grant performed
      on the visible name can land on the lookalike instead of the intended account.
      The boundary between the two identities exists only inside the store''s collation:
      the response, the principal and the roster row all look the same, which is why
      the operator''s ordinary flow - not an exotic one - is what completes the damage.
      Confidentiality is not claimed: neither account''s records are disclosed by
      the ambiguity itself.'
    exploitability_description: 'One anonymous registration with a single leading
      space, no credential and no second phase; nothing has to be beaten because the
      service never normalises or constrains the name it stores as the identity key.
      The remaining step is passive: an operator performing their ordinary roster
      work on the name they can see, at which point the collation - invisible in every
      surface the operator has - decides which row moves. That the observed writes
      did hit only the lookalike is a property of the collation, not of any control
      in this service, which is precisely why the ambiguity is the damage.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: passive
      confidentiality: none
      integrity: low
      availability: none
    risk: 5.3
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:P/VC:N/VI:L/VA:N/SC:N/SI:L/SA:N
- unit: AuthenticationMechanism
  scope: in
  scope_reason: The row is a persistent-credential lifecycle direction on the target's
    own authentication surface, not a volumetric, plain-text, or external preliminary-step
    direction.
  rows:
  - id: IA-1
    mining: sufficient
    rationale: The persistent rememberMe token admits nothing on its own - a caller
      presenting only it is refused - so the capability is the honest end; the chains
      that would turn it into damage are absent from this surface.
    impact_description: 'No end damage is claimed by this row. The persistent token
      admits nothing on its own - a caller presenting only it is refused by both the
      state reporter and the guarded route, before and after sign-out - so possession
      of the value grants no access and there is no victim whose data or authority
      it reaches. The three chains that would turn a persistent credential into damage
      are all absent here: no script in the origin can read it (HttpOnly), no network
      position is in scope, and a cross-site delivery buys nothing because the token
      does not authenticate. What the row records is exposure breadth for a chain
      another unit owns: a 536-character bearer ciphertext is minted for every account
      that ever signs in, lives three days, is re-minted on every login and cannot
      be observably revoked, and is decrypted and deserialised back into a principal
      on every request - the sink Service:sign-in measured, whose only gap is key
      custody.'
    exploitability_description: 'Obtaining the token is the ordinary act of signing
      in: any caller who holds an account''s credential receives one whether or not
      they ask, so the primitive costs a valid credential and nothing else (low privilege,
      no interaction, no defence to beat). What it does not do is anything with it.
      Turning it into an end damage requires a further capability this surface does
      not provide - either a key-custody break at the deserialisation sink or a channel
      that lifts the token out of an HttpOnly cookie - which is why the row stops
      here and names the sink''s owner instead of claiming a chain.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: low
      user_interaction: none
      confidentiality: none
      integrity: none
      availability: none
    risk: 0.0
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:L/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N
- unit: AuthorizationSystem
  scope: in
  scope_reason: The row is a permission-model integrity direction on the target's
    own surface, outside every fenced category.
  rows:
  - id: IA-1
    mining: sufficient
    rationale: 'The missing permission check is a legitimate hand-off: its data-access
      end damage is filed as ReverseProxy IA-1/IA-2, the spelling primitive this row
      explicitly cites as the only way the check becomes data access, so no unowned
      end damage is left at the capability.'
    impact_description: 'No end damage is claimed by this row. The missing check damages
      nothing by itself: the resources the permission model names are answered empty
      at the edge on their canonical spelling, so a caller who lacks a permission
      and a caller who holds it receive the same nothing on the surface the model
      describes. The only way the absent check becomes data access is through the
      spelling primitive that reaches those handlers with no principal at all, and
      that reach - confidentiality of the account roster and the RBAC model, integrity
      of the account store through the same handlers - is measured and scored by ReverseProxy''s
      two threats. What this row records is the capability that makes that reach total
      rather than bounded: there is no function-level backstop, so every administrative
      revocation the operator can perform on a permission has no effect on any request
      outcome, and the model''s two halves may diverge without any component noticing.'
    exploitability_description: 'Nothing to exploit on its own: the row is a property
      of the pipeline, established by measurement rather than by a request. Three
      observations fix it - the permission-named resources answer a permission-less
      caller, the one guarded route admits a permission-less session and a fully permitted
      one identically, and the served client has neither a permission branch nor a
      denial rendering. Closing the gap needs one further capability, the spelling
      primitive that reaches a handler without passing the guard, which another unit
      holds and has scored; this row deliberately stops short of it.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: none
      integrity: none
      availability: none
    risk: 0.0
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N
- unit: IntegrationSystem:cross-origin-policy
  scope: out
  scope_reason: The row's capability requires an attacker to first serve content on
    http://localhost:8080 before the victim's browser acts; that is a preliminary
    step outside the target's own attack surface to gain client-side code control,
    which the injected scope fence excludes. Its rows therefore do not count as scored
    damage.
  rows:
  - id: IA-1
    mining: sufficient
    rationale: 'Even out of scope the row is the honest end: the credentialed half
      never arrives because the identity cookie sets no SameSite attribute and browsers
      apply Lax, so the authorised-origin capability damages nothing on its own.'
    impact_description: 'No end damage is claimed by this row. The grant is real -
      one origin outside the application''s control may read the API and preflight
      every verb, with credentials allowed by policy - but the only data it can actually
      read is data it can read without the grant. The credentialed half never arrives:
      the identity cookie sets no SameSite attribute, so browsers apply Lax and omit
      it from a cross-site fetch, which makes every authorised-origin read anonymous.
      What remains anonymous is the public catalogue and article surface by design,
      plus the roster and role model that the parameterised spelling reaches with
      no cookie at all - and that reach is ReverseProxy''s measured damage, not a
      second one: a page at the authorised origin gains no access the attacker does
      not already have from a raw client. No victim''s confidentiality, integrity
      or availability is reached through this entry today.'
    exploitability_description: 'Exercising the grant costs no privilege and no victim
      interaction from the application''s side: any page served from http://localhost:8080
      in a victim''s browser is authorised automatically, and the preflight approves
      every verb, so the chain needs nothing from the victim beyond loading that page.
      The missing pieces are on the other side of the chain, not in the policy. First,
      the page has to exist on the victim''s loopback port, which is a precondition
      outside the target''s own surface. Second, a credentialed read would need the
      session cookie to travel, which the browser''s Lax default prevents. Third,
      the data reachable anonymously is public or already available through ReverseProxy''s
      spelling bypass. That is why this row stops at the capability: the policy authorises
      the right origin-and-verb combination and is missing only a victim-side delivery
      and a credential-scope change to become a cross-origin data read.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: none
      integrity: none
      availability: none
    risk: 0.0
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N
- unit: RESTApi:api
  scope: in
  scope_reason: The rows are catalogue-query injection and registration over-posting
    directions on the target's own API surface, outside every fenced category.
  rows:
  - id: IA-1
    mining: sufficient
    rationale: 'Threat row: it carries a CIA-bearing end damage (anonymous read of
      database rows through the catalogue query) and is always sufficient.'
    impact_description: 'Victim: the application''s persisted data, held in the same
      database the API queries - the account records the roster endpoint exposes (username,
      real name, telephone, e-mail, password hash, enabled state, role bindings),
      the unpublished article and book rows behind the administrative routes, and
      the role/permission model. Damaged property: confidentiality, high. The caller
      controls the predicate of an anonymous statement and can append its own result
      set to an eight-column projection that the API renders back as JSON fields,
      so the read is not limited to rows the search was meant to match and not limited
      to the catalogue table.'
    exploitability_description: 'One anonymous GET per query: no account, no session,
      no victim action, no second phase. The statement shape is already mapped (quote
      to confirm the literal, comment to truncate the mapper''s LIKE wrapper, ORDER
      BY to fix the arity at eight, UNION to align types), so extraction is a matter
      of placing the target columns into the rendered positions. I verified the sink
      and the projection using only caller-authored literals and deliberately extracted
      no foreign row; the payload belongs to the hunter. The neighbouring credential
      query was probed as a negative control and is bound, which localises the defect
      to the search mapper rather than the layer as a whole.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: high
      integrity: none
      availability: none
    risk: 9.2
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N
  - id: IA-2
    mining: sufficient
    rationale: 'Threat row: it carries a CIA-bearing end damage (an unauthenticated
      self-registration writes an administrative role binding) and is always sufficient.'
    impact_description: 'Victim: the application''s persisted authorization data and,
      through it, every account and catalogue record the granted role reaches. Damaged
      property: integrity, high - a durable administrative role binding is written
      into the authorization store by an unauthenticated self-registration, indistinguishable
      from an administrator''s grant on every later read. Confidentiality, low as
      measured: the account''s derived authority is directly visible (the full back-office
      navigation tree renders for it), while reading the records behind those functions
      needs the separate routing primitive that ReverseProxy already filed.'
    exploitability_description: 'Two anonymous requests and one login: register with
      the nested role array, then sign in as the new account. No account is needed
      beforehand, no victim acts, no defence must be iterated, and the escalation
      is not a race - it is a persisted association that survives every later session.
      Measured entirely on an account I created for the purpose and returned to a
      role-less state afterwards; the restore needed the same role-update write the
      back office uses, which the escalated account itself was permitted to perform.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: low
      integrity: high
      availability: none
    risk: 9.2
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:L/SI:H/SA:N
- unit: ReverseProxy
  scope: in
  scope_reason: The rows are path-canonicalisation, namespace-masking, source-map
    and reachability directions on the target's own edge and origin; none is a volumetric,
    plain-text, or external preliminary-step direction.
  rows:
  - id: IA-1
    mining: sufficient
    rationale: 'Threat row: it carries a CIA-bearing end damage (anonymous account-roster
      and role-model read) and is always sufficient.'
    impact_description: 'Victim: the end users of the application (their account records)
      and the application''s persisted authorization data. Damaged property: confidentiality,
      high. One anonymous request returns the complete account roster with username,
      real name, telephone number, electronic-mail address, enabled state and granted
      roles for every account (including the administrator), plus the complete role
      model: which role carries which permission, the permission catalogue with its
      target URLs, and the menu catalogue each role may reach. No redaction is applied
      and no field requires a higher entitlement.'
    exploitability_description: 'The chain is one request with no account, no cookie
      and no victim participation. The caller sends a back-office path whose spelling
      injects a literal '';'' path parameter into a filler segment (''/api/x/..;/admin/user''):
      the edge decodes and dot-resolves the path for its own classification but forwards
      the raw target, so the request is treated as an ordinary /api call and not as
      the /api/admin namespace; the authorisation filter matches its patterns against
      the same un-stripped path and finds no rule; the servlet container then strips
      the path parameter, resolves the dot segment and dispatches to the real admin
      controller, which executes with no principal. No defence must be iterated: the
      spelling worked on the first attempt, and the remaining admin reads (role, permission
      and menu catalogues) use the same shape. Human participation: none.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: high
      integrity: none
      availability: none
    risk: 9.2
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:N/VA:N/SC:H/SI:N/SA:N
  - id: IA-2
    mining: sufficient
    rationale: 'Threat row: it carries a CIA-bearing end damage (anonymous rewrite
      of account attributes, state and role grants) and is always sufficient.'
    impact_description: 'Victim: the application''s persisted authorization and account
      data, and every end user whose account is a target. Damaged property: integrity,
      high (confidentiality, low - the write responses confirm the affected account
      name and message). The same bypass reaches the mutating back-office handlers:
      an account''s personal attributes, its enabled state and its role grants can
      be rewritten by an anonymous caller. Granting the sysAdmin role to an account
      the attacker controls, or disabling the accounts that defend the catalogue,
      is a durable change that survives the request and cannot be attributed to any
      principal.'
    exploitability_description: One request, unauthenticated. The capability of IA-1
      (P-1) is used to read the roster and the role identifiers; the same '/api/x/..;/admin/...'
      spelling then carries a PUT to the account-update and account-status handlers,
      which reply with the application's success envelope. The request bodies observed
      in the client bundle name the fields (username, name, phone, email, roles[];
      enabled, username), so no further capability is needed to target an arbitrary
      account. No victim action and no human participation are required; the only
      additional phase beyond IA-1 is choosing the target from the roster already
      read.
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: low
      integrity: high
      availability: none
    risk: 9.2
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:L/VI:H/VA:N/SC:L/SI:H/SA:N
  - id: IA-3
    mining: sufficient
    rationale: 'The namespace-masking capability is the honest end: the uniform empty
      200 discloses and changes nothing, and its damage is owned by IA-1/IA-2.'
    impact_description: 'No end damage follows from this row. The short-circuit returns
      no data, changes no state and never establishes an identity, so there is no
      victim and no damaged property; its owner learns nothing from it. It is the
      masking half of the chain scored in IA-1 and IA-2: because the canonical spelling
      always answers an empty 200, the namespace''s live state and the real coverage
      of the guard cannot be measured from it, and the true state is only visible
      through a different spelling. The capability is recorded so a later unit can
      reference it.'
    exploitability_description: A single unauthenticated request to the canonical
      namespace, for any method, with or without a session - the answer does not depend
      on identity. There is no chain to assemble and no human participation; the row
      exists to name the observable '<em>namespace answers empty</em>' capability
      that the read and write rows in this unit must be distinguished from.
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: none
      integrity: none
      availability: none
    risk: 0.0
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N
  - id: IA-4
    mining: sufficient
    rationale: The route-and-verdict oracle damages nothing by itself; it is the navigational
      precursor already consumed by IA-1/IA-2.
    impact_description: 'No end damage follows from this row: the answers compared
      disclose no record and change nothing, so there is no victim and no damaged
      property. The capability is a route-and-verdict oracle - which spelling the
      edge classified as the privileged namespace, and whether a backend handler answered
      when the response is either the 404 shell or the code-400 wrapper - which is
      what makes the masking in IA-3 navigable. It is recorded as a precursor so a
      later unit can chain it.'
    exploitability_description: Ordinary unauthenticated requests, compared by status,
      declared length and body bytes. No chain is needed and no human participation
      is involved; the value of the row is the differential itself, not an effect
      on the target.
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: none
      confidentiality: none
      integrity: none
      availability: none
    risk: 0.0
    risk_vector: CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:N/VI:N/VA:N/SC:N/SI:N/SA:N
  - id: IA-5
    mining: sufficient
