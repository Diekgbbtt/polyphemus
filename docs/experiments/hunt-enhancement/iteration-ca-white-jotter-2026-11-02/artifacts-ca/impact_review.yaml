    impact_description: 'Victim: the end user whose account is named, and - through
      the account that administers the system - the application and its whole persisted
      state. Damaged properties: confidentiality, high, and integrity, high. The caller
      holds the account: its credential is now a value the caller knows, the account''s
      own personal data, its role-bound reach and, for the administrator, the complete
