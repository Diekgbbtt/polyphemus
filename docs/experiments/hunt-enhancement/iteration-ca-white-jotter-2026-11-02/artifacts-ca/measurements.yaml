  - id: IA-1
    key: Service:navigation-menu::IA-1
    unit: Service:navigation-menu
    disposition: threat
    capability: Keep receiving and rendering the back-office navigation a role confers after that role has been administratively
      disabled.
    impact_description: 'Victim: the application''s authorization state and the entitlement boundary of the account whose
      role was withdrawn. Damaged properties: integrity, low - the operator''s disable is written to the role record and the
      console reports it, but the derivation that decides the caller''s function set never reads it, so a revocation control
      silently does nothing on this decision; and confidentiality, low - the withdrawn role''s screen and route inventory
      stays disclosed and rendered to its holders, who keep the back-office client''s entries and therefore the function surface
      that role named. Bounded because the tree is navigation metadata rather than data: what sits behind those routes is
      a separate authorization decision owned by the controller units, and the grant dimension of this same derivation is
      honoured immediately.'
    exploitability_description: 'No special position and no further capability: the caller holds an account that was granted
      the role - a basic authenticated role - and the failing action is the operator''s own routine disable. The caller does
      nothing but load the console; there is no defence to circumnavigate, no second phase, and no victim interaction beyond
      the operator''s standard revocation. The window is not bounded by the session either, since the derivation is evaluated
      per request and the disable simply never reaches it.'
