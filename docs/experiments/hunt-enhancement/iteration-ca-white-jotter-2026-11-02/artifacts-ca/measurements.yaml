  - id: IA-1
    key: AuthorizationSystem::IA-1
    unit: AuthorizationSystem
    disposition: precursor
    capability: Execute any function the guard admits while holding no permission for it, and make an operator's permission
      grants and revocations inert on every request outcome.
    impact_description: 'No end damage is claimed by this row. The missing check damages nothing by itself: the resources
      the permission model names are answered empty at the edge on their canonical spelling, so a caller who lacks a permission
      and a caller who holds it receive the same nothing on the surface the model describes. The only way the absent check
      becomes data access is through the spelling primitive that reaches those handlers with no principal at all, and that
      reach - confidentiality of the account roster and the RBAC model, integrity of the account store through the same handlers
      - is measured and scored by ReverseProxy''s two threats. What this row records is the capability that makes that reach
      total rather than bounded: there is no function-level backstop, so every administrative revocation the operator can
      perform on a permission has no effect on any request outcome, and the model''s two halves may diverge without any component
      noticing.'
    exploitability_description: 'Nothing to exploit on its own: the row is a property of the pipeline, established by measurement
      rather than by a request. Three observations fix it - the permission-named resources answer a permission-less caller,
      the one guarded route admits a permission-less session and a fully permitted one identically, and the served client
      has neither a permission branch nor a denial rendering. Closing the gap needs one further capability, the spelling primitive
      that reaches a handler without passing the guard, which another unit holds and has scored; this row deliberately stops
      short of it.'
    factors:
      attack_vector: network
      attack_complexity: low
