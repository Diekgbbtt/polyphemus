  - id: IA-1
    key: ReverseProxy::IA-1
    unit: ReverseProxy
    disposition: threat
    capability: Read the entire account roster with personal data and role grants, and the full role-permission-menu model,
      without an identity.
    impact_description: 'Victim: the end users of the application (their account records) and the application''s persisted
      authorization data. Damaged property: confidentiality, high. One anonymous request returns the complete account roster
      with username, real name, telephone number, electronic-mail address, enabled state and granted roles for every account
      (including the administrator), plus the complete role model: which role carries which permission, the permission catalogue
      with its target URLs, and the menu catalogue each role may reach. No redaction is applied and no field requires a higher
      entitlement.'
    exploitability_description: 'The chain is one request with no account, no cookie and no victim participation. The caller
      sends a back-office path whose spelling injects a literal '';'' path parameter into a filler segment (''/api/x/..;/admin/user''):
      the edge decodes and dot-resolves the path for its own classification but forwards the raw target, so the request is
      treated as an ordinary /api call and not as the /api/admin namespace; the authorisation filter matches its patterns
      against the same un-stripped path and finds no rule; the servlet container then strips the path parameter, resolves
      the dot segment and dispatches to the real admin controller, which executes with no principal. No defence must be iterated:
      the spelling worked on the first attempt, and the remaining admin reads (role, permission and menu catalogues) use the
      same shape. Human participation: none.'
    factors:
