  - id: IA-1
    key: IntegrationSystem:cross-origin-policy::IA-1
    unit: IntegrationSystem:cross-origin-policy
    disposition: precursor
    capability: Be an authorised origin for the application's whole API - credentials allowed and every verb preflight-approved
      - without controlling the application's own origin.
    impact_description: 'No end damage is claimed by this row. The grant is real - one origin outside the application''s control
      may read the API and preflight every verb, with credentials allowed by policy - but the only data it can actually read
      is data it can read without the grant. The credentialed half never arrives: the identity cookie sets no SameSite attribute,
      so browsers apply Lax and omit it from a cross-site fetch, which makes every authorised-origin read anonymous. What
      remains anonymous is the public catalogue and article surface by design, plus the roster and role model that the parameterised
      spelling reaches with no cookie at all - and that reach is ReverseProxy''s measured damage, not a second one: a page
      at the authorised origin gains no access the attacker does not already have from a raw client. No victim''s confidentiality,
      integrity or availability is reached through this entry today.'
    exploitability_description: 'Exercising the grant costs no privilege and no victim interaction from the application''s
      side: any page served from http://localhost:8080 in a victim''s browser is authorised automatically, and the preflight
      approves every verb, so the chain needs nothing from the victim beyond loading that page. The missing pieces are on
      the other side of the chain, not in the policy. First, the page has to exist on the victim''s loopback port, which is
      a precondition outside the target''s own surface. Second, a credentialed read would need the session cookie to travel,
      which the browser''s Lax default prevents. Third, the data reachable anonymously is public or already available through
      ReverseProxy''s spelling bypass. That is why this row stops at the capability: the policy authorises the right origin-and-verb
      combination and is missing only a victim-side delivery and a credential-scope change to become a cross-origin data read.'
    factors:
      attack_vector: network
      attack_complexity: low
