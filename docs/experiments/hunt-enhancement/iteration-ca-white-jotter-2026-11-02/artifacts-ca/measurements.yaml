  - id: IA-2
    key: Service:register::IA-2
    unit: Service:register
    disposition: threat
    capability: Place an account whose name is visually identical to an existing account's, so a routine name-addressed administrative
      action can be aimed at the lookalike.
    impact_description: 'Victim: the end user whose account an operator intends to administer, and the application''s account
      and authorization store. Damaged property: integrity, low - the administration surface is addressed by account name,
      and a name submitted with a leading space produces a second, distinct principal that is indistinguishable from the original
      in every rendering the operator is given, so a routine disable, credential reset or role grant performed on the visible
      name can land on the lookalike instead of the intended account. The boundary between the two identities exists only
      inside the store''s collation: the response, the principal and the roster row all look the same, which is why the operator''s
      ordinary flow - not an exotic one - is what completes the damage. Confidentiality is not claimed: neither account''s
      records are disclosed by the ambiguity itself.'
    exploitability_description: 'One anonymous registration with a single leading space, no credential and no second phase;
      nothing has to be beaten because the service never normalises or constrains the name it stores as the identity key.
      The remaining step is passive: an operator performing their ordinary roster work on the name they can see, at which
      point the collation - invisible in every surface the operator has - decides which row moves. That the observed writes
      did hit only the lookalike is a property of the collation, not of any control in this service, which is precisely why
      the ambiguity is the damage.'
    factors:
      attack_vector: network
      attack_complexity: low
