  - id: IA-1
    key: AuthenticationMechanism::IA-1
    unit: AuthenticationMechanism
    disposition: precursor
    capability: Hold a three-day server-issued opaque credential for every account that ever authenticates, minted whether
      or not its owner wants it, and presented on every request of that browser.
    impact_description: 'No end damage is claimed by this row. The persistent token admits nothing on its own - a caller presenting
      only it is refused by both the state reporter and the guarded route, before and after sign-out - so possession of the
      value grants no access and there is no victim whose data or authority it reaches. The three chains that would turn a
      persistent credential into damage are all absent here: no script in the origin can read it (HttpOnly), no network position
      is in scope, and a cross-site delivery buys nothing because the token does not authenticate. What the row records is
      exposure breadth for a chain another unit owns: a 536-character bearer ciphertext is minted for every account that ever
      signs in, lives three days, is re-minted on every login and cannot be observably revoked, and is decrypted and deserialised
      back into a principal on every request - the sink Service:sign-in measured, whose only gap is key custody.'
    exploitability_description: 'Obtaining the token is the ordinary act of signing in: any caller who holds an account''s
      credential receives one whether or not they ask, so the primitive costs a valid credential and nothing else (low privilege,
      no interaction, no defence to beat). What it does not do is anything with it. Turning it into an end damage requires
      a further capability this surface does not provide - either a key-custody break at the deserialisation sink or a channel
      that lifts the token out of an HttpOnly cookie - which is why the row stops here and names the sink''s owner instead
      of claiming a chain.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: low
