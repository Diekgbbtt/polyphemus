  - id: IA-2
    key: ReverseProxy::IA-2
    unit: ReverseProxy
    disposition: threat
    capability: Modify any account's attributes, enabled state and role grants without an identity, including granting an
      administrative role to an account the attacker controls.
    impact_description: 'Victim: the application''s persisted authorization and account data, and every end user whose account
      is a target. Damaged property: integrity, high (confidentiality, low - the write responses confirm the affected account
      name and message). The same bypass reaches the mutating back-office handlers: an account''s personal attributes, its
      enabled state and its role grants can be rewritten by an anonymous caller. Granting the sysAdmin role to an account
      the attacker controls, or disabling the accounts that defend the catalogue, is a durable change that survives the request
      and cannot be attributed to any principal.'
    exploitability_description: One request, unauthenticated. The capability of IA-1 (P-1) is used to read the roster and
      the role identifiers; the same '/api/x/..;/admin/...' spelling then carries a PUT to the account-update and account-status
      handlers, which reply with the application's success envelope. The request bodies observed in the client bundle name
      the fields (username, name, phone, email, roles[]; enabled, username), so no further capability is needed to target
      an arbitrary account. No victim action and no human participation are required; the only additional phase beyond IA-1
      is choosing the target from the roster already read.
