  - id: IA-1
    key: IdentificationSystem::IA-1
    unit: IdentificationSystem
    disposition: precursor
    capability: 'Hold an identifier''s authority with no bound: nothing but the holder''s own logout can end it, and no idle,
      inactivity, absolute-lifetime or account-state event ever does.'
    impact_description: 'No end damage is claimed by this row. Holding an identifier without a lifetime bound damages nobody
      on its own: the copy that exists is the holder''s own, the service publishes the second representation only into the
      holder''s own address bar and history, and the cross-origin channels that would carry a copy to a third party (a framed
      console, a cross-origin Referer) are closed by browser defaults rather than by the application. What the row records
      is the capability''s shape: this plane has no window that closes by itself, so any future primitive that exposes an
      identifier - a delivery, a log, a shared URL, a theft - is amplified from a bounded incident into permanent authority.
      The damage such a chain would reach (an end user''s account confidentiality and integrity) belongs to whichever unit
      finds the exposure, and the rotation half of the composition is already scored by Service:sign-in.'
    exploitability_description: 'No request achieves this: it is a property of the plane, measured by comparing an identifier''s
      state across a long sequence of requests (still 200 with no challenge, no reissue, no re-authentication) against the
      two controls that show the store and the logout path are healthy (a fresh identifier is terminated durably by the logout
      path, and an identifier logged out earlier still answers 302). The gap is the missing exposure step, which this surface
      does not provide; the capability is complete and waits for one.'
