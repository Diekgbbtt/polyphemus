  - id: IA-2
    key: IdentificationSystem::IA-2
    unit: IdentificationSystem
    disposition: threat
    capability: End another principal's authenticated session with a single top-level cross-site navigation, repeatably, at
      any moment they are signed in.
    impact_description: 'Victim: a signed-in end user, and through them the availability of the session they are working in.
      Damaged property: availability, low - a third-party page or redirect can terminate the victim''s authenticated session
      without the victim doing anything but visiting it, so the session ends, in-progress work is lost and the user is forced
      to re-authenticate; the same mechanism can be repeated whenever they sign in. The damage stops there by construction:
      the transition only destroys the identifier, it does not disclose or alter anything the identifier reaches, and every
      other state change on this surface requires a JSON body on a non-GET method that a cross-site simple request cannot
      produce, so no write of the back office is reachable this way.'
    exploitability_description: 'One link or one redirect on an attacker-controlled page, followed by the victim as a top-level
      navigation: the browser attaches the identity cookie because no SameSite attribute is set and the Lax default still
      covers top-level GETs, the route is unguarded so no second check applies, there is no token to match anywhere on the
      surface, and the response is a bare status that needs no rendering. Nothing has to be circumnavigated and no second
      phase is needed; the only cost is the victim''s visit, which is why the interaction is active rather than passive.'
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
      user_interaction: active
      confidentiality: none
      integrity: none
      availability: low
