  - id: IA-1
    key: Service:register::IA-1
    unit: Service:register
    disposition: threat
    capability: Make the registration path commit more accounts for one name than its own lookups can resolve, and cost the
      operator the account roster.
    impact_description: 'Victim: the application - specifically its account-administration plane and the account store behind
      it. Damaged properties: availability, low - the administrative account roster, the only surface that enumerates accounts,
      answers the generic error envelope to every request and stayed that way for the whole observation window, while the
      role catalogue, credential verification, registration and the keyed account writes all kept working, so the loss is
      the operator''s ability to see and account for the roster rather than the service itself; and integrity, low - the store
      is left holding an identity that its own uniqueness lookup calls free and its own credential lookup calls absent, so
      the account data no longer reconciles with the service''s view of it. No end user''s data is disclosed by this and no
      credential is exposed; the damage is to the administrative plane''s integrity and observability, which is what an auditor
      or an operator relies on.'
    exploitability_description: 'One anonymous caller, no account, no victim and no interaction: a handful of identical registration
      bodies submitted inside the same commit window all receive the success envelope, because the uniqueness verdict is taken
      in a read that nothing re-establishes at insert time. There is no defence to circumnavigate and no second phase - the
      same request the service offers to every visitor is the whole attack, and the durable consequence is confirmed indirectly
      because the surface that would show the row set is the surface that stopped answering (a re-submission is rejected by
      a store constraint while the lookup reports the name free, and credential verification reports no such account).'
    factors:
