  - id: IA-1
    key: RESTApi:api::IA-1
    unit: RESTApi:api
    disposition: threat
    capability: Read rows from the API's own database through the catalogue search - any predicate of the caller's choosing,
      and caller-authored rows via a UNION over the eight-column projection - without an identity.
    impact_description: 'Victim: the application''s persisted data, held in the same database the API queries - the account
      records the roster endpoint exposes (username, real name, telephone, e-mail, password hash, enabled state, role bindings),
      the unpublished article and book rows behind the administrative routes, and the role/permission model. Damaged property:
      confidentiality, high. The caller controls the predicate of an anonymous statement and can append its own result set
      to an eight-column projection that the API renders back as JSON fields, so the read is not limited to rows the search
      was meant to match and not limited to the catalogue table.'
    exploitability_description: 'One anonymous GET per query: no account, no session, no victim action, no second phase. The
      statement shape is already mapped (quote to confirm the literal, comment to truncate the mapper''s LIKE wrapper, ORDER
      BY to fix the arity at eight, UNION to align types), so extraction is a matter of placing the target columns into the
      rendered positions. I verified the sink and the projection using only caller-authored literals and deliberately extracted
      no foreign row; the payload belongs to the hunter. The neighbouring credential query was probed as a negative control
      and is bound, which localises the defect to the search mapper rather than the layer as a whole.'
    factors:
