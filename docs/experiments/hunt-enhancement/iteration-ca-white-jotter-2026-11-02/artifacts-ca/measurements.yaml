  - id: IA-3
    key: ReverseProxy::IA-3
    unit: ReverseProxy
    disposition: precursor
    capability: Make a privileged namespace answer uniformly empty so its existence, its guard coverage and its true state
      cannot be read from canonical traffic.
    impact_description: 'No end damage follows from this row. The short-circuit returns no data, changes no state and never
      establishes an identity, so there is no victim and no damaged property; its owner learns nothing from it. It is the
      masking half of the chain scored in IA-1 and IA-2: because the canonical spelling always answers an empty 200, the namespace''s
      live state and the real coverage of the guard cannot be measured from it, and the true state is only visible through
      a different spelling. The capability is recorded so a later unit can reference it.'
    exploitability_description: A single unauthenticated request to the canonical namespace, for any method, with or without
      a session - the answer does not depend on identity. There is no chain to assemble and no human participation; the row
      exists to name the observable '<em>namespace answers empty</em>' capability that the read and write rows in this unit
      must be distinguished from.
    factors:
      attack_vector: network
      attack_complexity: low
      attack_requirements: none
      privileges_required: none
