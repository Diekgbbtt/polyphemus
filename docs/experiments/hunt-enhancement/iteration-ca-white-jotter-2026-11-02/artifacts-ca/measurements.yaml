  - id: IA-1
    key: Service:user-administration::IA-1
    unit: Service:user-administration
    disposition: threat
    capability: Become any account the caller can name - its credential, a fresh session under its principal, and every action
      attributed to it - by resetting the credential to the published default and signing in.
    impact_description: 'Victim: the end user whose account is named, and - through the account that administers the system
      - the application and its whole persisted state. Damaged properties: confidentiality, high, and integrity, high. The
      caller holds the account: its credential is now a value the caller knows, the account''s own personal data, its role-bound
      reach and, for the administrator, the complete back-office surface are readable under the victim''s principal, and every
      write the caller performs is attributed to the victim. The credential is replaced, so the owner''s access is destroyed
      along with it - that lockout is the same replacement seen from the other side and is not counted a second time as availability
      loss. Integrity is high rather than low because the change is to the account''s identity itself, not to one of its fields:
      the victim cannot undo it, an operator''s roster is the only place it is visible, and that roster has answered the generic
      error envelope since the registration unit''s fault.'
    exploitability_description: 'Two requests. The reach is ReverseProxy''s measured namespace reach - the parameterised spelling
      that answers an anonymous caller and whose canonical twin is terminated at 200/0 B - so the reset handler is treated
      as already reachable, not as a new primitive this row needs. One write names the account and answers 重置密码成功; the console
      prints the value it wrote, so the attacker does not have to derive it. One login with that value returns 200 as the
      named account. No account, no credential, no token, no ownership claim and no victim action are needed; the victim does
      not have to be present, and because the reset leaves the account''s earlier session answering, the takeover is silent
      to its owner until their next sign-in is refused. The one capability the chain needs beyond the reach is knowing the
      default, and that is published in the client rather than obtained - so it adds no phase. Measured on one reader account;
      the handler''s only input is the account name, which is what carries the same two requests to any other name on the
      store. Enumeration is not a precondition: names are user-chosen, the login route answers membership per name (Service:sign-in
      threat-1), and the registration route answers it without a credential - the roster read would have been the convenient
      source and it is currently broken, which removes a gift rather than a step.'
