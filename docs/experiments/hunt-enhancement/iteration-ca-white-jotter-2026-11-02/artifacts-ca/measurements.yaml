  - id: IA-2
    key: RESTApi:api::IA-2
    unit: RESTApi:api
    disposition: threat
    capability: Create an account whose persisted role association the caller chooses, so the caller's own principal becomes
      administratively privileged with no privileged action.
    impact_description: 'Victim: the application''s persisted authorization data and, through it, every account and catalogue
      record the granted role reaches. Damaged property: integrity, high - a durable administrative role binding is written
      into the authorization store by an unauthenticated self-registration, indistinguishable from an administrator''s grant
      on every later read. Confidentiality, low as measured: the account''s derived authority is directly visible (the full
      back-office navigation tree renders for it), while reading the records behind those functions needs the separate routing
      primitive that ReverseProxy already filed.'
    exploitability_description: 'Two anonymous requests and one login: register with the nested role array, then sign in as
      the new account. No account is needed beforehand, no victim acts, no defence must be iterated, and the escalation is
      not a race - it is a persisted association that survives every later session. Measured entirely on an account I created
      for the purpose and returned to a role-less state afterwards; the restore needed the same role-update write the back
      office uses, which the escalated account itself was permitted to perform.'
