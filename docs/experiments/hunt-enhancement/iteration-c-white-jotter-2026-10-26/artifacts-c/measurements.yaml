workflow:
  modeller:
    order: >-
      Observed sequence per unit: technical_sharpening, prior_art, trust_modelled, assumptions,
      vulnerabilities, wellformedness, impact_assessed, completed. The live prompt defines seven
      states; PLAN.md still lists five. All 23 unit models reached COMPLETED with validation valid
      and no referential errors. Five units had a first COMPLETED write rejected by the validation
      gate and then corrected it (WebPresentation:library-catalog, WebPresentation:register,
      Service:book-management, Service:role-permission-administration,
      Service:operations-telemetry); four of those are the same interface_agreement_refs IA-only
      mistake with a DF or CF reference.
    defects:
      - 7 threat-bearing units have no vulnerabilities phase note (Service:register, Service:operations-telemetry, Service:article-management, Service:role-permission-administration, Service:user-administration, IntegrationSystem:cross-origin-policy, WebPresentation:article-management::console-pages)
      - 8 units have no assumptions phase note
      - ReverseProxy has two wellformedness notes for one unit (repeated gate)
      - '5 units needed a validation round trip; 4 share the same interface_agreement_refs IA-only mistake (a DF or CF reference in an IA field)'
      - 'Service:media-asset-serving closed COMPLETED with zero threats on an inferred route absence'
    score: 0.88
  hunter:
    order: >-
      Observed sequence per dispatch: grounding, slice, collect, discriminate, well_formedness, then
      specs (generate) and verify-claims probe trails. 16 dispatch directories exist; 13 have a
      terminal.yaml; the three RESTApi-actuator-management dispatches stop after discriminate with
      no terminal. Only 4 to 5 of the 8 named states have a phase summary note.
    defects:
      - 3 actuator dispatches left 13 specs at status hypothesised with no terminal.yaml
      - 12 produced threats were never dispatched (including Service:article-management and Service:media-asset-serving)
      - only 5 of 14 threat-bearing units ever reached a hunt key
      - 15 of 16 dispatches have a grounding phase note; RESTApi-api__threat-2 has none
      - 'provenance.threat_id is the bare threat id (threat-1), not the composite dispatch id'
    score: 0.75
  pod:
    order: >-
      Runner then triager within one pod session. 12 of 55 exports reach a triager verdict
      (symptom-confirmed); 41 are finalized by the 3600 s watchdog with no interpretation; one ends
      no-symptom-evidence; one ends space-exhausted. The pod triager made 44 calls for 55 pods.
    defects:
      - 41 of 55 exports are pod-watchdog-timeout; 38 of 55 carry no interpretation
      - 1 triager crash (dict object has no attribute model_dump) turned a confirmed symptom into unsuccessful
      - 2 successful pods are clean=false because a KB query degraded
      - only 2 of 55 pods wrote a note in test-executor-pod/notes.yaml
    score: 0.72
  tool_contract:
    violations: 1
    notes: >-
      One hunts_store query was rejected for using a bare canonical_class path (the recorded correct
      form is kind-scoped), and the modeller corrected it. Separately, 36 of 936 pod raw observations
      carry a tool failure: 13 UnicodeDecodeError from execute_command on non-UTF-8 responses, two
      missing xxd, two missing jq, and several shell-quoting errors. No call outside the bound tool
      surface was observed in the sampled traces.
    evidence:
      - eval/instances/data/eval-server-1/8e2e5dc7-a880-4451-aaa5-267cedd48264/hunting/threat_modeller/notes.yaml (ReverseProxy:prior_art)
      - eval/instances/data/eval-server-1/8e2e5dc7-a880-4451-aaa5-267cedd48264/hunting/test-executor-pod (raw_observations across 55 exports)
  prompt:
    defects:
      - 'PLAN.md Criterion 5 lists five modeller states; the live prompt and the notes implement seven (PRIOR_ART and IMPACT_ASSESSED added, plus a well-formedness retrospective)'
      - 'the modeller input observed in Langfuse is truncated at 261305 characters (370714 bytes omitted), so a full prompt-section audit is impossible from the trace'
    notes: >-
      The visible modeller prompt is current vocabulary: unit threat model, trust model, seven
      states, no fault-hypothesis or hunt-config terms. The pod runner prompt is the actor-critic
      contract. No duplicated section was observed; the apparent repeats are the same grounding
      block repeated across turns in one conversation input.
    evidence:
      - Langfuse v2 observation generation input, 2026-10-26T20:39:51Z (trace captured in /tmp/lf_gen_sample.json during measurement)
      - docs/experiments/unit-threat-model-eval-2026-10-20/PLAN.md lines 180-183
  bound_tools:
    defects: []
    notes: >-
      The modeller used exec, hunts_store, load_skill and graph_view; the hunter used skill and KB
      queries; the pod used execute_command, exec, graph_view and history reads. No unbound tool call
      was found, but Langfuse coverage was a bounded sample, so this is "no evidence of violation",
      not proof.
  structured_output:
    defects:
      - 'pod triager: 1 crash, dict object has no attribute model_dump (bfla-alternate-path__permission-map__empty-segment-inside-namespace__get-read)'
      - 'modeller: 5 first COMPLETED writes failed validation and needed a round trip; 4 are the same IA-only reference mistake'
      - '9 CHAIN model/LangGraph ERROR observations at 07:45-07:48 with output=None on the actuator hunter subgraphs'
      - '2 generation SPAN ReadTimeout observations (06:54:45Z, 07:01:29Z)'
    notes: >-
      The parsing-recovery middleware recorded a DEFAULT status on every sampled model turn, so
      there is no evidence of a schema-bound structured-output failure outside the one triager
      crash and the modeller's repeated interface_agreement_refs mistake. The late ERROR chains
      coincide with the project stop at 07:48:56Z and left the three actuator hunts without a
      terminal.
  coupling:
    defects:
      - 'the spec carries provenance.threat_id as a bare id; the composite dispatch key exists only in the directory path'
    notes: >-
      Coupling otherwise holds: all 55 pod spec_dir values resolve to a spec file stem (the only
      extra entry is test-executor-pod/notes.yaml), 69 of 69 specs have target_identity.unit_id equal
      to provenance.unit_id, and each dispatch directory name is <unit>__threat-N.
  schemas:
    artifact_defects:
      - 'threat model writes threat-N.yaml; measure_utm reads loop-*.yaml, so metrics reports loops_total 0 for 28 existing threat files'
      - 'specs write the seven-field procedure at skill_concretised_procedure; measure_utm reads provenance.skill_procedure, so it reports procedure_fields 0 for 68 populated specs'
      - 'test-executor-pod/notes.yaml holds 2 notes for 55 pods'
      - 'trial.yaml notes is empty although the terminal came from a risk-threshold halt'
      - 'hunter notes: phase summaries exist for 4 or 5 of the 8 named states; 13 of 16 dispatches have well-formedness'
      - 'modeller notes: 7 threat-bearing units lack a vulnerabilities note, 8 units lack an assumptions note, ReverseProxy has a duplicate wellformedness note'
    lesson_defects:
      - 'no skill-usage lesson records were found in the data root (SKILL_EVOLUTION_ENABLED=0 in the instance env, so none were expected for this arm)'
    notes: >-
      No retired D4 field (testing_pattern, payload_vector_space, interpretation_guidance) appears
      in any of the 69 specs. Spec status distribution is 55 ratified, 13 hypothesised, 1 dropped.
  memory:
    defects:
      - 'no episodic memory write artifact was found under the instance data root'
    notes: >-
      Memory may be persisted in the project store or database rather than the host data root, so
      absence here is not proof the phase did not run.
  adherence_score: 0.78
