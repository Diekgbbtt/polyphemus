  closest_issue: null
  proposed_issue:
    title: "Make a shipped default credential a mandatory fault on the sign-in unit (admin/123 at /api/login)"
    body: |-
      ## Observed
      In trial white-jotter-1-20261027T074905-1618c524 (project 8e2e5dc7-a880-4451-aaa5-267cedd48264) Service:sign-in bound four faults to the login acceptor (no session regeneration, username enumeration, no throttling/lockout, identifier-scoped logout) and explicitly deferred "default-credential state (belongs to weak-credential-discovery)" in its wellformedness note without ever loading that class. It registered a throwaway account to reach the success path.

      The suite ships `skills/web-vulnerability-testing/weak-credential-discovery/default-credential-replay`, which mandates a default-pair submission on every authentication acceptor. The operator bootstrap `auth/credentials.yaml` holds admin/123 with the note that it is the shipped database seed, so the GT credential is the pipeline's own working material.

      A ReverseProxy spec (`session-management__login-body__at-auth`) submitted admin/123 as its prepared account and its experiment log records HTTP 200 {"code":200,"message":"成功","result":"admin"} with a fresh JSESSIONID, repeated, plus a wrong-password control. The spec and the pod triager were scoped to cleartext carriage (F-5), so the successful default-pair login was never harvested.

      ## Impact
      white-jotter-001 is the cheapest finding on the target: one submission of admin/123 returns a sysAdmin session. The pipeline authenticated it repeatedly and still scored the GT vuln partial, and no spec or threat was ever scoped to weak/default credentials.

      ## Proposed direction
      1. When a public or seeded credential is recorded for the target (including the operator auth bootstrap), require the sign-in unit to emit a weak-credential-discovery / default-credential-replay fault, not a note that defers the gap.
      2. Forbid closing the sign-in unit while a deferred gap names a class that was never loaded.
      3. In any spec that uses a stored default pair as its prepared account, add "default pair accepted" to the verification symptoms and promote a successful submission to a finding rather than leaving it as transport corroboration.
      4. Record on the unit model that the auth-bootstrap credential equals the GT candidate, so it is not silently treated as legitimate material.
    labels: [bug, needs-triage]
  eval_sha: 13ce0edb1a44a1ce99f60841812cdb56a824262d
