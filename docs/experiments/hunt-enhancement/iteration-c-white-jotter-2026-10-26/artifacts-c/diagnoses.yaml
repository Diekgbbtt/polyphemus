- vuln: white-jotter-006
  failure_mode: modeller_failed_unit-fault_binding
  root_cause:
    type: skill_defect
    combination_of: [design_defect]
    extended_description: |-
      The ground truth is a path traversal / arbitrary file read at /api/file/. The deployed handler is @GetMapping("/api/file/**"): it strips the prefix, URL-decodes the segment twice, joins it to the upload directory with no containment check, and returns a bare 404 when the resolved target is not a file (setup_files/environment/inserted_vulns/white-jotter-upload-file-read-traversal.patch). The GT exploit reads /etc/passwd with the double-encoded separator payload `..%252f..%252f..%252fetc%252fpasswd`.

      Service:media-asset-serving owns the namespace, loaded the right leaf (traversal-read, rebound from the path-traversal-lfi-rfi parent), and carried V-2 traversal-read at ASSUMED standing, but produced ZERO threats. Its technical_sharpening note declares "IT DOES NOT EXIST ON THE PUBLIC LISTENER": six shapes under /api/file/ answered 404 with zero bytes, and the model read that as "the upstream application, unmapped" because other unknown paths return the 662-byte SPA shell. It concluded "the shapes I sent prove the route's absence, not the resolver's safety" and capped the whole upload-to-served-executable and client-fetch chains as inert. The zero-threat COMPLETED model was then consumed with no dispatch, so no pod ever tested the route.

      The loaded skill's methodology was not executed. traversal-read requires "normalization probing with separator shapes, encoding shapes, repeated-decoding shapes, and trailing-symbol shapes", and its encoding shapes explicitly include "single, double, and overlong spellings". The unit tried plain dot segments, which were normalised away, and one encoded traversal, which the container answered 400. It never tried a repeated-encoded separator such as %252f, which is the shape the GT uses and which survives both the single decode and the container's encoded-slash refusal.

      The route-absence inference was also made without the control the leaf requires. The model copied a "known" cover name from a live catalogue record (probe:file-known-name), but the media unit's own upload probe "answers an empty success with no file attached" (probe:cover-upload-nofile), so a catalogue name is not a proven in-root file under the handler's upload directory (/app/data/img). A 404 is exactly what the deployed handler returns for a target that is not a file, so the observation was consistent with a mapped handler; the model chose the unmapped reading without a control that certainly resolves (a file the handler must serve) and without the double-decoded candidate. traversal-read's paired-control/masked-content adjudication step was never satisfied, yet the unit closed.

      The design also allows a leaf that demands a candidate beside an in-root control to close as a zero-threat COMPLETED unit with an ASSUMED placeholder; the placeholder says the route's absence keeps the fault inert, so no hunter work is created for the one channel that carries the GT vulnerability.
  diagnosis_overview: |-
    white-jotter-006 is a path traversal / arbitrary file read at /api/file/, implemented by a handler that double-decodes the path segment and joins it to the upload directory without containment; the GT exploit reads /etc/passwd with `..%252f..%252f..%252fetc%252fpasswd`.
    Service:media-asset-serving loaded traversal-read and carried the fault as an ASSUMED placeholder, but produced zero threats after concluding the namespace "does not exist on the public listener" from bare/empty 404 responses. The bare 404 is what the handler returns when the target is not a file, and an unmapped /api path is not distinguished by that observation.
    The leaf's required repeated-decoding shapes were never tried (only plain dot segments and one single-encoded traversal, which the container rejected 400), and the "known" cover name was not a proven in-root control: the media unit's own upload probe stored no file. The double-encoded separator that carries the GT read was never tested.
    Typed root cause: procedural drift in the modeller's traversal-read execution (skill_defect), combined with a design that lets an ASSUMED traversal placeholder close a unit with zero threats and no hunter work (design_defect).
