    note: |-
      16 dispatch directories for exactly five units (RESTApi-actuator-management, RESTApi-api, ReverseProxy, Service-operations-telemetry, Service-register); no Service-article-management__threat-1 directory exists, so the threat received no spec.
  - source: data_root
