- vuln: white-jotter-003
  failure_mode: hunter_notsufficient_tests_exploration
  root_cause:
    type: design_defect
    combination_of: [implementation_defect]
    extended_description: |-
      The ground truth is stored cross-site scripting in article content: an account with article-write privilege saves articleContentHtml carrying script and the article detail page renders it as raw HTML (white-jotter-003 metadata.json and report.md; the report payload is <img src=x onerror=alert('test')>).

      This iteration did model the owning unit and bind the right fault. Service:article-management COMPLETED at 2026-10-26T22:03:23Z; V-1 is xss-stored with F-1 "rendered body persisted and emitted verbatim as executable content, with no output encoding and no runtime policy on the retrieval view", and threat-1 carries likelihood high and risk 9. The model proves the channel end to end: a supplied benign HTML fragment is stored verbatim and served unchanged to an anonymous reader of /api/article/{id}, and an anonymous POST through the alternate spelling answered 保存成功 and produced a publicly readable record. The threat's likelihood rationale explicitly hands the surviving-payload sweep, including the fact that one script shape did not persist, to the hunter.

      No test spec was ever authored. hunting/hunter/test-specs holds 16 dispatch directories for exactly five units (ReverseProxy, RESTApi-api, Service-register, RESTApi-actuator-management, Service-operations-telemetry); there is no Service-article-management__threat-1 directory and no pod for it. At the run's stop, 12 of the run's 28 produced threat files were still in produced/ (the article threat among them), 13 dispatch directories carried a terminal.yaml and the three actuator dispatches had no terminal. Service-article-management/threat-1.yaml had been sitting in the inbox for 9h45m when the run ended.

      The cause is dispatch throughput under the batched sync policy. pipeline_sync.py documents `batched` as one unit at a time in risk order, its whole hunter batch concurrently, then its pods in batches of pod_batch_size (3 here), then the next unit. The dispatched set is exactly the five highest-risk threat-bearing units (model sums 31 ReverseProxy, 28 Service:register, 24 RESTApi:api, 24 Service:operations-telemetry, 23 RESTApi:actuator-management); Service:article-management (risk 9) is eighth of the 14 threat-bearing units and was never reached. Every unit wave cost roughly two hours because the pods did not conclude: 42 of the 55 pod sessions ran to the surfer's 3600 s pod ceiling (41 PodExports carry terminal_reason pod-watchdog-timeout and the run log shows the timed-out wave pods were "finalized from [their] durable trail"), so five units were reached in 11.75 hours.

      The run was then stamped `stopped` by a project execution stop at 2026-10-27T07:48:56Z with 12 dispatchable threats pending (the trial's own budget stop did not fire: spent_tokens is 6,919,138 against 7,000,000, spend_overshoot is null, and the usage snapshot is present). The remaining 80,862 capped tokens could not have drained the inbox even without that stop, so the arm's budget and throughput were jointly insufficient for this intake.

      The failure is therefore a hunter coverage failure (the stored-XSS threat never received a spec or pod), caused by the batched design's unit-at-a-time barrier plus pod sessions that consume the watchdog, and made terminal by a premature stop that the harness treats as a successful `stopped` execution.
  diagnosis_overview: |-
    white-jotter-003 is stored XSS through articleContentHtml at /api/admin/content/article. Unlike the prior trial, this iteration modelled Service:article-management and bound xss-stored (F-1, threat-1, risk 9) with the write channel and the anonymous read proven.
    No test spec or pod was ever created for Service-article-management__threat-1: the 16 dispatch directories cover only five units, and the article threat remained in produced/ for 9h45m until the run stopped.
    The batched sync policy runs one unit at a time in risk order; the five dispatched units are exactly the five highest-risk threat-bearing units, and the article unit (risk 9) is eighth of 14. Each unit wave cost about two hours because 42 of 55 pod sessions hit the 3600 s watchdog, so only five units were reached in 11.75 hours. The run was then stopped with 12 dispatchable threats pending, with 6,919,138 of 7,000,000 capped tokens spent.
    Typed root cause: a design defect in the dispatch throughput (batched unit barrier plus a pod ceiling that most pods consume) combined with an implementation defect in pod termination (most pods do not conclude and are force-finalized by the watchdog).
  evidences:
  - source: ground_truth
    ref: /root/WebExploitBench/white-jotter/vulnerability/white-jotter-003/metadata.json
    note: |-
      Location http://wj:8443/api/admin/content/article, Vulnerability Type "Stored XSS"; report.md stores <img src=x onerror=alert('test')> in the article body and renders it as active markup on the detail page.
  - source: threat_model
