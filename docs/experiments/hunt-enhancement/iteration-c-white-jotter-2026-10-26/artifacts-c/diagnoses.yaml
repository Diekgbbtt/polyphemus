- vuln: white-jotter-001
  failure_mode: modeller_failed_unit-fault_binding
  root_cause:
    type: skill_defect
    combination_of: [design_defect]
    extended_description: |-
      The ground truth is the shipped default administrator credential: POST /api/login with admin/123 returns a sysAdmin session (white-jotter-001 metadata.json, report.md, and exploits/exploit.py).

      Service:sign-in owns the only credential-verification path, and its COMPLETED model bound four faults: no session regeneration at elevation (F-1), username enumeration through the failure messages (F-2), absent throttling/lockout (F-3), and identifier-scoped logout (F-4). None is weak-or-default credentials. The unit's own wellformedness note names the gap and then defers it: "Open gaps left honestly unproven (not assumed): ... default-credential state (belongs to weak-credential-discovery)". Its prior_art note adds the guardrail "cleartext carriage is V-5's fault and must not be re-counted as a sign-in endpoint fault". The unit registered a throwaway account (huntprobe_rsv1) to reach the success path, so the shipped seed was never submitted as a candidate.

      This is procedural drift, not missing knowledge. The suite ships skills/web-vulnerability-testing/weak-credential-discovery/default-credential-replay/SKILL.md, whose reconnaissance step is "Default-pair submission: submit vendor and framework default pairs to every authentication acceptor and read the success signal", and whose detection channel is an authentication-success signal after a default-pair submission. The class was never loaded for the sign-in unit (the unit's bound classes are session-management, username-enumeration-oracle and rate-limit-bypass).

      The design reinforces the miss: the pipeline's own auth bootstrap is the same pair. auth/credentials.yaml holds username admin, password 123, origin operator, with the note "Seed administrator from the shipped database script (username admin, password 123 per the project README)". The ground-truth credential is the pipeline's own working material, which makes it read as legitimate context rather than as a target-side fault.

      The pair was nevertheless submitted by a pod, and the pipeline failed to harvest the result. The ReverseProxy threat-6 spec session-management__login-body__at-auth used the prepared admin account ("The prepared account in the project auth store authenticates through this exact route"), and its experiment log records POST /api/login {"username":"admin","password":"123"} -> HTTP 200 {"code":200,"message":"成功","result":"admin"} with a fresh JSESSIONID and rememberMe, repeated, plus a wrong-password control that returned 密码错误. But the spec's verification symptoms are all cleartext carriage (no HSTS, no 443, no Secure attribute), and the pod triager classified the slice as session-management / F-5 cleartext credential carriage, with the note "the login response body itself is not shown". The accepted default pair was observed and never became a finding.

      The sign-in unit's four threats were also still in produced/ at the run's stop (no Service-sign-in__threat-* spec directory exists), so the unit's own work was never dispatched. That is not the cause of this GT miss, because none of the four binds the default-credential class; it is the same dispatch starvation diagnosed under white-jotter-003.
  diagnosis_overview: |-
    white-jotter-001 is the shipped default administrator credential admin/123 at POST /api/login. Service:sign-in modelled the login acceptor and bound fixation, enumeration, unbounded guessing and identifier-scoped logout, but explicitly deferred "default-credential state" to weak-credential-discovery without ever loading that class; it registered a throwaway account instead of submitting the shipped seed.
    The class existed (weak-credential-discovery/default-credential-replay mandates a default-pair submission on every acceptor), so this is class-selection and fault-binding drift, not a knowledge gap.
    A ReverseProxy pod did submit admin/123 and received code 200 result "admin" repeatedly, but its spec and triager were scoped to cleartext carriage (F-5), so the successful default-pair login was recorded as corroboration and never as a finding. The operator auth bootstrap holds the same admin/123 pair, which reinforces treating the GT credential as legitimate material.
    Typed root cause: a modeller class-selection and fault-binding defect (skill_defect), reinforced by the auth-bootstrap design that presents the ground-truth credential as legitimate material (design_defect).
  evidences:
