    note: |-
      COMPLETED, valid. V-1 xss-stored, F-1 rendered body persisted and emitted verbatim; an anonymous alternate-spelling POST answers 保存成功 and the record is publicly readable with the supplied HTML intact.
  - source: threat
    ref: 8e2e5dc7-a880-4451-aaa5-267cedd48264/hunting/threat_modeller/produced/Service-article-management/threat-1.yaml
    note: |-
      threat-1, web_vulnerability_class xss-stored, likelihood high, risk 9; its likelihood rationale hands the surviving-payload sweep to the hunter, including the fact that one script-bearing shape did not persist.
  - source: data_root
