  proposed_issue:
    title: "Traversal-read closes /api/file/ as unmapped without a repeated-decoded candidate or an in-root control"
    body: |-
      ## Observed
      In trial white-jotter-1-20261027T074905-1618c524 (project 8e2e5dc7-a880-4451-aaa5-267cedd48264) Service:media-asset-serving loaded traversal-read, carried V-2 as an ASSUMED placeholder, and produced zero threats. Its technical_sharpening note declares "IT DOES NOT EXIST ON THE PUBLIC LISTENER" from six bare/empty 404 responses under /api/file/, reading the empty body as "the upstream application, unmapped".

      The deployed handler (`setup_files/environment/inserted_vulns/white-jotter-upload-file-read-traversal.patch`) is `@GetMapping("/api/file/**")` with a double decode and `new File(uploadDir, decodedName)` with no containment check; it returns an empty 404 when the target is not a file. The GT exploit reads /etc/passwd with `..%252f..%252f..%252fetc%252fpasswd`.

      The loaded leaf requires "separator shapes, encoding shapes, repeated-decoding shapes, and trailing-symbol shapes" and single/double/overlong spellings, plus a paired in-root control. The unit tried plain dot segments (normalised away) and one single-encoded traversal (container 400); it never tried `%252f`. Its "known" cover name was not a proven in-root file: the media unit's own upload probe stored no file (probe:cover-upload-nofile).

      ## Impact
      white-jotter-006 is missed because a mapped, double-decoding traversal route was closed as an absent namespace on the strength of a 404 that the handler itself returns. The one channel that carries the GT read produced no threat, no spec and no pod.

      ## Proposed direction
      1. Treat a bare 404 under the API prefix as ambiguous: require a repeated-decoded traversal candidate and an in-root control that resolves before concluding route absence.
      2. When the mapper declares `/api/file/**` or any wildcard read route, require a `%252f` (double-encoded) separator probe as a first-class normalization shape.
      3. Enforce the leaf's paired-control requirement: a traversal-read fault may not close as a zero-threat COMPLETED unit unless the candidate/control pair was produced or the route's absence was proven by a non-404 discriminator.
      4. When a unit's only fault is an ASSUMED placeholder under a class the skill loaded, emit a hunter-dispatchable threat for the cheapest falsifying probe instead of closing with no work.
    labels: [bug, needs-triage]
