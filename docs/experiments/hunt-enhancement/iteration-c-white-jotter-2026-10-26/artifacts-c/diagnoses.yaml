    note: |-
      Probes a52f9d6b661f3ded, c083d84adbd24598 and 38e34286c28ce9bd submit {"username":"admin","password":"123"} and read HTTP 200 {"code":200,"message":"成功","result":"admin"} with JSESSIONID and rememberMe; the control with "wrong-pass-xyz" reads 密码错误. The default pair authenticates.
