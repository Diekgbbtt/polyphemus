    title: "Add a logging-sink JNDI lookup class and inventory the logging dependency on the owning units"
    body: |-
      ## Observed
      In trial white-jotter-1-20261027T074905-1618c524 (project 8e2e5dc7-a880-4451-aaa5-267cedd48264) both units that own the JNDI/Log4j2 chain were modelled: Service:register (two threats: identifier substitution and nested role write) and Service:user-administration (threat-1: credential replacement by name, risk 12). Neither binds a logging sink or a lookup evaluation, and a case-insensitive search of the entire hunting tree for JNDI, log4j or Log4Shell finds nothing.

      The suite has no class for the chain: `skills/web-vulnerability-testing/rce/SKILL.md` covers command wrappers, dynamic evaluators, native unmarshalling, media/document pipelines, fetch-reached services and container escalation, with no logging-framework lookup variant. The application declares `spring-boot-starter-log4j2` and ships `log4j2.xml`, but no unit inventories the logging framework, its version, or which caller-controlled fields reach it.

      The GT exploit registers username `${jndi:rmi://<attacker>/<name>}` at /api/register, signs in, then GET /api/admin/user; the lookup lands from the logged username and the verifier checks the shared RCE canary.

      ## Impact
      white-jotter-004 is unreachable for the modeller: there is no class to bind the username-to-log-to-lookup chain, and no inventory step that would surface the logging dependency. The unit-level faults found instead (mass assignment, credential reset) are real but do not reach the GT flow.

      ## Proposed direction
      1. Add a logging-sink / JNDI lookup variant to the suite (Log4j2 lookup evaluation, attacker-controlled log fields, callback oracle, dependency/version fingerprint).
      2. In the RCE dependency-inventory step, require the logging framework and version whenever the application declares one (spring-boot-starter-log4j2 here).
      3. Require a crafted-username probe with a callback listener at registration/login plus an unauthorized admin access, whenever a request-derived name reaches a logging framework.
      4. Record caller-controlled log fields as a data-flow edge on the owning unit models.
