    note: |-
      The trial ran 2026-10-26T20:03:33Z to 2026-10-27T07:49:05Z (11h45m) and exited with hunting stopped and the spend above; no hunting cap remains.
  closest_issue: null
  proposed_issue:
    title: "Batched hunting reaches only five of 14 threat-bearing units; the stored-XSS threat is never dispatched"
    body: |-
      ## Observed
      In trial white-jotter-1-20261027T074905-1618c524 (project 8e2e5dc7-a880-4451-aaa5-267cedd48264) Service:article-management was modelled at 2026-10-26T22:03:23Z and produced `threat-1` (xss-stored, likelihood high, risk 9). Its model proves the write channel and the anonymous read. No test spec was ever authored: `hunting/hunter/test-specs` holds 16 dispatch directories for exactly five units and no `Service-article-management__threat-1` directory, and no pod exists for it. The threat sat in `produced/` for 9h45m.

      The five dispatched units are exactly the five highest-risk threat-bearing units (31 ReverseProxy, 28 Service:register, 24 RESTApi:api, 24 Service:operations-telemetry, 23 RESTApi:actuator-management); the article unit is eighth of 14 with risk 9. The batched policy is one unit at a time in risk order, and every unit wave cost about two hours because 42 of 55 pod sessions ran to the surfer's 3600 s ceiling (41 exports are `pod-watchdog-timeout`). The run was then stamped `stopped` at 07:48:56Z with 12 dispatchable threats still in `produced/`, at 6,919,138 of 7,000,000 capped tokens.

      ## Impact
      A high-risk, fully modelled stored-XSS channel was never hunted. The run cannot be said to have explored its own inbox: five of 14 threat-bearing units were reached, and the harness scored the `stopped` terminal as a successful execution.

      ## Proposed direction
      1. Make pods conclude and write their own terminal instead of running to the 3600 s watchdog; the watchdog is meant as a last-resort backstop, not the normal path (42/55 sessions hit it).
      2. In `batched` mode, either widen the unit barrier to several units or make it budget-aware, so a two-hour unit cannot consume the whole trial and starve the inbox.
      3. Before a hunting run can settle `stopped` or `complete`, require a coverage ledger: every produced threat has a terminal spec or an explicit drop. Record the never-dispatched threats on the run row.
      4. Treat a stopped hunting terminal with dispatchable produced threats as an unsuccessful execution: resume it (the operator resume verb exists) before assessment, rather than reporting the coverage loss as a success with no diagnosis.
    labels: [bug, needs-triage]
