    web_vulnerability_class: sql-injection
    fault: "F-2: caller-controlled keyword concatenated into the SQL statement text inside a LIKE pattern"
    symptom: >-
      GET /api/search?keywords=zzz' AND '1'='1 returned code 200 with 0 rows while
      keywords=zzz' OR 1=1 -- returned code 200 with the saturated 22-row book set
