  matched:
    unit: Service:register
    web_vulnerability_class: mass-assignment-nested-relation-write
    fault: "F-2: request body bound onto the persistence object without a member allowlist, admitting the authority-bearing role set"
    symptom: >-
      POST /api/register with the five contract fields plus roles:[{"id":1}]
      returned HTTP 200 with "注册成功" and created l1tst_7f; that account then
      authenticated at POST /api/login and its /api/menu returned the administrative
      tree (User, Content and System nodes), while the control registration omitting
