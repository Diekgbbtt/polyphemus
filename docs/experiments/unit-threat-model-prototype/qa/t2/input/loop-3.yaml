technical_sharpening:
  interface_agreements:
  - id: IA-1
    statement: The SPA shell served at / injects the manager UI as same-origin ES-module scripts (paths listed by GET /api/extensions, e.g. /extensions/comfyui-manager/custom-nodes-manager.js);
      all manager code executes in the editor page origin with full access to the page API (api.fetchApi, app, DOM).
    rung: OBSERVED
    evidences:
    - GET / -> 200, 2 script tags, module import ./assets/index--PH2IHOc.js (probes.log 2026-10-15T21:31:59Z)
    - GET /api/extensions -> 200 list of 35 script paths incl. 15 comfyui-manager scripts (probes.log 2026-10-15T21:32:0xZ)
    - GET /extensions/comfyui-manager/custom-nodes-manager.js -> 200 53555B application/javascript (probes.log 2026-10-15T21:32:28Z)
  - id: IA-2
    statement: 'The manager shell requests the node-pack catalog with GET /customnode/getlist?mode=<cache|local|remote> [&skip_update=true] and
      expects JSON {channel, node_packs: {pack_id -> pack}}; the mode parameter is mandatory - its absence raises a server exception (HTTP 500
