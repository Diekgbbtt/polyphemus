    rung: OBSERVED
    evidences:
    - GET /customnode/getlist -> 500 text/plain 55B (probes.log 2026-10-15T21:33:24Z)
    - 'GET /customnode/getlist?mode=cache&skip_update=true -> 200 {channel: default, node_packs: 8487} (probes.log 2026-10-15T21:33:xxZ)'
    - JS fetch path fetchData(`/customnode/getlist?mode=${mode}${skip_update}`) in custom-nodes-manager.js (fetched asset)
  - id: IA-3
    statement: 'mode selects the catalog data source: local = local DB, channel ignored (3421 packs); cache = channel data served from a server-side
