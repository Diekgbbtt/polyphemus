trust_model:
  trust_agreements:
  - id: TA-1
    statement: 'The shell trusts every script path returned by /api/extensions as trusted code: manager extension modules run same-origin with
      full page privileges (api.fetchApi, DOM, app). No isolation or integrity boundary exists between the shell and the injected manager code.'
    rung: OBSERVED
    evidences:
    - IA-1
  - id: TA-2
    statement: 'The renderer trusts catalogue string attributes (description, title, author, version, id) as safe to place into the HTML of the
      shell: TurboGrid assigns the description string to innerHTML, and shell formatters interpolate title/author/version into markup strings.
      The data definition (display text of a remote catalogue) does not match the privilege of its use (executable markup context).'
    rung: OBSERVED
    evidences:
    - IA-7
    - IA-8
    - DF-1
  - id: TA-3
    statement: 'The client trusts the server-side transform as a complete sanitizer of presentation fields: angle brackets are escaped, then markup
      is re-introduced from markdown patterns with an unvalidated href, and the fields consumed as navigation targets (reference, repository)
      are not transformed at all.'
    rung: OBSERVED
    evidences:
    - IA-8
  - id: TA-4
    statement: 'Preference routes trust every HTTP caller as the operator: GET /manager/db_mode?value=, /manager/channel_url_list?value=, /manager/preview_method?value=,
      /manager/policy/*?value= persist state with no token, no origin check and no confirmation step. Principal privilege required is none; any
      browser user-agent and any network peer attain the mutation privilege.'
    rung: OBSERVED
    evidences:
    - GET /manager/channel_url_list?value=recent -> 200, then GET -> selected=recent (probes.log 21:39:12Z and 21:39:17Z); restored to default
      -> 200, selected=default (probes.log 21:39:40Z)
    - JS writes preferences over GET ?value= (comfyui-manager.js, fetched asset); upstream v3.37 handlers write config on ?value= (INFERRED cross-check)
  - id: TA-5
    statement: 'The notice path trusts external, third-party-composed HTML as safe to inject into the shell DOM: the server fetches a GitHub wiki
      page with TLS verification disabled and returns the extracted markdown-body HTML; the client assigns it via innerHTML on every shell initialisation.'
    rung: OBSERVED
    evidences:
    - IA-6
    - DF-4
  - id: TA-6
    statement: 'Catalogue identity is trusted without binding: the client''s getlist call carries only a db-mode, never the channel identity;
      the server resolves the channel from persisted config. The displayed channel (captured at shell init) and the source of the rendered rows
      are two independently evolving state variables with no consistency check.'
    rung: OBSERVED
    evidences:
    - getlist request has no channel parameter in JS call sites; response channel derived from server config (custom-nodes-manager.js + upstream
      source)
    - channel config writable by any HTTP principal while a shell session may already be open (TA-4 probes)
  - id: TA-7
    statement: The mode parameter is trusted to exist and to be a valid enum; the handler indexes it directly and raises on absence, and non-'local'
      values flow into channel resolution. Malformed requests reach unhandled exception paths that surface as generic 500s.
    rung: OBSERVED
    evidences:
    - GET /customnode/getlist -> 500 ('Server got itself in trouble') without mode (probes.log 21:33:24Z)
  - id: TA-8
    statement: 'Catalogue rows are trusted as the unit of decision: repository/reference URL fields are handed to anchors, pack state (installed/not-installed,
      version) is displayed from server-merged data, and the follow-up install/update actions trust the row payload. Decision-relevant attributes
      are display attributes from the same remote source (no signature, no source binding).'
    rung: OBSERVED
    evidences:
    - IA-4
    - IA-8
    - CF-6
  dynamic_state_trust:
    states:
    - id: S0
      name: SHELL_LOADED
      description: SPA boot complete, manager module scripts loaded in origin; no manager data yet
    - id: S1
      name: PREFS_READ
      description: db_mode, channel_url_list, version read; channel/db-mode combos populated; notice DOM assigned via innerHTML (external fetch)
    - id: S2
      name: CATALOG_REQUESTED
      description: operator (or any request) opens the node list; getlist(mode) in flight
    - id: S3
      name: CATALOG_FETCHING
      description: server resolves channel from config; cache read or outbound fetch of {channel}/custom-node-list.json; populate_markdown applied;
        cache written on fresh fetch
    - id: S4
      name: CATALOG_RENDERED
      description: rows built in the shell; description/title/author/version strings rendered through innerHTML; row links bound to repository/reference
    - id: S5
      name: PREFS_MUTATED
      description: server config changed via GET ?value= (channel selection, db mode, preview method, policies)
    - id: S6
      name: CACHE_HELD
      description: per-channel-URL cache file exists (~1 day TTL); served on mode=cache without freshness marker
    - id: S7
      name: NOTICE_RENDERED
      description: external wiki-derived HTML present in the shell DOM
    transitions:
    - id: T1
      from: S0
      to: S1
      action: read GET /manager/version + db_mode + channel_url_list; fetch /manager/notice; notice.innerHTML = data
      preconditions: none
      side_effects: external HTTPS fetch (github.com wiki, TLS verification disabled); DOM mutation with remote HTML
      verified_conditions: none
      trusted_conditions: notice content is benign; channel list is the operator's list
    - id: T2
      from: S1
      to: S2
      action: open manager; getlist(mode=UI combo value, skip_update unless UPDATE mode)
      preconditions: none
      side_effects: server may perform outbound fetch and git state checks when skip_update absent
      verified_conditions: none
      trusted_conditions: UI combo value corresponds to the operator's intent for this list
    - id: T3
      from: S2
      to: S3
      action: 'server resolves channel: local -> local DB; cache/remote -> config channel_url; get_data_by_mode(mode)'
      preconditions: mode parameter present (else unhandled KeyError -> 500)
      side_effects: outbound fetch, cache write
      verified_conditions: mode has one of the handled values implicitly
      trusted_conditions: config channel_url unchanged since S1; cache content equivalent to channel content
    - id: T4
      from: S3
      to: S4
      action: JSON response -> grid rows -> renderNodeContent innerHTML for description/author/version; anchors bound to repository/reference
      preconditions: HTTP 200 with parseable JSON
      side_effects: HTML parsed in shell origin
      verified_conditions: response status only
      trusted_conditions: all catalogue strings are markup-inert; URLs in link targets are safe schemes
    - id: T5
      from: S3
      to: S6
      action: fresh fetch result written to per-URL cache file (~1 day TTL)
      preconditions: cache stale/absent and fetch succeeded
      side_effects: content persists beyond the current render and beyond channel re-selection
      verified_conditions: none beyond fetch success
      trusted_conditions: fetched content remains the content later rendered
    - id: T6
      from: S1
      to: S5
      action: GET /manager/{db_mode|channel_url_list|preview_method|policy/*}?value=X -> config write
      preconditions: channel name must exist in channel dict; db_mode/policy values unvalidated
      side_effects: persistent server state change; no user-visible confirmation in the shell
      verified_conditions: channel name membership only
      trusted_conditions: the caller is the operator acting intentionally
    - id: T7
      from: S5
      to: S2
      action: next catalog open resolves the mutated preference (new channel or db mode)
      preconditions: none
      side_effects: catalogue source/datasource silently changed
      verified_conditions: none
      trusted_conditions: the UI still displays the state the operator believes is active
    - id: T8
      from: S1
      to: S7
      action: notice HTML rendered (see T1); repeat on every shell initialisation
      preconditions: server can fetch the wiki page (returns 'Unable to retrieve Notice' otherwise)
      side_effects: third-party page content in shell DOM
      verified_conditions: HTTP 200 of the wiki page and presence of the markdown-body div
      trusted_conditions: TLS transport authenticates the wiki (verification disabled); wiki content benign
    violations:
    - id: DTV-1
      transition_ref: T6
      invariant: Persistent preference changes require the authorised principal's intent (and at least a same-origin request).
      violation: Any principal - any web page the operator's browser visits, any peer on the network - can toggle the active channel and db mode
        with a single GET; no token, origin check, or confirmation exists.
      user_control_evidence: unauthenticated GET mutated channel selection and it persisted (probes 21:39:12Z/21:39:17Z); restored identically
        (21:39:35Z/21:39:40Z)
      rung: OBSERVED
    - id: DTV-2
      transition_ref: T4
      invariant: Untrusted remote data must not be treated as executable/markup content when rendered in a privileged origin.
      violation: Remote catalogue strings are parsed as HTML by design (description column, flyover, title/author formatters); the server-side
        transform escapes angle brackets but re-introduces anchors from markdown with an unvalidated href, and reference/repository are never
        transformed. Untrusted data crosses into the markup context of the shell origin without escaping at the sink.
      user_control_evidence: renderer code and column definitions (innerHTML sink); 388 packs with anchors / 253 with <BR> in the default-channel
        response prove markup live in data
      rung: OBSERVED
    - id: DTV-3
      transition_ref: T7
      invariant: A rendered catalogue's rows must correspond to the channel identity presented to the operator.
      violation: Channel identity is resolved server-side at request time; the UI channel value is captured once at init. A preference mutation
        (DTV-1) between init and catalog open changes the source of a list the UI still labels with the previous channel (state/source desync,
        TOCTOU).
      user_control_evidence: JS reads channel list and selected value once at init; getlist carries no channel identity (fetched assets); mutation
        probes prove concurrent writability
      rung: INFERRED
    - id: DTV-4
      transition_ref: T5
      invariant: Content rendered from cache must correspond to content the operator has approved/expects from the selected channel.
      violation: Cache files are keyed by URL hash only; served content carries no freshness/channel marker to the shell, and re-selecting a channel
        re-serves its cache (up to 1 day) even if the remote content changed or the last fetch was operator-unauthorised in effect (e.g. triggered
        as a side effect).
      user_control_evidence: 'after switching to ''recent'', mode=cache served 1021 recent-channel packs; after restore, mode=cache served 8489
        default packs (probes 21:39:29Z / 21:39:54Z): per-channel caches persist and are re-exposed on selection'
      rung: OBSERVED
    - id: DTV-5
      transition_ref: T1
      invariant: External content must be validated for authenticity and inertness before it enters a privileged DOM.
      violation: The notice HTML is fetched from a third-party wiki with TLS verification disabled and injected via innerHTML without sanitisation;
        the shell treats the external page as trusted presentation state on every initialisation.
      user_control_evidence: notice route returns wiki-derived HTML incl. anchors; init_notice assigns it via innerHTML; upstream handler uses
        verify_ssl=False
      rung: OBSERVED
    - id: DTV-6
      transition_ref: T3
      invariant: Request parameters must be validated before use; invalid input yields a controlled error.
      violation: Absent mode raises an unhandled KeyError surfaced as a generic 500; the parameter is indexed, not validated. Any principal can
        produce it.
      user_control_evidence: GET /customnode/getlist -> 500 (probes.log 21:33:24Z)
      rung: OBSERVED
abduction_chain:
  assumptions:
  - id: A-1
    statement: The developers assumed catalogue description text cannot become executable/active markup, i.e. that displaying it as HTML is inert
      because remote node packs only ever contain ordinary prose and links.
    induced_fault: F-1
    rung: OBSERVED
    evidences:
    - description column declares no sanitising formatter and lands in renderNodeContent innerHTML (turbogrid.esm.js + custom-nodes-manager.js,
      fetched assets)
    - 388 default-channel packs already ship anchor markup in descriptions (getlist cache file)
  fault:
    id: F-1
    name: HTML sink accepts catalogue-provided strings without escaping (innerHTML rendering of remote data as markup)
    rung: OBSERVED
    evidences:
    - 'turbogrid.esm.js renderNodeContent: t.innerHTML = e; string formatter identity'
    - 'custom-nodes-manager.js: description column without formatter; flyover $flyoverBody.innerHTML = bodyHtml; title link.innerHTML; author/version
      formatter string interpolation'
  vulnerability:
    id: V-1
    fault_ref: F-1
    class: Stored HTML/JS injection (XSS) through remote node-pack description markup
    suite_class: xss
    rung: OBSERVED
    evidences:
    - F-1 sink evidence; 388 default-channel descriptions already carry anchors, 253 carry <BR> (getlist cache files)
    - 'F-2: server transform re-introduces anchors from [a/(t)](url) with unvalidated href=''...'' (upstream v3.37)'
likelihood: medium
likelihood_rationale: Same content-control prerequisite as loop-2; the description pipeline restricts payload shapes (escaped angle brackets,
  markdown re-render) and href/hover payloads need operator interaction; 584 served descriptions already contain markup, so the rendering path
  is exercised in normal use.
confidence_degree: OBSERVED
evidences:
- description column declares no sanitising formatter and lands in renderNodeContent innerHTML (turbogrid.esm.js + custom-nodes-manager.js, fetched
  assets)
- 388 default-channel packs already ship anchor markup in descriptions (getlist cache file)
- 'turbogrid.esm.js renderNodeContent: t.innerHTML = e; string formatter identity'
- 'custom-nodes-manager.js: description column without formatter; flyover $flyoverBody.innerHTML = bodyHtml; title link.innerHTML; author/version
  formatter string interpolation'
- F-1 sink evidence; 388 default-channel descriptions already carry anchors, 253 carry <BR> (getlist cache files)
- 'F-2: server transform re-introduces anchors from [a/(t)](url) with unvalidated href=''...'' (upstream v3.37)'
