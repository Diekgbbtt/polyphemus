evidence_gaps:
  - "WebSocket progress channel not captured (no websocket-capable client in the probing toolset); event semantics and ui_id keying are inferred from halt and recovery behaviour."
  - "Load-side impact of written files (what the model loader does with substituted content) was not probed; FM3 consequence is inferred."
  - "Written content verified by byte size only; no route returns file bytes (P18/P20 -> 404), so hash-level equality is unverified."
  - "Traversal depth beyond one .. level (escaping the models root entirely) was not probed."
  - "Concurrent start/install race not probed; VUL12 and FM12 stay at rung ASSUMED."
  - "ftp:// fetch execution not verified; the gate accepted ftp (P30) but the oracle cannot observe ftp."
  - "Filenames containing path separators were not probed (F11 variant)."
  - "Server-side catalog fetch from the channel (GitHub raw) is inferred from the channel list and served JSON; the fetch itself was not observed."
  - "Duplicate ui_id internal semantics (overwrite vs merge) not directly confirmed; observed only through the counter mismatch."
  - "Repeated start on a drained queue probed only as a no-op; double-start effects on counters unprobed."
  - "Suite coverage gaps: no suite class covers denial-of-service (VUL8) or supply-chain repository substitution (VUL14); those keep null suite_class per the mapping rule."
  - "Live gate divergence from upstream tag 3.37 source (extension bypass) is disclosed; implications for other deployments were not modelled."




