  - loop_id: loop-6
    fault_ref: F-6
    vulnerability_ref: V-6
    failure_mode_refs: [FM-7]
    likelihood: medium
    likelihood_rationale: "Prerequisite flip (loop-1) is high-likelihood and the confusion window spans from flip until the next shell reload; mislabelled data drives install decisions."
    rung: INFERRED
  - loop_id: loop-7
    fault_ref: F-9
    vulnerability_ref: V-7
    failure_mode_refs: [FM-8]
    likelihood: low
    likelihood_rationale: "Amplifier: meaningful poisoning needs prior content injection (loop-2/3/5); standalone effect is stale-but-genuine content persisting up to a day without a marker."
    rung: OBSERVED
  - loop_id: loop-8
    fault_ref: F-7
    vulnerability_ref: V-8
    failure_mode_refs: [FM-9]
    likelihood: low
    likelihood_rationale: "Trivially triggerable but impact limited to unhandled-error noise; serves as an indicator of validation gaps, not a security outcome by itself."
    rung: OBSERVED
  - loop_id: loop-9
    fault_ref: F-1
    vulnerability_ref: V-9
    failure_mode_refs: [FM-10]
    likelihood: low
    likelihood_rationale: "Named-target opener retention is browser/spec dependent and requires the operator to click an injected or contributed link; kept per breadth rule with its feasibility caveat."
    rung: INFERRED
