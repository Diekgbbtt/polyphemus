  - loop_id: loop-4
    fault_ref: F-3
    vulnerability_ref: V-3
    failure_mode_refs: [FM-4]
    likelihood: medium
    likelihood_rationale: "No sanitisation at all on repository/reference, but exploitation needs record control plus an operator click on the pack title."
