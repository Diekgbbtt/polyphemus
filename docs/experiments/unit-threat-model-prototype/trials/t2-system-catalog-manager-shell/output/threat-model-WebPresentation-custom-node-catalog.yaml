  - id: A-8
    statement: >-
      The developers assumed the deployment is a localhost single-user tool (ComfyUI default posture), so
      browser-side hardening (Content-Security-Policy, X-Content-Type-Options, X-Frame-Options), CSRF
      tokens and any principal/identity model are unnecessary; no response carries them.
    induced_fault: F-8
    rung: OBSERVED
    evidences:
      - "GET / headers contain no CSP/XCTO/XFO/Set-Cookie (probes.log 21:31:59Z); no auth surface anywhere; public IP exposure http://46.224.225.245:44177"
      - "upstream exposes all routes without auth (route map)" 
  - id: A-9
    statement: >-
      The developers assumed cached channel data is equivalent to the current, operator-approved channel
