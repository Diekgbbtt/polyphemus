technical_sharpening:
  interface_agreements:
    - id: IA-1
      statement: >-
        The SPA shell served at / injects the manager UI as same-origin ES-module scripts (paths listed by
        GET /api/extensions, e.g. /extensions/comfyui-manager/custom-nodes-manager.js); all manager code
        executes in the editor page origin with full access to the page API (api.fetchApi, app, DOM).
      rung: OBSERVED
      evidences:
        - "GET / -> 200, 2 script tags, module import ./assets/index--PH2IHOc.js (probes.log 2026-10-15T21:31:59Z)"
        - "GET /api/extensions -> 200 list of 35 script paths incl. 15 comfyui-manager scripts (probes.log 2026-10-15T21:32:0xZ)"
        - "GET /extensions/comfyui-manager/custom-nodes-manager.js -> 200 53555B application/javascript (probes.log 2026-10-15T21:32:28Z)"
    - id: IA-2
      statement: >-
        The manager shell requests the node-pack catalog with GET /customnode/getlist?mode=<cache|local|remote>
        [&skip_update=true] and expects JSON {channel, node_packs: {pack_id -> pack}}; the mode parameter is
        mandatory - its absence raises a server exception (HTTP 500 text/plain "Server got itself in trouble").
      rung: OBSERVED
      evidences:
        - "GET /customnode/getlist -> 500 text/plain 55B (probes.log 2026-10-15T21:33:24Z)"
        - "GET /customnode/getlist?mode=cache&skip_update=true -> 200 {channel: default, node_packs: 8487} (probes.log 2026-10-15T21:33:xxZ)"
        - "JS fetch path fetchData(`/customnode/getlist?mode=${mode}${skip_update}`) in custom-nodes-manager.js (fetched asset)"
    - id: IA-3
      statement: >-
        mode selects the catalog data source: local = local DB, channel ignored (3421 packs); cache = channel
        data served from a server-side cache (~1-day TTL); remote = fetch the channel URL on every request.
      rung: OBSERVED
      evidences:
        - "mode=local -> 200 2.2MB 3421 packs 4.3s; mode=cache -> 8487 packs (probes.log 21:33-21:34Z)"
        - "UI select labels: 'DB: Channel (1day cache)', 'DB: Local', 'DB: Channel (remote)' (comfyui-manager.js, fetched asset)"
        - "mode=remote&channel=default -> client timeout after 8.011s with 0 bytes: the handler blocks on an outbound fetch (probes.log 2026-10-15T21:35:10Z)"
    - id: IA-4
      statement: >-
        The shell requests node-to-pack mappings with GET /customnode/getmappings?mode=...; response is a JSON
        object keyed by pack id/reference URL -> pack node data used for the node flyover and missing-node resolution.
      rung: OBSERVED
      evidences:
        - "GET /customnode/getmappings?mode=cache&skip_update=true -> 200 1.55MB object (probes.log 2026-10-15T21:35:50Z)"
        - "loadNodes() / getMissingNodesLegacy() call fetchData(`/customnode/getmappings?mode=${mode}`) (custom-nodes-manager.js, fetched asset)"
    - id: IA-5
      statement: >-
        The manager shell reads and writes manager preferences over GET-only routes: GET /manager/version
        (text), GET /manager/db_mode (text), GET /manager/channel_url_list ({selected, list: [name::URL]}),
        and mutations via ?value= on /manager/db_mode, /manager/channel_url_list, /manager/preview_method,
        /manager/policy/* with no auth token, no CSRF token, no cookie requirement.
      rung: OBSERVED
      evidences:
        - "GET /manager/version -> 200 'V3.37' (probes.log 21:32Z); GET /manager/db_mode -> 200 'cache' (probes.log 21:34Z)"
        - "GET /manager/channel_url_list -> 200 {selected: default, list: [6 name::URL entries]} (probes.log 21:33Z)"
        - "JS: api.fetchApi(`/manager/channel_url_list?value=${event.target.value}`) and `/manager/db_mode?value=${...}` on combo change (comfyui-manager.js, fetched asset)"
        - "upstream v3.37 server source: handlers write config on ?value= and return 200 (INFERRED confirmation of persistence)"
    - id: IA-6
      statement: >-
        On shell initialisation the client fetches GET /manager/notice (HTML text) and assigns it to a DOM
        node via innerHTML; the notice body is assembled server-side from a fixed external GitHub wiki page
        (fetched with TLS verification disabled) plus local version strings.
      rung: OBSERVED
      evidences:
        - "GET /manager/notice -> 200 HTML incl. news links and '<HR>ComfyUI: Unknown[-](1900-01-01)<BR>Manager: V3.37' (probes.log 21:34Z)"
        - "init_notice(): api.fetchApi('/manager/notice') then notice.innerHTML = data (comfyui-manager.js, fetched asset)"
        - "upstream v3.37 source /manager/notice: aiohttp fetch of https://github.com/ltdrdata/ltdrdata.github.io/wiki/News with verify_ssl=False (INFERRED, cross-checked by the observed 'isn't git repo' banner text)"
    - id: IA-7
      statement: >-
        Catalogue rendering is client-side: TurboGrid renders a cell by assigning the formatter result to
        node.innerHTML; its default string formatter is the identity function, and the description column
        declares no formatter, so the catalogue's description string is parsed as HTML in the manager shell.
      rung: OBSERVED
      evidences:
        - "turbogrid.esm.js renderNodeContent: t.innerHTML = e; default formatter string: return t (fetched asset)"
        - "custom-nodes-manager.js columns: {id: 'description', classMap: 'cn-pack-desc'} with no formatter (fetched asset)"
        - "custom-nodes-manager.js flyover: $flyoverBody.innerHTML = bodyHtml; node preview builds <div class=\"cn-preview-description\">${nodeItem.description}</div> (fetched asset)"
    - id: IA-8
      statement: >-
        Server-side, per-pack description/title/name pass sanitize_tag (</> to entities) and then a
        markdown-to-HTML converter that re-introduces anchors from the pattern [a/(text)](url) ->
        <a href='url' target='blank'>; reference, repository, version and the rest of the pack record are
        returned untransformed. The client then renders these strings as HTML (IA-7).
      rung: OBSERVED
      evidences:
        - "getlist JSON contains 584 of 8487 descriptions with markup: <BR>, <a href='...' target='blank'>, <B>, <font> (probes.log getlist file)"
        - "upstream v3.37 populate_markdown() + convert_markdown_to_html() apply sanitize_tag then regex substitutions, URL inserted into href unvalidated (INFERRED, matches observed markup shape)"
  control_flows:
    - id: CF-1
      statement: >-
        Page load: GET / -> SPA module boot -> GET /api/extensions -> same-origin module imports of manager
        scripts -> manager menu object created -> GET /manager/version, GET /manager/db_mode,
