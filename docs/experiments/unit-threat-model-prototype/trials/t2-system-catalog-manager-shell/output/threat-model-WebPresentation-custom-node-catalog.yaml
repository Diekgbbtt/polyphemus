trust_model:
  trust_agreements:
    - id: TA-1
      statement: >-
        The shell trusts every script path returned by /api/extensions as trusted code: manager extension
        modules run same-origin with full page privileges (api.fetchApi, DOM, app). No isolation or
        integrity boundary exists between the shell and the injected manager code.
      rung: OBSERVED
      evidences: [IA-1]
    - id: TA-2
      statement: >-
        The renderer trusts catalogue string attributes (description, title, author, version, id) as safe to
        place into the HTML of the shell: TurboGrid assigns the description string to innerHTML, and shell
        formatters interpolate title/author/version into markup strings. The data definition (display text
        of a remote catalogue) does not match the privilege of its use (executable markup context).
      rung: OBSERVED
      evidences: [IA-7, IA-8, DF-1]
    - id: TA-3
      statement: >-
        The client trusts the server-side transform as a complete sanitizer of presentation fields: angle
        brackets are escaped, then markup is re-introduced from markdown patterns with an unvalidated href,
        and the fields consumed as navigation targets (reference, repository) are not transformed at all.
      rung: OBSERVED
      evidences: [IA-8]
    - id: TA-4
      statement: >-
        Preference routes trust every HTTP caller as the operator: GET /manager/db_mode?value=,
        /manager/channel_url_list?value=, /manager/preview_method?value=, /manager/policy/*?value= persist
        state with no token, no origin check and no confirmation step. Principal privilege required is none;
        any browser user-agent and any network peer attain the mutation privilege.
      rung: OBSERVED
      evidences:
        - "GET /manager/channel_url_list?value=recent -> 200, then GET -> selected=recent (probes.log 21:39:12Z and 21:39:17Z); restored to default -> 200, selected=default (probes.log 21:39:40Z)"
        - "JS writes preferences over GET ?value= (comfyui-manager.js, fetched asset); upstream v3.37 handlers write config on ?value= (INFERRED cross-check)"
    - id: TA-5
      statement: >-
        The notice path trusts external, third-party-composed HTML as safe to inject into the shell DOM:
        the server fetches a GitHub wiki page with TLS verification disabled and returns the extracted
        markdown-body HTML; the client assigns it via innerHTML on every shell initialisation.
      rung: OBSERVED
      evidences: [IA-6, DF-4]
    - id: TA-6
      statement: >-
        Catalogue identity is trusted without binding: the client's getlist call carries only a db-mode, never
        the channel identity; the server resolves the channel from persisted config. The displayed channel
        (captured at shell init) and the source of the rendered rows are two independently evolving state
        variables with no consistency check.
      rung: OBSERVED
      evidences:
        - "getlist request has no channel parameter in JS call sites; response channel derived from server config (custom-nodes-manager.js + upstream source)"
        - "channel config writable by any HTTP principal while a shell session may already be open (TA-4 probes)"
    - id: TA-7
      statement: >-
        The mode parameter is trusted to exist and to be a valid enum; the handler indexes it directly and
        raises on absence, and non-'local' values flow into channel resolution. Malformed requests reach
        unhandled exception paths that surface as generic 500s.
      rung: OBSERVED
      evidences:
        - "GET /customnode/getlist -> 500 ('Server got itself in trouble') without mode (probes.log 21:33:24Z)"
    - id: TA-8
      statement: >-
        Catalogue rows are trusted as the unit of decision: repository/reference URL fields are handed to
        anchors, pack state (installed/not-installed, version) is displayed from server-merged data, and the
        follow-up install/update actions trust the row payload. Decision-relevant attributes are display
        attributes from the same remote source (no signature, no source binding).
      rung: OBSERVED
      evidences: [IA-4, IA-8, CF-6]
  dynamic_state_trust:
    states:
      - id: S0
        name: SHELL_LOADED
        description: "SPA boot complete, manager module scripts loaded in origin; no manager data yet"
      - id: S1
        name: PREFS_READ
        description: "db_mode, channel_url_list, version read; channel/db-mode combos populated; notice DOM assigned via innerHTML (external fetch)"
      - id: S2
        name: CATALOG_REQUESTED
        description: "operator (or any request) opens the node list; getlist(mode) in flight"
      - id: S3
        name: CATALOG_FETCHING
        description: "server resolves channel from config; cache read or outbound fetch of {channel}/custom-node-list.json; populate_markdown applied; cache written on fresh fetch"
      - id: S4
        name: CATALOG_RENDERED
        description: "rows built in the shell; description/title/author/version strings rendered through innerHTML; row links bound to repository/reference"
      - id: S5
        name: PREFS_MUTATED
        description: "server config changed via GET ?value= (channel selection, db mode, preview method, policies)"
      - id: S6
        name: CACHE_HELD
        description: "per-channel-URL cache file exists (~1 day TTL); served on mode=cache without freshness marker"
      - id: S7
        name: NOTICE_RENDERED
        description: "external wiki-derived HTML present in the shell DOM"
    transitions:
      - id: T1
        from: S0
        to: S1
        action: "read GET /manager/version + db_mode + channel_url_list; fetch /manager/notice; notice.innerHTML = data"
        preconditions: "none"
        side_effects: "external HTTPS fetch (github.com wiki, TLS verification disabled); DOM mutation with remote HTML"
        verified_conditions: "none"
        trusted_conditions: "notice content is benign; channel list is the operator's list"
      - id: T2
