    likelihood_rationale: "Same content-control prerequisite as loop-2; the description pipeline restricts payload shapes (escaped angle brackets, markdown re-render) and href/hover payloads need operator interaction; 584 served descriptions already contain markup, so the rendering path is exercised in normal use."
