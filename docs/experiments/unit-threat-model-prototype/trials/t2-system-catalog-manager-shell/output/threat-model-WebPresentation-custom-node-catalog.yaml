      - id: T3
        from: S2
        to: S3
        action: "server resolves channel: local -> local DB; cache/remote -> config channel_url; get_data_by_mode(mode)"
        preconditions: "mode parameter present (else unhandled KeyError -> 500)"
        side_effects: "outbound fetch, cache write"
        verified_conditions: "mode has one of the handled values implicitly"
        trusted_conditions: "config channel_url unchanged since S1; cache content equivalent to channel content"
      - id: T4
        from: S3
        to: S4
        action: "JSON response -> grid rows -> renderNodeContent innerHTML for description/author/version; anchors bound to repository/reference"
        preconditions: "HTTP 200 with parseable JSON"
        side_effects: "HTML parsed in shell origin"
        verified_conditions: "response status only"
        trusted_conditions: "all catalogue strings are markup-inert; URLs in link targets are safe schemes"
      - id: T5
        from: S3
        to: S6
        action: "fresh fetch result written to per-URL cache file (~1 day TTL)"
        preconditions: "cache stale/absent and fetch succeeded"
        side_effects: "content persists beyond the current render and beyond channel re-selection"
        verified_conditions: "none beyond fetch success"
        trusted_conditions: "fetched content remains the content later rendered"
      - id: T6
        from: S1
        to: S5
        action: "GET /manager/{db_mode|channel_url_list|preview_method|policy/*}?value=X -> config write"
        preconditions: "channel name must exist in channel dict; db_mode/policy values unvalidated"
        side_effects: "persistent server state change; no user-visible confirmation in the shell"
        verified_conditions: "channel name membership only"
        trusted_conditions: "the caller is the operator acting intentionally"
      - id: T7
        from: S5
        to: S2
        action: "next catalog open resolves the mutated preference (new channel or db mode)"
        preconditions: "none"
        side_effects: "catalogue source/datasource silently changed"
        verified_conditions: "none"
        trusted_conditions: "the UI still displays the state the operator believes is active"
      - id: T8
        from: S1
        to: S7
        action: "notice HTML rendered (see T1); repeat on every shell initialisation"
        preconditions: "server can fetch the wiki page (returns 'Unable to retrieve Notice' otherwise)"
        side_effects: "third-party page content in shell DOM"
        verified_conditions: "HTTP 200 of the wiki page and presence of the markdown-body div"
        trusted_conditions: "TLS transport authenticates the wiki (verification disabled); wiki content benign"
    violations:
      - id: DTV-1
        transition_ref: T6
        invariant: "Persistent preference changes require the authorised principal's intent (and at least a same-origin request)."
        violation: >-
          Any principal - any web page the operator's browser visits, any peer on the network - can toggle
          the active channel and db mode with a single GET; no token, origin check, or confirmation exists.
        user_control_evidence: "unauthenticated GET mutated channel selection and it persisted (probes 21:39:12Z/21:39:17Z); restored identically (21:39:35Z/21:39:40Z)"
        rung: OBSERVED
      - id: DTV-2
        transition_ref: T4
        invariant: "Untrusted remote data must not be treated as executable/markup content when rendered in a privileged origin."
        violation: >-
          Remote catalogue strings are parsed as HTML by design (description column, flyover, title/author
          formatters); the server-side transform escapes angle brackets but re-introduces anchors from
          markdown with an unvalidated href, and reference/repository are never transformed. Untrusted data
          crosses into the markup context of the shell origin without escaping at the sink.
        user_control_evidence: "renderer code and column definitions (innerHTML sink); 388 packs with anchors / 253 with <BR> in the default-channel response prove markup live in data"
        rung: OBSERVED
      - id: DTV-3
        transition_ref: T7
        invariant: "A rendered catalogue's rows must correspond to the channel identity presented to the operator."
        violation: >-
          Channel identity is resolved server-side at request time; the UI channel value is captured once
          at init. A preference mutation (DTV-1) between init and catalog open changes the source of a list
          the UI still labels with the previous channel (state/source desync, TOCTOU).
        user_control_evidence: "JS reads channel list and selected value once at init; getlist carries no channel identity (fetched assets); mutation probes prove concurrent writability"
        rung: INFERRED
      - id: DTV-4
        transition_ref: T5
        invariant: "Content rendered from cache must correspond to content the operator has approved/expects from the selected channel."
        violation: >-
          Cache files are keyed by URL hash only; served content carries no freshness/channel marker to the
          shell, and re-selecting a channel re-serves its cache (up to 1 day) even if the remote content
          changed or the last fetch was operator-unauthorised in effect (e.g. triggered as a side effect).
        user_control_evidence: "after switching to 'recent', mode=cache served 1021 recent-channel packs; after restore, mode=cache served 8489 default packs (probes 21:39:29Z / 21:39:54Z): per-channel caches persist and are re-exposed on selection"
        rung: OBSERVED
      - id: DTV-5
        transition_ref: T1
        invariant: "External content must be validated for authenticity and inertness before it enters a privileged DOM."
        violation: >-
          The notice HTML is fetched from a third-party wiki with TLS verification disabled and injected
          via innerHTML without sanitisation; the shell treats the external page as trusted presentation
          state on every initialisation.
        user_control_evidence: "notice route returns wiki-derived HTML incl. anchors; init_notice assigns it via innerHTML; upstream handler uses verify_ssl=False"
        rung: OBSERVED
      - id: DTV-6
        transition_ref: T3
        invariant: "Request parameters must be validated before use; invalid input yields a controlled error."
        violation: >-
          Absent mode raises an unhandled KeyError surfaced as a generic 500; the parameter is indexed, not
          validated. Any principal can produce it.
        user_control_evidence: "GET /customnode/getlist -> 500 (probes.log 21:33:24Z)"
        rung: OBSERVED
assumptions:
  - id: A-1
    statement: >-
      The developers assumed catalogue description text cannot become executable/active markup, i.e. that
      displaying it as HTML is inert because remote node packs only ever contain ordinary prose and links.
    induced_fault: F-1
    rung: OBSERVED
    evidences:
      - "description column declares no sanitising formatter and lands in renderNodeContent innerHTML (turbogrid.esm.js + custom-nodes-manager.js, fetched assets)"
      - "388 default-channel packs already ship anchor markup in descriptions (getlist cache file)"
  - id: A-2
    statement: >-
      The developers assumed their markdown-to-HTML transform is a sufficient sanitiser: escaping < and >
      was believed to make re-introduced anchors safe, so the href value needs no URL validation, and the
      pattern language cannot be abused to escape the intended structure.
    induced_fault: F-2
    rung: INFERRED
    evidences:
      - "upstream v3.37 convert_markdown_to_html: escape pass, then regex substitution inserting match.group(2) into href='...' with no scheme/quote validation"
      - "observed output shape: <a href='...' target='blank'> inside description fields (getlist cache file)"
  - id: A-3
    statement: >-
      The developers assumed the pack record's reference/repository fields always hold benign https links
      because they come from the catalogue and are used only as navigation targets; no validation is
      applied anywhere on the path from JSON to anchor href.
    induced_fault: F-3
    rung: INFERRED
    evidences:
      - "title formatter assigns link.href = rowItem.originalData.repository (custom-nodes-manager.js, fetched asset)"
      - "populate_markdown sanitises only description/name/title; reference/repository returned raw (upstream v3.37 source)"
  - id: A-4
    statement: >-
      The developers assumed every request that reaches the manager preference routes is initiated by the
      operator's own browser session, so state-changing reads (GET ?value=) need no CSRF token, no origin
      check, and no confirmation step.
    induced_fault: F-4
    rung: OBSERVED
    evidences:
      - "unauthenticated GET /manager/channel_url_list?value=recent persisted (selected=recent on next read) and GET restore worked (probes.log 21:39:12Z-21:39:40Z)"
      - "no cookie, no token, no nonce observed on any of 26 probes"
  - id: A-5
    statement: >-
      The developers assumed the wiki page fetched for the manager notice is authentically delivered and
      harmless, so disabling TLS verification for that fetch is an acceptable convenience and the returned
      HTML can be injected into the shell verbatim.
    induced_fault: F-5
    rung: OBSERVED
    evidences:
      - "upstream v3.37 /manager/notice: aiohttp TCPConnector(verify_ssl=False) fetch of github.com wiki, HTML returned unmodified"
