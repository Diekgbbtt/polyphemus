failure_modes:
  - id: FM-1
    vulnerability_ref: V-1
    runtime_failure_mode: >-
      A consumed channel serves a pack description crafted with the markdown anchor syntax carrying a
      javascript: URL or an attribute-breakout payload (' onmouseover='...); the shell renders it into the
      description cell; operator hover/click executes script in the ComfyUI origin, which can drive the
      manager install queue (arbitrary node pack -> server-side code execution), rewrite/exfiltrate
      workflows, or persist the payload by re-triggering remote refreshes.
    feasible: true
    drop_reason: null
    rung: OBSERVED
    evidences: [V-1, F-1, F-2, DTV-2]
  - id: FM-2
    vulnerability_ref: V-1
    runtime_failure_mode: >-
      Non-script variant: injected HTML (styled banners, fake notices, disguised buttons) redresses the
      manager UI; the operator interacts with attacker-controlled pseudo-UI believing it is the manager's.
    feasible: true
    drop_reason: null
    rung: INFERRED
    evidences: [V-1, F-1]
  - id: FM-3
    vulnerability_ref: V-2
    runtime_failure_mode: >-
      A consumed channel record carries markup in author or id (fields not touched by the server-side
      sanitiser); TurboGrid assigns the raw string to the cell via innerHTML; the payload executes on
      catalog render with no user interaction and gains the full manager API surface of the origin.
    feasible: true
    drop_reason: null
    rung: OBSERVED
    evidences:
      - "author formatter returns raw author; id column has no formatter; populate_markdown sanitises description/name/title only (assets + upstream source)"
  - id: FM-4
    vulnerability_ref: V-3
    runtime_failure_mode: >-
      A consumed channel record sets repository (or reference) to a javascript: URL; the title cell becomes
      an anchor with that href; clicking the pack title executes script in the shell origin.
    feasible: true
    drop_reason: null
    rung: INFERRED
    evidences:
      - "link.href = rowItem.originalData.repository; reference/repository unmodified by populate_markdown (assets + upstream source)"
  - id: FM-5
    vulnerability_ref: V-4
    runtime_failure_mode: >-
      A network-position adversary on the server's egress path (TLS verification disabled) or a compromise
      of the wiki page injects script into the notice HTML; the script executes on every manager shell
      load, before any catalogue interaction, with full origin privileges.
    feasible: true
    drop_reason: null
    rung: OBSERVED
    evidences: [V-4, F-5, DTV-5]
  - id: FM-6
    vulnerability_ref: V-5
    runtime_failure_mode: >-
      Any web page the operator visits (or any network peer) issues a cross-origin GET to
      /manager/channel_url_list?value=, /manager/db_mode?value=, /manager/preview_method?value= or
      /manager/policy/*?value=; persistent preference state changes without user intent: catalog source is
      switched to another channel (dev/unvetted or legacy), db mode forced to remote (10s+ blocking opens)
      or local (updates hidden), preview method/policies altered (e.g. component policy affects what future
      installs run).
    feasible: true
    drop_reason: null
    rung: OBSERVED
    evidences: [V-5, F-4, TA-4, DTV-1]
  - id: FM-7
    vulnerability_ref: V-6
    runtime_failure_mode: >-
      During the window between shell init and catalog open, a drive-by preference flip changes the source
      channel while the combo still displays the previous selection; rows from a different (or unvetted)
      channel render under the stale label; decisions (what to install/update) are made on mislabelled data.
    feasible: true
    drop_reason: null
    rung: INFERRED
    evidences: [V-6, F-6, DTV-3, DTV-1]
  - id: FM-8
    vulnerability_ref: V-7
    runtime_failure_mode: >-
      Content obtained during any earlier fetch of a channel (operator-initiated, side-effect fetch, or a
      compromised/misbehaving remote channel) remains in the per-URL cache for up to a day; re-selecting
      the channel re-serves it without any freshness marker; a poisoned or stale list survives channel
      switching and appears current.
    feasible: true
    drop_reason: null
    rung: OBSERVED
    evidences: [V-7, F-9, DTV-4, "per-channel cache probes 21:39:29Z/21:39:54Z"]
  - id: FM-9
    vulnerability_ref: V-8
    runtime_failure_mode: >-
      Requests omitting or malforming mode hit an unhandled exception path and yield generic 500s on
      demand; no data is disclosed by the page, but the behaviour marks unbounded error handling for
      malformed requests in general (robustness/availability noise, automation of error generation).
    feasible: true
    drop_reason: null
    rung: OBSERVED
    evidences: [V-8, F-7, "probes.log 21:33:24Z"]
  - id: FM-10
    vulnerability_ref: V-9
    runtime_failure_mode: >-
      Clicking a catalogue link rendered with the named target 'blank' opens a new browsing context that
      retains window.opener (the _blank keyword's implicit noopener does not apply to the named target per
      the HTML spec); the opened page can navigate the shell to a phishing replica of the manager.
    feasible: true
    drop_reason: null
    rung: INFERRED
    evidences: [V-9, "observed target='blank' anchor markup in catalogue descriptions"]
  - id: FM-11
    vulnerability_ref: V-10
    runtime_failure_mode: >-
      Server fetches an attacker-supplied URL via the channel-driven outbound fetch
      ({channel_url}/custom-node-list.json).
    feasible: false
    drop_reason: >-
      Dropped: no runtime path from this unit's interfaces places an attacker URL into the channel config
      (channel_url_list?value= only selects among the predefined dict; no create/update route exists);
      the URL on the wire is not attacker-controllable in the black-box position available here. Kept in
      the model for breadth; candidate for sibling units if a config for channel URLs gets a write path.
    rung: INFERRED
    evidences: [V-10, F-6, "channel_url_list probes; upstream route map: no channel URL write route"]
loops:
  - loop_id: loop-1
    fault_ref: F-4
    vulnerability_ref: V-5
    failure_mode_refs: [FM-6]
    likelihood: high
    likelihood_rationale: "Single cross-origin GET from any page the operator visits, or any network peer; no token/auth exists, persistence proven by probe; impact constrained to preference/source state but reliably achievable."
    rung: OBSERVED
  - loop_id: loop-2
    fault_ref: F-1
    vulnerability_ref: V-2
    failure_mode_refs: [FM-3]
    likelihood: medium
    likelihood_rationale: "Executes with no interaction once the record is served, but requires attacker control of consumed catalogue content (community node_db listing, compromised channel repo, or a channel the operator adds); catalogue content is community-contributed by design."
