benchmark_scope_tightness:
  confirmed_non_gt: 4
  rows:
    - spec_id: rate-limit-bypass__burst-classification__sequential__canonical
      judgement: novel
      notes: |-
        A real absent-throttle finding: 30 sequential failures with no 429/403/423, no Retry-After/RateLimit header, and a flat latency trend, while the correct credential still authenticated.
        It is outside the GT set and is the pod that also re-proved the GT default credential in its control probes.
      evidence:
        - dda347be-abea-48e4-94e5-4a4039f41858/hunting/test-executor-pod/rate-limit-bypass__burst-classification__sequential__canonical/12d15890-47b2-43c2-bbe3-14c9626a2fdb.yaml
        - dda347be-abea-48e4-94e5-4a4039f41858/hunting/test-executor-pod/rate-limit-bypass__burst-classification__sequential__canonical/experiment-log/0.yaml
    - spec_id: information-disclosure__session-id__response-cookie
      judgement: novel
      notes: |-
        A real cookie-hygiene finding: JSESSIONID is set with HttpOnly but no Secure and no SameSite over plain HTTP, and replaying the id authenticates while a garbage id 302s.
        It is outside the GT set and is low severity relative to the benchmark.
      evidence:
        - dda347be-abea-48e4-94e5-4a4039f41858/hunting/test-executor-pod/information-disclosure__session-id__response-cookie/12d15890-47b2-43c2-bbe3-14c9626a2fdb.yaml
    - spec_id: defence-bypass-parser-confusion__encoding-declaration__body-bytes__representation-split
      judgement: novel
      notes: |-
        A real parser-differential finding: a BOM-marked UTF-16LE credential body under application/json is decoded and authenticates as admin, while plain UTF-8 is the control.
        It is outside the GT set; its payload authenticates the GT default pair, so it is a different fault on the same credential.
      evidence:
        - dda347be-abea-48e4-94e5-4a4039f41858/hunting/test-executor-pod/defence-bypass-parser-confusion__encoding-declaration__body-bytes__representation-split/12d15890-47b2-43c2-bbe3-14c9626a2fdb.yaml
    - spec_id: session-management__login-boundary__preauth-anonymous
      judgement: novel
      notes: |-
        A real session-management finding: an anonymously minted JSESSIONID is retained across login and gains the authenticated principal's authority, including a 200 /api/admin/user read.
        It is outside the GT set and is distinct from the semicolon access-control bypass.
      evidence:
        - dda347be-abea-48e4-94e5-4a4039f41858/hunting/test-executor-pod/session-management__login-boundary__preauth-anonymous/12d15890-47b2-43c2-bbe3-14c9626a2fdb.yaml
