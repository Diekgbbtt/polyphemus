        - eval/data/webexploitbench/white-jotter/l1-surface.yaml
    threat_model:
      loop_candidate: false
      sharpness: 0
      direction_diversity: '11 threats / 10 loaded classes on Service:sign-in (session-management, username-enumeration-oracle, rate-limit-bypass, csrf-navigation-get, bfla-client-identity-trust, defence-bypass-encoding-differential, defence-bypass-parser-confusion, insecure-deserialization, information-disclosure, crypto-predictable-token); weak-credential-discovery is absent.'
      failure_mode_coverage: '0/1 for the GT class. The admin/123 default pair appears only as a likelihood premise in threat-1, never as a fault or a loop.'
      notes: |-
        No loop binds the expected unit to the weak/default-credential fault. The only credential fault is F-1 (missing attempt throttling), class rate-limit-bypass.
        The modeller's well-formedness note lists ten loaded classes and omits weak-credential-discovery, although the suite owns it.
        The operator auth store uses the same admin/123 pair as its bootstrap, which reinforces treating the GT credential as legitimate context.
        The deterministic loop_candidate is also false, so this row agrees with metrics, but for the record the metric is not probative here because measure_utm.py loaded zero loops (see failures).
