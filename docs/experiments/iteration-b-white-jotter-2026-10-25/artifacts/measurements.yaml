workflow:
  modeller:
    order: 'UNIT_TECHNICAL_SHARP -> TRUST_MODELLED -> TRUST_ASSUMPTIONS_WRITTEN -> VULNERABILITIES_WRITTEN -> COMPLETED. The persisted trajectory in hunting_runs.stats.trajectory shows five forward gates per unit with no skipped states, plus six lower-gate rewrites (three on Service:sign-in, three on RESTApi:api). All three models reach COMPLETED with validation.valid=true.'
    defects:
      - 'Progressive risk halt stopped after 3 of 27 intake units (risk_total 122 against threshold 110); ReverseProxy (position 6), Service:article-management (8), Service:register (9) and Service:user-administration (24) were never modelled.'
      - 'The crossing unit Service:library-catalog reached COMPLETED in produced/ but was never dispatched; its batch was never admitted.'
      - 'Service:sign-in threat-1 records the admin/123 default credential only as a likelihood premise; weak-credential-discovery was not loaded.'
      - 'RESTApi technical_sharpening closes the path-spelling family after suffix-only probes; the /api/;/admin/user form is untested.'
      - 'The persisted gate trajectory has six lower-gate rewrites (three on Service:sign-in, three on RESTApi:api); no state was skipped, but the repeated writes are a gate-order defect.'
      - 'Episodic notes are 6 for 3 units, not one per gate; RESTApi:api has no trust_mapping note and library-catalog has only wellformedness.'
    score: 0.5
  hunter:
    order: 'GROUNDING -> SLICE -> COLLECT -> DISCRIMINATE -> GENERATE -> WELL-FORMEDNESS -> VERIFY-CLAIMS -> COMPLETE. 21 hunts produce terminal.yaml; phase notes are in order: 20 grounding, 21 slice, 21 collect, 21 discriminate, 21 well_formedness; 104 spec files.'
    defects:
      - 'RESTApi-api__threat-8 has no phase:grounding note.'
      - '12 of 104 ratified specs lack verification_symptoms and assumptions; the same 12 lack the skill procedure.'
      - 'Only 10 of 21 hunts carry an explicit verify-claims note; GENERATE and COMPLETE have no phase notes (their signals are the spec and terminal writes).'
