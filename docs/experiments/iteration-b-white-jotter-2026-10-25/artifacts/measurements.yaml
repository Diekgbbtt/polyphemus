      completeness: 'No GT-class spec exists. The 62 specs mapped to this row by the deterministic script are Service:sign-in specs for other classes.'
      procedure_grounding: 'The rate-limit spec carries all 9 procedure fields (the typed seven plus payload_vector and technology_misconfiguration: recon_action, bypass_technique, advanced_technique, preliminary_chaining, payload_vector, technology_misconfiguration, technology_grounding, pro_tips, interpretation_pitfalls). It is well grounded for its own class, not for weak credentials.'
