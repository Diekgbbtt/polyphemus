  - 'The plan names /opt/polymerhus-dev/.agents/skills/langfuse/SKILL.md, but no .agents directory exists in the checkout; the v2 observations endpoint was used directly. Is the skill file missing from the eval checkout?'
  - 'The 4 confirmed non-GT pods are treated as novel scope-tightness findings, but two of them (rate-limit and parser confusion) authenticate the GT default pair. Should a confirmed sibling fault that uses the GT credential be counted as a separate finding or folded into white-jotter-001?'
