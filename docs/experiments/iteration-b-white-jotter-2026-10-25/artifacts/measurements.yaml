        - dda347be-abea-48e4-94e5-4a4039f41858/hunting/threat_modeller/consumed/Service-sign-in/Service-sign-in.yaml
        - dda347be-abea-48e4-94e5-4a4039f41858/hunting/threat_modeller/consumed/Service-sign-in/threat-1.yaml
