    closest_issue: null
    proposed_issue:
      title: Progressive risk halt leaves Service:article-management unmodelled (stored
        XSS at /api/admin/content/article)
      body: '## Observed

        In trial white-jotter-1-20261026T031121-1618c524 (project dda347be-abea-48e4-94e5-4a4039f41858)
        the hunting run stopped modelling after three of 27 intake units. `hunting_runs.stats`
        records halt=true, risk_total=122, risk_threshold=110 (basis override), intake_position=3,
        crossing_unit="Service:library-catalog" and blocked_unit="Service:navigation-menu".


        `Service:article-management` is at intake position 8 and its console pages
        at 15. No article-management threat model, loop, test spec or pod exists.
        The only article write came from `bfla-client-identity-trust__attribution-write__session-cookie`,
        which POSTed articleTitle -> 保存成功 and read articleContentHtml back, but its
        spec is caller-principal attribution, not XSS; it used no script payload,
        never checked the reader-side rendering sink, and its export is unsuccessful/budget-timeout.


        ## Impact

        white-jotter-003 (stored XSS through the article body) is missed. The write
        route was reached for an unrelated identity probe, but no stored-XSS fault
        was ever bound because the owning unit was never modelled.


        ## Proposed direction

        1. Add a coverage floor to the progressive halt so service units that own
        content-write artifacts (article-management) are modelled before the pass
        halts, or calibrate HUNT_RISK_THRESHOLD against this intake.

        2. When any pod writes articleContentHtml, require an xss-stored spec with
        a script payload and a reader-side rendering check.

        3. Record the never-modelled units and the surfaces they own on the run row
        so the coverage loss is auditable.


        The issue bank was unavailable, so this is a proposal for the operator.'
