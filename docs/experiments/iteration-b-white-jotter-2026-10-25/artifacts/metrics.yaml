    failure_mode: surface_gap
    root_cause:
      type: design_defect
      extended_description: 'The ground truth is mass assignment in the public registration
        endpoint: the handler trusts a roles field in the request body and writes
        user-role relationships, so an unauthenticated caller creates an administrator
        account and then signs in with it (metadata.json and report.md under white-jotter-007).


        The owning unit is Service:register at intake position 9; its L1 contract
        says the service "Creates a self-service reader account from a submitted account
        name, password, real name, telephone number and electronic-mail address, refuses
        an account name already taken, and enables the new account with no administrative
        role." The run modelled three of 27 units. `hunting_runs.stats` records halt
        true, risk_total 122, risk_threshold 110 (basis override), intake_position
        3, crossing_unit Service:library-catalog, blocked_unit Service:navigation-menu,
        so Service:register and its registration page at position 17 were never modelled.
        The halt is accepted by `docs/design/unit-threat-model-ordering-halt-adr.md`.


        No `Service-register` model, loop, test spec or pod directory exists, and
        the mass-assignment class was never loaded. The only register interaction
        is the sign-in unit''s enumeration pod, `username-enumeration-oracle__registration-duplicate__register-acceptor`:
        it registered fresh accounts, reproduced the duplicate check, and read the
        client bundle whose register function posts username, password, name, phone
        and email only. It never sent a roles field, and its PodExport is `unsuccessful`,
        terminal_reason budget-timeout. The route was touched, but the write semantics
        that constitute the vulnerability were never in a fault or a spec.


        The mass-assignment class exists (`skills/web-vulnerability-testing/mass-assignment/SKILL.md`
        and its nested-relation-write leaf), so the miss is the unmodelled register
        surface, not class knowledge. The design also let the L1 contract''s "no administrative
        role" assertion stand untested.


        The failure is a surface gap caused by the progressive risk halt: the unit
        that owns the registration write was never modelled, so no fault bound the
        role field.'
    diagnosis_overview: 'white-jotter-007 is mass assignment at /api/register: the
      handler trusts a roles array and creates an administrator account. Service:register
      is at intake position 9 of 27, but the progressive halt stopped after three
      units (halt true, risk_total 122 against 110, crossing unit Service:library-catalog,
      blocked unit Service:navigation-menu), so the register unit and its console
      page at 17 were never modelled. No register model, loop, spec or pod exists.

      The only register interaction was the sign-in unit''s enumeration pod: it registered
      accounts and read the client bundle''s five fields, but never sent a roles field;
      its export is an unsuccessful budget-timeout.

      The L1 contract asserts the new account has no administrative role, and that
      assertion was never tested; the mass-assignment class exists in the suite, so
      this is coverage, not knowledge.

      Typed root cause: the progressive risk-threshold halt leaves the register surface
      unmodelled (design_defect).'
