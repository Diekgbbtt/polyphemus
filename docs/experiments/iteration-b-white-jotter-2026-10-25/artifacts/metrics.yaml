        is COMPLETED and valid, and its threat-1 is SQL injection through free-text
        search composition, likelihood high, confidence OBSERVED, with probes that
        show the differential: 圣母'' returns the generic code-400 envelope, 圣母'' OR
        ''1''=''1 returns one record, '' OR 1=1 -- returns every row (probe lib-06),
        the differential is stable over five repeats at 793 / 13,854 / 43 bytes (probe
        lib-21), and LIKE metacharacters pass through unescaped (probe lib-17). The
        model''s risk total for the unit is 31.


        The unit was never hunted. There is no `Service-library-catalog__threat-*`
        test spec and no pod directory for any of its five threats. The batch queue
        is the reason: `hunting_runs.stats` records pipeline_sync batched, and the
        queue is ordered by each unit''s model risk DESCENDING (sign-in 47, RESTApi:api
        44, library-catalog 31). Batched dispatch works one unit at a time: the first
        unit''s hunter batch, then its pods, then the next unit. The two higher-risk
        units consumed the trial: the trial spent 7,017,453 capped tokens against
        a 7,000,000 budget, with 6,524,418 (93%) in hunting agents (threat modeller
        582,875; hunter 2,177,105; pod runner 3,475,010; pod triager 289,428). The
        run stopped at 03:11:21 and the library-catalog batch was never admitted.
        The crossing unit was therefore never dispatched, although the ordering-halt
        ADR promises the crossing unit is fully modelled and dispatched.


        The terminal also shows an implementation defect in the stop path: the token-budget
        poll called POST /projects/<id>/execution/stop and got HTTP 0 TimeoutError
        (after 1 attempt), which stamped the hunting phase failed instead of stopped.
        The app''s hunting run did finish stopped at 03:11:21, but the trial record''s
        terminal is failed and spend_overshoot is null, so the budget stop is not
        recorded as the stop it was. The budget stop was real; the confirmation was
        fragile.


        The batch queue and the single scalar budget have no per-unit reservation
        or coverage floor, so a 27-unit intake cannot reach the unit that owns the
        search after two higher-risk units. The SQL injection was not a discovery
        failure: it was modelled OBSERVED and left produced.'
