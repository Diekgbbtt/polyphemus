            header, and failures set only rememberMe=deleteMe (no JSESSIONID => counter
            cannot be session-keyed), while JSESSIONID Set-Cookie lines present after
            the burst corroborate the good-credential login succeeding. Envelope codes
            400/密码错误, 账号不存在 on the unconfirmed-username control, and the flat latency
            trend (50.2ms -> 46.1ms) come from the Runner note, not this header artifact;
            they are consistent with it.'
