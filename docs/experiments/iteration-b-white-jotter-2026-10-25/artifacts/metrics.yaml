          spec:
            discriminators:
            - axis: technique
              value: burst-classification
            - axis: timing-state
              value: sequential
            - axis: route-spelling
              value: canonical
            verification_symptoms:
            - Thirty sequential POST /api/login failures (distinct wrong passwords,
              one confirmed account) each answer HTTP 200 with envelope code 400 and
              message 密码错误, with no 429/403/423, no Retry-After or RateLimit header,
              and no rising per-attempt latency trend.
            - A known-good credential submitted as the final attempt of the same burst
              still returns code 200 with result equal to the submitted username plus
              a fresh Set-Cookie JSESSIONID, so the burst accumulated attempts without
              any lockout or delay being applied.
            - The same treatment against an unconfirmed username answers 账号不存在 throughout,
              showing the absence of refusal is not an artefact of the account branch.
            assumptions:
            - No attempt counter, per-account budget, lockout, delay or captcha stands
              between repeated POST /api/login verifications, at the nginx tier or
              in the Spring controller.
            - The outcome channel is the envelope message field (密码错误 vs 账号不存在), never
              the status code, because every path answers HTTP 200.
            rationale: 'The credential-verification transition accounts for nothing,
              so guess volume is bounded only by network throughput: the endpoint
              is a password oracle whose attempt budget is the caller''s bandwidth,
              and each admitted attempt is one full digest comparison against a named
              account.'
            skills:
            - rate-limit-bypass
            - defence-bypass-throttle-evasion
            skill_concretised_procedure:
              recon_action: 'Confirm one account name with the message oracle (账号不存在
                vs 密码错误) and hold one known-good credential as the seed; both via
                POST /api/login with Content-Type: application/json.'
              bypass_technique: 'None required: attempts are admitted as sent, so
                the burst is paced only to measure latency drift and to keep the seed
                inside the same session state.'
              advanced_technique: Known-good seed placed at a known position in the
                burst, so an admit answer is distinguished from a silently dropped
                effect.
              preliminary_chaining: Account enumeration through the same endpoint's
                message discrimination supplies the named account, converting blind
                guessing into targeted guessing.
              payload_vector: JSON body {"username":"<confirmed account>","password":"<candidate>"}
                posted to /api/login; one candidate per request, iterated sequentially.
              technology_misconfiguration: Spring Boot credential controller with
                no attempt accounting behind an nginx/1.31.6 front holding no limit_req
                for the /api location.
              technology_grounding: 'Server: nginx/1.31.6; single HTTP 200 envelope
                {code,message,result} on every path; JSON binding is the only accepted
                media type (IA-1); account collation is case-insensitive (DF-1).'
              pro_tips: 'The seed attempt is the measurement, not an afterthought:
                a lockout is proved only by the correct credential being refused after
                the burst, and a silent throttle only by it being accepted while latency
                climbs.'
              interpretation_pitfalls: HTTP 200 on every attempt is not proof of an
                absent limit; without the seed and the latency series a shadow-throttle
                that answers while dropping the effect reads as an open endpoint.
