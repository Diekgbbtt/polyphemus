    - source: skill
      ref: skills/web-vulnerability-testing/defence-bypass/defence-bypass-edge-origin-differential/SKILL.md
      note: Owns the enforcing-tier versus serving-tier differential, including path
        spellings; the bfla-alternate-path skill lists delimiter insertion and warns
        "never conclude resistance from one rejected framing". Neither the tier class
        nor the delimiter form was applied here.
    - source: code
      ref: src/polymerhus/attack/hunting/surfer.py::run_pod_session
      note: 'DEFAULT_DISPATCH_TIMEOUT_S = 2700.0; on asyncio.TimeoutError the surfer
        writes {"verdict": "unsuccessful", "terminal_reason": "budget-timeout", "clean":
        false, "error": "the pod session exceeded its watchdog window"}, replacing
        the pod''s own terminal. 58 of 66 PodExports in this trial are budget-timeout
        and only 4 are successful.'
    - source: design_doc
      ref: docs/design/unit-threat-model-ordering-halt-adr.md
      note: 'The halt is accepted as a design property: the crossing unit is fully
        modelled, the next unit is never modelled, and the halt set is a function
        of the frozen intake order. The ADR records that the threshold and weights
        are calibratable by replaying recorded runs.'
    closest_issue: null
    proposed_issue:
      title: Threat modeller closes the path-spelling family on suffix-only matrix
        probes; the admin wildcard bypass is never tested
      body: '## Observed

        In trial white-jotter-1-20261026T031121-1618c524 (project dda347be-abea-48e4-94e5-4a4039f41858)
        the RESTApi unit bound F-1 to a trailing-separator path-normalisation differential.
        Its technical_sharpening note says "/api/admin/** wildcard is NOT bypassable;
        //, ;matrix, %20, %2f, %00 and case variants are refused", but the matrix
        probes were suffixes on /api/menu, not an empty matrix segment before the
        protected segment.


        The bfla-alternate-path specs inherited the narrow vector: the unauthenticated-session
        spec says "Append one trailing separator" and "the in-path matrix form is
        a dead end". No spec asked for /api/;/admin/....


        The only pod that tried the right shape was `broken-function-level-authorization__admin-content__wildcard-prefix__data-or-privileged-effect`.
        Observation 6 of its experiment log sent /api/;/admin/content/books cookieless
        and read HTTP 200, 41 bytes, {"code":400,"message":null,"result":null}: the
        admin handler executed. It then moved to /actuator and never tested /api/;/admin/user
        or a state effect; its export (and all four bfla-alternate-path exports) is
        `unsuccessful`, terminal_reason `budget-timeout`, error "the pod session exceeded
        its watchdog window".


        The ReverseProxy unit, which identified this exact finding in the 2026-10-22
        white-jotter trial through `matrix-segment-filter-miss_admin-read`, sat at
        intake position 6 and was blocked by the progressive halt (crossing unit Service:library-catalog,
        blocked unit Service:navigation-menu).


        ## Impact

        white-jotter-002 is missed. A cookieless GET /api/;/admin/user returning the
        admin roster was one probe away from the pod that already reached /api/;/admin/content/books.


        ## Proposed direction

        1. When a path-normalisation fault is bound, load `defence-bypass-edge-origin-differential`
        (or enforce the full normalisation matrix) and require the empty-matrix-segment
        form before the protected segment, not only suffixes.

        2. Add a positive probe for /api/;/admin/* to every alternate-path spec that
        touches the admin namespace.

        3. Do not let a pod watchdog overwrite a pod''s own terminal with a degraded
        `unsuccessful` export; preserve the raw observations or extend the window
        on progress, so the one pod that reached the right spelling can conclude.

        4. Add a coverage floor to the progressive halt so a unit owning the edge-vs-core
        differential (ReverseProxy) is not blocked behind the first three modelled
        units.


        The issue bank was unavailable, so this is a proposal for the operator.'
