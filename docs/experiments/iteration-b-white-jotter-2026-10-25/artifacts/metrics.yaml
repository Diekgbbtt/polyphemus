      value: 'Per-route authorization gate (Apache Shiro in front of the Spring Boot
        servlet chain - the dead /nowhere is the framework''s loginUrl and the bunched
        refusal is its filter, recorded in the run''s auth store) keyed on the authenticated
        principal stored in the JSESSIONID cookie session: an anonymous GET /api/menu
        is refused with a 302 redirect to /nowhere plus a freshly minted JSESSIONID
        cookie (Path=/; HttpOnly, no Secure, no SameSite) that is echoed into the
        Location as ;jsessionid= only when it is minted in that same answer, while
        a minted-but-unauthenticated session cookie is refused with the same 302 and
        no new cookie and an invented id is silently replaced by a fresh session -
        so the gate keys on a server-side principal rather than on cookie presence,
        and a refusal is a 302 redirect, not a 401/403 challenge. Enforcement is per-route,
        not per-prefix: /api/register and /api/login answer anonymously with a 200
        carrying the {code,message,result} envelope, and GET /api/admin/content/editor
        answers an anonymous 200 with Content-Length 0, no Content-Type and no challenge
        at all - a route that omits the filter is directly reachable - while the console''s
        own client-side guard only reads a `username` value out of localStorage and
        is spoofable by anyone who sets it. The role vocabulary the mechanism carries
        is sysadmin, contentmanager, visitor and test, and the accounts it authorizes
        are minted by the anonymous self-service /api/register route whose `username`
        request parameter (paired with the `password` request parameter on the JSON
        POST /api/login credential) becomes the principal the gate later checks, so
        the boundary it reads - sign-in writes the session, register writes the account,
        navigation-menu and the /api administration chain are checked against it -
        is written by unauthenticated callers; a rememberMe cookie minted alongside
        the session does not by itself pass the gate and is bounced to the same /nowhere.'
