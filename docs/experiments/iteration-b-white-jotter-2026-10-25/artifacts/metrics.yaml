            verification_symptoms:
            - The menu/navigation tree returned for the case-aliased session differs
              from the tree returned for the canonical-spelling session of the same
              account with the same password.
            - A menu entry or permission identifier appears for the aliased principal
              that the same account does not receive when it authenticates canonically.
            assumptions:
            - The menu service resolves the caller's roles and menu tree by the principal
              string rather than by the matched account's id or stored name.
            - Both spelling sessions can be held concurrently so the two trees are
              compared under one dataset.
            rationale: Menu and role provisioning keyed on the principal string gives
              the caller-selected spelling an authority set of its own. If role resolution
              does not re-read the matched account, the aliased principal resolves
              to a different set of grants than its own account, so the console's
              navigation and permissions are decided by the request input rather than
              by the record the password proved.
            skills:
            - bfla-client-identity-trust
            - broken-function-level-authorization
            skill_concretised_procedure:
              recon_action: With a canonical session, capture the nav/menu provisioning
                response and the permission list the console renders; record which
                role the account holds from the roster.
              bypass_technique: Authenticate with a case-permuted spelling of an account
                whose password is held, then load the menu/nav provisioning route
                with that session.
              advanced_technique: 'Alias-versus-canonical authority differential:
                the same account''s role/menu set is dumped twice under two spellings
                and the delta is attributed to the principal string.'
              preliminary_chaining: 'Self-registration when no credential is held
                (probe: POST /api/register binds JSON and answers the parameter envelope),
                so the account''s granted role is known and the canonical tree is
                a trustworthy control.'
              payload_vector: JSON body {"username":"<CASE-PERMUTED-SPELLING>","password":"<same
                password>"} on POST /api/login; the resulting JSESSIONID carries the
                alias into the menu route.
              technology_misconfiguration: Case-insensitive account lookup paired
                with role/menu resolution that may key on the caller-supplied principal
                string instead of the matched account.
              technology_grounding: The Vue console renders its navigation from the
                menu provisioning route, and the back office landing after sign-in
                loads the caller's menu tree, so this route is principal-dependent
                by design.
              pro_tips: Keep both cookie jars alive and hit the menu route within
                the same minute; a session that expired between runs reads as an empty
                tree and looks like a delta. Compare permission identifiers, not just
                menu labels.
              interpretation_pitfalls: An empty or absent menu under the alias can
                be a generic failure envelope or a route that never existed for this
                build; only a tree that differs from the same account's canonical
                tree while both sessions are live counts. Equal trees mean the role
                join re-read the account and the claim fails.
