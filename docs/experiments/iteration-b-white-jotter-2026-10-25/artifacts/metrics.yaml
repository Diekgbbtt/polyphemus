        interpretations:
        - variant: v0
          classification: ''
          note: 'SYMPTOM CONFIRMED. POST /api/login binds a BOM-marked UTF-16LE credential
            body under Content-Type: application/json as a normal login: {"code":200,"result":"admin"}
            with fresh rememberMe+JSESSIONID, and that session reads GET /api/admin/user
            200/1877b as admin/sysAdmin while no-cookie returns empty. Plain-UTF-8
            control with the same members authenticates identically, and null-byte
            UTF-16/BE/32, no-BOM UTF-16LE and lead-null pad all succeed, so decoding
            is byte-pattern autodetection, not a blanket 200 and not strictly BOM-gated.
            Negatives prove values are evaluated (wrong password -> 400 密码错误, unknown
            user -> 400 账号不存在, garbage -> 400). C-locale grep over the delivered bytes
            returns zero ''username''/''admin'' hits, so the ASCII byte reading is
            opaque: the gate/decoder split is real. Charset parameters (UTF-8/US-ASCII/ISO-8859-1)
            are ignored and text/plain is refused, confirming the gate reads only
            the declaration. Residual, not impairing the finding: no /api/log or /api/audit
            exists (404 SPA fallback across 6 paths), so symptom 2''s downstream body-keyed
            reader remains inference from the byte reading rather than an observed
            log; one KB terminal query degraded. Clean is false for that unobserved
            log surface and the empty stored search_after, not because the differential
            is in doubt.'
        init_validation: []
        variant_specs:
        - ref: v0
          parent_ref: null
          declined_attribute: ''
          spec:
            discriminators:
            - axis: technique
              value: encoding-declaration
            - axis: payload-vector
              value: body-bytes
            - axis: manifestation
              value: representation-split
            verification_symptoms:
            - 'a byte-order-marked UTF-16LE credential body under Content-Type: application/json
              authenticates (code 200, result=<username>, fresh JSESSIONID) while
              the identical bytes read as plain text contain no username or password
              member'
            - an ASCII reader of the delivered body bytes cannot reconstruct the authenticated
              identity, so any body-keyed log, audit or counter attributes the request
              to no identity or a different one
            - 'control: the same member pair sent as a plain UTF-8 body authenticates
              identically, so the differential is the byte encoding alone and not
              the credential values'
            assumptions:
            - the message converter hands the raw body to Jackson, which autodetects
              the encoding from a byte order mark instead of forcing UTF-8
            - the media-type gate evaluates the declared Content-Type only and does
              not transcode the body
            - no intermediary between the client and the binder decodes and re-encodes
              the body
            rationale: The gate reads a declaration while the decoder reads bytes,
              so one request can be a well-formed credential object to the authenticating
              parser and an opaque byte string to every byte-oriented reader of the
              same body. Identity attributed by any body-keyed log, audit or counter
              is then not the identity that was verified.
            skills:
