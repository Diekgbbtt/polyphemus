        clean: false
        interpretations:
        - variant: v0
          classification: information-disclosure
          note: 'Confirmed on in-band evidence. Plaintext POST /api/login -> 200,
            "Set-Cookie: JSESSIONID=CAD185EE...; Path=/; HttpOnly" - no Secure, no
            SameSite, no HSTS. Replaying that id over plain http gave 200 text/plain
            "身份认证成功" (18b) on /api/authentication and 200 admin-nav JSON on /api/menu,
            while a garbage JSESSIONID 302''d to /nowhere (size 0) on both: the in-band
            control excludes echo/cache. All three symptoms met. Both KB queries degraded,
            so clean=false; the confirmation rests on target evidence.'
        init_validation: []
        variant_specs:
        - ref: v0
          parent_ref: null
          declined_attribute: ''
          spec:
            discriminators:
            - axis: artifact
              value: session-id
            - axis: carrier
              value: response-cookie
            verification_symptoms:
            - 'The plaintext response that issues the session sets JSESSIONID with
              HttpOnly and Path=/ and carries neither Secure nor SameSite (verbatim
              shape: JSESSIONID=<id>; Path=/; HttpOnly)'
            - Replaying that exact JSESSIONID over a plain http GET to /api/authentication
              returns the 200 authenticated body (not a 302 to /nowhere), while a
              garbage identifier still 302s - the identifier is live and travelled
              unencrypted
            - No Strict-Transport-Security header accompanies the response that issues
              the cookie
            assumptions:
            - the plaintext login response sets JSESSIONID with HttpOnly and Path=/
              but without Secure and without SameSite
            - the issued identifier authenticates a later plaintext request rather
              than being rejected
            rationale: The session identifier - the unit's only identity artifact
              - is issued without Secure, so nothing prevents it from travelling on
              the unencrypted channel; an observer on the path holds a live credential
              that needs no password and no victim interaction to reuse.
            skills:
            - information-disclosure
            - session-management
            skill_concretised_procedure:
              recon_action: Capture the Set-Cookie line on the plaintext anonymous
                redirect and on the plaintext login success, then hold that identifier
                for an explicit replay.
              bypass_technique: Replay the captured JSESSIONID over http with no cookie-jar
                refresh, so the reuse is explicit rather than incidental.
              advanced_technique: 'Attribute-gap-with-position: the missing Secure
                flag is a policy fact until it is paired with a plaintext carrier
                that is demonstrably live.'
              preliminary_chaining: Requires one successful plaintext login (or the
                anonymous mint) to obtain a live identifier; no other vulnerability
                is needed.
              payload_vector: 'Cookie: JSESSIONID=<issued value> sent as a request
                header on a plain http GET to /api/authentication or /api/menu.'
              technology_misconfiguration: 'Tomcat session cookie left unhardened:
                Secure is never emitted even when the client claims X-Forwarded-Proto:
                https, SameSite is absent, and no TLS listener exists in front of
                the connector.'
              technology_grounding: Spring Boot/Tomcat session cookie JSESSIONID behind
                nginx/1.31.6 at http://t-1618c524.target, recorded and probed at tls=false
                on 172.17.0.1:80; IA-4 states a live id returns 200 text/plain on
                /api/authentication.
              pro_tips: Read the cookie on both the anonymous mint and the authenticated
                response, because an attribute set that appears on one response can
                differ on the other, and quote the verbatim Set-Cookie line.
              interpretation_pitfalls: 'A 200 alone is not proof: confirm the body
                is the authenticated text and keep a garbage-identifier negative control
                that 302s to /nowhere. HttpOnly present must not be read as transport
                protection.'
