        1. Add a coverage floor to the progressive halt, or calibrate HUNT_RISK_THRESHOLD
        so the register and user-administration units are reached.

        2. Add a logging-sink / JNDI lookup variant to the suite (Log4j2/lookup evaluation,
        attacker-controlled log fields, callback oracle) and an inventory step that
        fingerprints the logging dependency and its version.

        3. When a request-derived username reaches a logging framework, require a
        crafted-username probe with a callback listener.


        The issue bank was unavailable, so this is a proposal for the operator.'
