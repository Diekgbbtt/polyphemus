    closest_issue: null
    proposed_issue:
      title: Bind the shipped default administrator credential as a fault on the sign-in
        unit
      body: '## Observed

        In trial white-jotter-1-20261026T031121-1618c524 (project dda347be-abea-48e4-94e5-4a4039f41858)
        the Service:sign-in unit bound its credential fault to rate-limit-bypass (F-1,
        missing attempt throttling). The loop `threat-1.yaml` records "a seeded default
        administrator credential is documented for this project" only as a likelihood
        premise, and the unit''s well-formedness pass loaded ten classes, none of
        them weak-credential-discovery.


        The rate-limit pod''s own control probes submitted admin/123 repeatedly and
        got HTTP 200 {"code":200,"message":"成功","result":"admin"} with a fresh JSESSIONID
        (experiment-log/0.yaml, probes 1d564c111ccf5269 C3, e66176893827029f "SEED
        attempt 31", and the final burst seed). The successful PodExport classifies
        the slice as rate-limit-bypass and cites the good-credential login only as
        corroboration.


        `auth/credentials.yaml` holds the same admin/123 pair as the operator bootstrap,
        with the note "Seed administrator from the shipped database script (username
        admin, password 123 per the project README)". The suite ships `skills/web-vulnerability-testing/weak-credential-discovery/default-credential-replay`,
        so the class exists.


        ## Impact

        white-jotter-001 is the cheapest finding on the target: one submission of
        admin/123 returns a sysAdmin session. The pipeline authenticated it repeatedly
        as its own working credential and never reported it, so the partial verdict
        is a binding miss, not a discovery cost.


        ## Proposed direction

        1. In the threat-modeller prompt, make a public seeded credential recorded
        on the owning sign-in unit a mandatory fault, not a likelihood caveat.

        2. When the operator auth bootstrap authenticates with a credential that matches
        a shipped/default pair, require the sign-in unit to emit a default-credential-replay
        loop or a probe that falsifies the pair.

        3. Promote a pod control probe that authenticates a default pair into a finding
        instead of leaving it as a rate-limit control.


        The issue bank was unavailable, so this is a proposal for the operator.'
      labels:
      - bug
      - needs-triage
