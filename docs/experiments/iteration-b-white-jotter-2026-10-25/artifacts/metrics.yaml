    proposed_issue:
      title: Progressive risk halt leaves register/user-administration unmodelled,
        and the suite has no logging-sink JNDI class
      body: '## Observed

        In trial white-jotter-1-20261026T031121-1618c524 (project dda347be-abea-48e4-94e5-4a4039f41858)
        the progressive halt stopped the pass after three of 27 intake units: halt=true,
        risk_total=122, risk_threshold=110 (basis override), intake_position=3, crossing_unit="Service:library-catalog",
        blocked_unit="Service:navigation-menu".


        white-jotter-004 needs Service:register (intake position 9) for the crafted
        username and Service:user-administration (position 24) for the unauthorized
        administrative access whose username is logged. Neither unit has a model,
        loop, spec or pod. No hunting artifact mentions JNDI, log4j or log4shell except
        one raw actuator bean name, `Log4J2MetricsAutoConfiguration`, in a pod that
        timed out.


