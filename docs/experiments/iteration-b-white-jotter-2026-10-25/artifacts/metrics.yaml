                declared charset on the request does not change decoding (this run:
                ignored).'
              bypass_technique: 'Deliver the credential object as byte-order-marked
                UTF-16LE bytes under Content-Type: application/json, keeping the object''s
                members identical to the canonical baseline.'
              advanced_technique: 'Encoding-autodetection split: exploit byte-order-mark
                detection so the decoded representation differs from the byte reading
                any log or counter would take of the same body.'
              preliminary_chaining: None; the object's members are the registered
                account's canonical pair, so the effect is a normal authentication
                whose raw body is unreadable as ASCII.
              payload_vector: 'Canonical credential object encoded UTF-16LE and prefixed
                with bytes FF FE, sent from a file with --data-binary under Content-Type:
                application/json, byte length recorded so the delivered length matches
                the declaration.'
              technology_misconfiguration: Jackson byte-order-mark encoding autodetection
                behind a media-type gate that validates the Content-Type declaration
                without constraining the body encoding.
              technology_grounding: probe-1 records nginx/1.31.6 as the front with
                no body-parsing intermediary; responses declare application/json;charset=UTF-8,
                and this run showed request charset parameters are ignored by the
                decoder, so decoding is driven by the bytes rather than the declaration.
              pro_tips: Send the body from a file with --data-binary; curl's --data
                would mangle the bytes. Record the byte length and the exact header,
                and prove the byte reading by showing the same bytes contain no parseable
                username or password member as plain text.
