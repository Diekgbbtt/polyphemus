- vuln: white-jotter-002
  failure_mode: modeller_failed_unit-fault_binding
  root_cause:
    type: skill_defect
    combination_of: [design_defect]
    extended_description: |-
      The ground truth is an access-control bypass through a semicolon path segment: a cookieless GET /api/;/admin/user returns the administrator roster because Shiro's /api/admin/** rule does not match the spelling while the router still resolves the admin handler (metadata.json, report.md, and verify/exploit under white-jotter-002).

      The run modelled the /api namespace in `RESTApi:api` and bound F-1 to a trailing-separator path-normalisation differential (web_vulnerability_class bfla-alternate-path). Its threat-1 recorded the trailing-slash alias on two exact-path handlers and concluded "the alias set is exactly the trailing separator". The unit's technical_sharpening note states the false closure verbatim: "/api/admin/** wildcard is NOT bypassable; //, ;matrix, %20, %2f, %00 and case variants are refused". The matrix probes behind that sentence were suffixes such as /api/menu/;/ and /api/menu//, not an empty matrix segment before the protected segment (/api/;/admin/user).

      The specs inherited the narrow fault: the bfla-alternate-path spec for the unauthenticated-session slot gives the payload vector as "Append one trailing separator to the liveness route" and its interpretation pitfall says "the in-path matrix form is a dead end". No spec asked for the semicolon segment on the admin namespace.

      The class that owns the tier differential was available and was not loaded: `skills/web-vulnerability-testing/defence-bypass/defence-bypass-edge-origin-differential/SKILL.md` compares the enforcing tier's verdict with the serving tier's, and the bfla-alternate-path skill itself lists delimiter insertion among its normalisation forms and warns "never conclude resistance from one rejected framing". The prior white-jotter trial identified this exact finding through `ReverseProxy:nginx-1.31.6` loop-1 (matrix-segment-filter-miss) and its verdict names /api/;/admin/user returning the roster; in this run the ReverseProxy unit sat at intake position 6 and was blocked by the progressive halt (crossing unit Service:library-catalog, blocked unit Service:navigation-menu).

      The only pod that tried the right spelling was the wildcard-prefix pod. In observation 6 of its experiment log it sent /api/;/admin/content/books and got HTTP 200, 41 bytes, {"code":400,"message":null,"result":null}: the admin handler executed, and a data read was one sub-path away. It then moved to /actuator in observation 7 and never tested /api/;/admin/user or any state effect. Its PodExport is `unsuccessful`, terminal_reason `budget-timeout`, error "the pod session exceeded its watchdog window". All four bfla-alternate-path pods are likewise `unsuccessful/budget-timeout` even though their logs contain the trailing-separator symptom. Across the trial, 58 of 66 PodExports carry terminal_reason budget-timeout and only 4 are successful, so a pod that does not conclude inside the 2700 s dispatch watchdog loses its terminal to a degraded envelope.

      The failure is therefore a modeller fault-binding defect: the routing-tier normalisation fault was bound to one spelling, the correct family was declared closed, and the tier-differential class was never loaded. The halt that blocked the owning ReverseProxy unit and the pod watchdog that cut off the one accidental hit are the compounding design causes.
  diagnosis_overview: |-
    white-jotter-002 is the semicolon-segment access-control bypass at /api/;/admin/user. The RESTApi unit bound the path-normalisation fault to a trailing-separator differential only, and its technical_sharpening note declares "/api/admin/** wildcard is NOT bypassable" after suffix-only matrix probes; the specs carry that narrow vector and call the in-path matrix form a dead end.
    The tier-differential class existed (defence-bypass-edge-origin-differential) and the prior white-jotter trial identified this exact finding through the ReverseProxy unit's matrix-segment loop; in this run the ReverseProxy unit was blocked by the progressive halt at intake position 6.
    The only pod that tried /api/;/admin/content/books got a 200 envelope (handler executed) in observation 6, then moved to /actuator and never tested /api/;/admin/user; its export and all four bfla-alternate-path exports are unsuccessful/budget-timeout, and only 4 of 66 PodExports in the trial are successful.
    Typed root cause: a modeller fault-binding and class-selection defect (skill_defect), compounded by the halt that blocked the owning unit and the pod watchdog that destroyed the one positive observation (design_defect).
