  proposed_issue:
    title: "Batched risk-desc queue and 7M budget starve the library-catalog unit: the SQLi was modelled OBSERVED and never hunted"
    body: |-
      ## Observed
      In trial white-jotter-1-20261026T031121-1618c524 (project dda347be-abea-48e4-94e5-4a4039f41858) Service:library-catalog was modelled COMPLETED and its threat-1 records SQL injection at /api/search as high likelihood, OBSERVED, with a stable differential (793 / 13,854 / 43 bytes over five repeats). The unit is still in `hunting/threat_modeller/produced/`; no `Service-library-catalog__threat-*` test spec and no pod directory exists.

      The run is batched (`hunting_runs.stats.pipeline_sync=batched`) and the queue sorts units by model risk DESC: sign-in 47, RESTApi:api 44, library-catalog 31. The first two units consumed the trial: spent_tokens 7,017,453 against a 7,000,000 budget, with 6,524,418 (93%) in hunting agents. The library-catalog batch was never admitted.

      The stop confirmation is also fragile: the budget poll's POST /projects/dda347be-abea-48e4-94e5-4a4039f41858/execution/stop returned HTTP 0 TimeoutError after one attempt, so the hunting phase and the trial terminal are `failed` and spend_overshoot is null, even though the hunting run finished `stopped` at 03:11:21.

      ## Impact
      white-jotter-005 is missed even though the model had already observed the injection. The same starvation also kept the traversal read (white-jotter-006) unhunted.

      ## Proposed direction
      1. Reserve a share of the trial token budget per queued unit, or add a coverage floor, so the third modelled unit cannot be starved.
      2. Dispatch the crossing unit's threats before the next unit (the ordering-halt ADR promises the crossing unit is dispatched), or make the queue advance on remaining budget.
      3. Retry the stop call on transport timeout and record the budget stop as `stopped`, not `failed`.
      4. Record the never-dispatched units on the run row so the starvation is visible at assessment time.

