- vuln: white-jotter-001
  failure_mode: modeller_failed_unit-fault_binding
  root_cause:
    type: skill_defect
    combination_of: [design_defect]
    extended_description: |-
      The ground truth is a shipped default administrator credential: POST /api/login with admin/123 returns a sysAdmin session (metadata.json and report.md under white-jotter-001).

      The Service:sign-in unit modelled the endpoint and bound F-1 to "missing attempt throttling / lockout on the credential-verification transition" with V-1 web_vulnerability_class rate-limit-bypass. The loop `Service-sign-in/threat-1.yaml` records the default credential as a premise and not as the fault: its likelihood rationale says "a seeded default administrator credential is documented for this project", but the loop tests guessing volume, not the default pair. The unit's well-formedness pass loaded ten classes (session-management, username-enumeration-oracle, rate-limit-bypass, csrf-navigation-get, bfla-client-identity-trust, defence-bypass-encoding-differential, defence-bypass-parser-confusion, insecure-deserialization, information-disclosure, crypto-predictable-token); weak-credential-discovery was not among them.

      The class was available: `skills/web-vulnerability-testing/weak-credential-discovery/default-credential-replay/SKILL.md` owns exactly a published default pair still honoured by the login acceptor, and the class key names seeded accounts that survive deployment. This is procedural drift in the modeller's class selection and fault binding, not a knowledge gap.

      The rate-limit pod's own control probes authenticated the ground-truth pair repeatedly: its experiment log records POST /api/login with {"username":"admin","password":"123"} returning HTTP 200 {"code":200,"message":"成功","result":"admin"} with a fresh JSESSIONID (probe 1d564c111ccf5269 C3, probe e66176893827029f "SEED attempt 31", and the final burst seed), and its PodExport classifies the slice as rate-limit-bypass, citing the JSESSIONID lines only as corroboration that the good-credential login succeeded. The pod was scoped to the burst, so it followed its spec and never claimed the default credential.

      The design reinforces the miss: the operator auth bootstrap is the same pair. `auth/credentials.yaml` holds username admin, password 123, origin operator, with the note "Seed administrator from the shipped database script (username admin, password 123 per the project README)". The pipeline's own working credential is the ground-truth vulnerability, so the model treats it as legitimate material rather than as a target-side fault.

      No loop, spec, or pod was scoped to weak/default credentials.
  diagnosis_overview: |-
    white-jotter-001 is the shipped default administrator credential admin/123 at POST /api/login. The Service:sign-in unit bound its only credential fault to rate-limit-bypass (F-1, missing attempt throttling) and recorded the default pair only as a premise ("a seeded default administrator credential is documented for this project").
    The rate-limit pod's control probes authenticated admin/123 repeatedly and got HTTP 200 {"code":200,"message":"成功","result":"admin"} with a fresh JSESSIONID, but its spec was the burst and its successful export classified the slice as rate-limit-bypass, so the credential was corroboration rather than a finding.
    The weak-credential-discovery / default-credential-replay class exists in the suite but was never loaded; the operator auth store holds the same admin/123 pair as bootstrap material, which reinforces treating it as legitimate context.
    Typed root cause: a modeller class-selection and fault-binding defect (skill_defect), reinforced by the auth-bootstrap design that presents the ground-truth credential as legitimate material (design_defect).
