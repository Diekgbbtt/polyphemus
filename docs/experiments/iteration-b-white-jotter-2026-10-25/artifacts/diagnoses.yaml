      The ReverseProxy unit, which identified this exact finding in the 2026-10-22 white-jotter trial through `matrix-segment-filter-miss_admin-read`, sat at intake position 6 and was blocked by the progressive halt (crossing unit Service:library-catalog, blocked unit Service:navigation-menu).

      ## Impact
      white-jotter-002 is missed. A cookieless GET /api/;/admin/user returning the admin roster was one probe away from the pod that already reached /api/;/admin/content/books.

      ## Proposed direction
      1. When a path-normalisation fault is bound, load `defence-bypass-edge-origin-differential` (or enforce the full normalisation matrix) and require the empty-matrix-segment form before the protected segment, not only suffixes.
