  proposed_issue:
    title: "Batched risk-desc queue and 7M budget starve the library-catalog unit: the traversal read was modelled OBSERVED and never hunted"
    body: |-
      ## Observed
      In trial white-jotter-1-20261026T031121-1618c524 (project dda347be-abea-48e4-94e5-4a4039f41858) Service:library-catalog was modelled COMPLETED and its threat-2 records the out-of-root file read at high likelihood, OBSERVED: the `..;` spelling already served the application bundle (11,001 B) and its source map (31,369 B), while raw `..` was refused by nginx and encoded forms by the container. The unit is still in `threat_modeller/produced/`; no Service-library-catalog__threat-* spec and no pod directory exists.

      The run is batched and the queue sorts units by model risk DESC: sign-in 47, RESTApi:api 44, library-catalog 31. The first two units consumed the 7,000,000 capped-token budget (spent 7,017,453, hunting agents 6,524,418 = 93%), so the library-catalog batch was never admitted.

      The stop confirmation is fragile: POST /projects/dda347be-abea-48e4-94e5-4a4039f41858/execution/stop returned HTTP 0 TimeoutError after one attempt, so the trial terminal is `failed` and spend_overshoot is null even though the hunting run finished `stopped` at 03:11:21.

      ## Impact
      white-jotter-006 is missed although the traversal was already demonstrated against the target. The same starvation also kept the SQL injection (white-jotter-005) unhunted.

      ## Proposed direction
      1. Reserve a share of the trial token budget per queued unit, or add a coverage floor, so the third modelled unit cannot be starved.
      2. Dispatch the crossing unit's threats before the next unit, or make the queue advance on remaining budget.
      3. Retry the stop call on transport timeout and record the budget stop as `stopped`, not `failed`.
      4. Record the never-dispatched units on the run row so the starvation is visible at assessment time.

      The issue bank was unavailable, so this is a proposal for the operator.
    labels: [bug, needs-triage]
