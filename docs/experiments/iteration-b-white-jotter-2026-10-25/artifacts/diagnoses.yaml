  proposed_issue:
    title: "Progressive risk halt leaves Service:register unmodelled (mass assignment at /api/register)"
    body: |-
      ## Observed
      In trial white-jotter-1-20261026T031121-1618c524 (project dda347be-abea-48e4-94e5-4a4039f41858) the hunting run stopped modelling after three of 27 intake units: halt=true, risk_total=122, risk_threshold=110 (basis override), intake_position=3, crossing_unit="Service:library-catalog", blocked_unit="Service:navigation-menu".

      `Service:register` is at intake position 9 and its console page at 17. There is no register model, loop, spec or pod. The L1 contract asserts the new account "has no administrative role", but that invariant was never tested.

      The only register interaction is `username-enumeration-oracle__registration-duplicate__register-acceptor`: it registered accounts and read the client bundle's register function (username, password, name, phone, email), never sent a roles field, and ended as an unsuccessful/budget-timeout export.

      ## Impact
      white-jotter-007 (mass assignment through a roles array at /api/register) is missed even though the route and the client fields were observed. The unmodelled register unit leaves the registration write semantics unassessed.

      ## Proposed direction
      1. Add a coverage floor to the progressive halt so the register unit is modelled before the pass halts, or calibrate HUNT_RISK_THRESHOLD against this intake.
      2. Bind mass-assignment on any registration acceptor and require a roles / nested-relation write probe beside the normal registration control.
      3. Record the never-modelled units and the surfaces they own on the run row so the coverage loss is auditable.

      The issue bank was unavailable, so this is a proposal for the operator.
