- vuln: white-jotter-004
  failure_mode: surface_gap
  root_cause:
    type: design_defect
    combination_of: [kb_coverage_gap]
    extended_description: |-
      The ground truth is a JNDI injection through a crafted username: a user registers an account whose username contains a JNDI lookup expression, signs in, is refused an administrative action, and the server logs the username through a vulnerable Log4j2 configuration, contacting the attacker's lookup service (metadata.json and report.md under white-jotter-004).

      The flow needs two units that the run never modelled: Service:register at intake position 9 (the crafted username) and Service:user-administration at position 24 (the unauthorized administrative access whose username is written to the log). Both sit after the halt: `hunting_runs.stats` records halt true, risk_total 122 against 110, intake_position 3, crossing_unit Service:library-catalog, blocked_unit Service:navigation-menu. The L1 contracts for both units are present in the seeded surface, so the missing coverage is the halt, not an absent analysis surface.

      No Service:register or Service:user-administration model, loop, test spec or pod exists. A search of every persisted hunting artifact for JNDI, log4j or log4shell finds no model, loop, spec or pod text, except one raw actuator bean name: `information-disclosure__bean-and-autoconfig-graph__json-document` records `org.springframework.boot.actuate.autoconfigure.metrics.Log4J2MetricsAutoConfiguration` in its bean graph. That pod is scoped to actuator information disclosure, was cut off by the 2700 s watchdog (`unsuccessful`, budget-timeout), and never connected the Log4j2 presence to a logging sink.

      There is also a knowledge gap: the suite has no class that binds a logging framework's lookup evaluation. `skills/web-vulnerability-testing/rce/SKILL.md` covers command execution, template/evaluation sinks, decoders, media/document pipelines, fetch-reached services and container escalation; it has no logging-sink variant, and a search of `skills/` finds no log4j or JNDI class. Even if user-administration had been modelled, the modeller would have had no class to bind the username-to-log-to-lookup chain.

      The failure is therefore a surface gap from the risk halt (design_defect) combined with a genuine knowledge-base gap for the logging-sink RCE (kb_coverage_gap).
