- vuln: white-jotter-003
  failure_mode: surface_gap
  root_cause:
    type: design_defect
    extended_description: |-
      The ground truth is stored cross-site scripting in article content: an account with article-write privilege saves articleContentHtml carrying script, and the article detail page renders it as raw HTML (metadata.json and report.md under white-jotter-003).

      The owning surface is in the frozen intake: Service:article-management at position 8 and WebPresentation:article-management::console-pages at position 15; the L1 contract says the service "saves new and edited articles with their rendered body, serves the authoring editor, and deletes stored articles". The run modelled only three of the 27 intake units. `hunting_runs.stats` records halt true, risk_total 122, risk_threshold 110 (basis override), intake_position 3, crossing_unit Service:library-catalog and blocked_unit Service:navigation-menu. The halt is accepted by `docs/design/unit-threat-model-ordering-halt-adr.md`, so the coverage loss is a design property, not an implementation bug.

      No `Service-article-management` model, loop, test spec or pod directory exists in the project data root. The only article-write exercise is an adjacent pod scoped to the sign-in unit's caller-chosen-principal fault: `bfla-client-identity-trust__attribution-write__session-cookie` POSTs to /api/admin/content/article with articleTitle and reads HTTP 200 {"code":200,"message":"成功","result":"保存成功"}, then reads an anonymous /api/article/1 and sees articleContentHtml. That pod's spec is identity attribution, not output encoding; it stores no script payload and never checks a reader-side rendering sink, and its PodExport is `unsuccessful`, terminal_reason budget-timeout. The xss-stored class exists in the suite (`skills/web-vulnerability-testing/xss/xss-stored/SKILL.md`), but no article-management fault was ever modelled to bind it.

      The failure is a surface gap caused by the progressive risk halt: the unit that owns the artifact was never modelled, so no fault, spec or pod could address the stored-XSS sink.
  diagnosis_overview: |-
    white-jotter-003 is stored XSS in the article body (/api/admin/content/article saved with articleContentHtml and rendered on the article detail page).
    Service:article-management is at intake position 8 of 27, but the progressive halt stopped the pass after three units (halt true, risk_total 122 against 110, crossing unit Service:library-catalog, blocked unit Service:navigation-menu), so article-management, its console pages and the stored-XSS fault were never modelled. No article-management model, loop, spec or pod exists.
    The only article write was an identity-attribution pod (POST articleTitle -> 保存成功, anonymous article read carries articleContentHtml), which was scoped to caller-principal attribution, used no script payload, never checked the rendering sink, and ended as an unsuccessful budget-timeout export.
    The xss-stored class exists in the suite, so the miss is coverage, not knowledge. Typed root cause: the progressive risk-threshold halt leaves the article surface unmodelled (design_defect).
  evidences:
  - source: ground_truth
    ref: /root/WebExploitBench/white-jotter/vulnerability/white-jotter-003/metadata.json
    note: |-
      Location http://wj:8443/api/admin/content/article, Vulnerability Type "Stored XSS"; report.md has the article body saved with <img src=x onerror=alert('test')> and rendered as active markup on the detail page.
  - source: l1_surface
    ref: eval/data/webexploitbench/white-jotter/l1-surface.yaml
    note: |-
      Service:article-management contract: "Owns the administrative journal catalogue: saves new and edited articles with their rendered body, serves the authoring editor, and deletes stored articles"; it is exposed via RESTApi api and the article-management console pages.
  - source: hunting_run
    ref: postgres:hunting_runs/12d15890-47b2-43c2-bbe3-14c9626a2fdb
    note: |-
      stats: halt true, risk_total 122, risk_threshold 110, threshold_basis override, intake_position 3, crossing_unit Service:library-catalog, blocked_unit Service:navigation-menu. intake_order places Service:article-management at position 8 and its console pages at 15; neither was modelled.
  - source: data_root
