  proposed_issue:
    title: "Threat modeller closes the path-spelling family on suffix-only matrix probes; the admin wildcard bypass is never tested"
    body: |-
      ## Observed
      In trial white-jotter-1-20261026T031121-1618c524 (project dda347be-abea-48e4-94e5-4a4039f41858) the RESTApi unit bound F-1 to a trailing-separator path-normalisation differential. Its technical_sharpening note says "/api/admin/** wildcard is NOT bypassable; //, ;matrix, %20, %2f, %00 and case variants are refused", but the matrix probes were suffixes on /api/menu, not an empty matrix segment before the protected segment.

      The bfla-alternate-path specs inherited the narrow vector: the unauthenticated-session spec says "Append one trailing separator" and "the in-path matrix form is a dead end". No spec asked for /api/;/admin/....

