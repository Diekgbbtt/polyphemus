  - server-side upload validation/authorization unverified
  - invoking UI caller not inspected
- behavior_id: behavior_cda85e07330ca54ca965c4dc52ce2451
  revision: 1
  reconstruction_level: reconstructed
  question_ref: span_4d736b9586f17ad7bceb0f3872695fd9
  question: 'Where does api.user (sent as Comfy-User header) originate: login flow,
    localStorage persistence, and any server-assisted identity?'
  priority: high
  lead_id: lead_bfd97b295a2795ed91e6209f
  record_sha256: 7d3ea89eff19e214649b07fc86e65e80d84f68ca4c72f29bcb2c540249ab4e2c
  redaction_policy: js-source-redaction-v1
  redaction_count: 0
  steps:
  - kind: trigger
    text: User-store initialize() runs, fetching server user config via api.getUserConfig()
      and reading persisted localStorage key Comfy.userId.
    read_ids:
    - read_c60d1c60e593ecb4c9c234e682adaf92
  - kind: transform
    text: login({userId,username}) sets store userId and writes localStorage Comfy.userId
      and Comfy.userName; logout deletes both keys.
    read_ids:
    - read_c60d1c60e593ecb4c9c234e682adaf92
  - kind: call
    text: watchEffect assigns api.user = userId only when server config exposes users
      and a userId value exists.
    read_ids:
    - read_c60d1c60e593ecb4c9c234e682adaf92
  - kind: request
    text: fetchApi copies caller-supplied headers, injects Comfy-User = this.user,
      and fetches api_base + /api + path with cache no-cache.
    read_ids:
    - read_30c0d2ee53870ddd3548130e5e9ac1c4
  - kind: effect
    text: The client-chosen user id therefore accompanies every fetchApi request,
      including the /prompt status poll, /extensions, and the audio POST /upload/image
      call.
    read_ids:
    - read_30c0d2ee53870ddd3548130e5e9ac1c4
    - read_d49881b2e46a8e1833548a16e5fcbf52
  - kind: effect
    text: On a server config without users, api.user stays the empty constructor default,
      so the header value is empty.
    read_ids:
    - read_c60d1c60e593ecb4c9c234e682adaf92
    - read_30c0d2ee53870ddd3548130e5e9ac1c4
  assumptions:
  - text: Whether the server validates/authorizes the Comfy-User header is server-side
      and unverified here.
    status: unverified
    read_ids:
    - read_30c0d2ee53870ddd3548130e5e9ac1c4
  gaps:
  - getUserConfig/createUser implementations and their URL construction not read
  - where initialize() is invoked and multiuser enablement conditions are server-side
