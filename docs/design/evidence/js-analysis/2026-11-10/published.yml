  question: How does audioService trigger file upload / media URLs (trigger -> URL/body
    construction -> fetchApi -> effect) and what base-URL/header transformation is
    applied by the imported index chunk?
  priority: high
  lead_id: lead_12ff87ef523e571a14e9b2a8
  record_sha256: 409bab4d6223f9ec6edfed04c07d55187c55438e3ebb02dbb07a4d5b294f042b
  redaction_policy: js-source-redaction-v1
  redaction_count: 0
  steps:
  - kind: trigger
    text: Caller invokes convertBlobToFileAndSubmit(blob) with a recorded audio Blob.
    read_ids:
    - read_d49881b2e46a8e1833548a16e5fcbf52
  - kind: transform
    text: Wraps blob in a File named recording-<Date.now()>.wav and builds FormData
      with image=file, subfolder=audio, type=temp.
    read_ids:
    - read_d49881b2e46a8e1833548a16e5fcbf52
  - kind: request
    text: POST /upload/image through api.fetchApi with that FormData and no explicit
      headers.
    read_ids:
    - read_d49881b2e46a8e1833548a16e5fcbf52
  - kind: response
    text: Only status 200 accepted; response JSON parsed and its name field read.
    read_ids:
    - read_d49881b2e46a8e1833548a16e5fcbf52
  - kind: effect
    text: Returns string audio/<name> [temp] used as a later input value referring
      to the temp upload.
    read_ids:
    - read_d49881b2e46a8e1833548a16e5fcbf52
  - kind: error
    text: 'Non-200 status: alert added to toast store and Error thrown with status
      and statusText; upload not retried here.'
    read_ids:
    - read_d49881b2e46a8e1833548a16e5fcbf52
  assumptions:
  - text: fetchApi comes from the api module import; its URL prefix and header logic
      were not available in this file.
    status: unverified
    read_ids:
    - read_d49881b2e46a8e1833548a16e5fcbf52
  gaps:
  - fetchApi implementation (base URL prefix, headers such as any client-supplied
