# Thin mode: the baseline stack without the browser pool.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.thin.yml up -d
#
# The baseline includes `docker-compose.pool.yml`; the thin stack omits it.
# A `deploy.replicas: 0` override is not enough: Compose still plans the worker
# image pull for a declared service, so a thin host without the arm64 worker
# image would fail to start. Omitting the file removes the service entirely.
# This overlay clears the Docker socket and the agent's browser URL too.
services:
  kali:
    environment:
      STEEL_POOL_DOCKER_SOCKET: ""

  agent:
    environment:
      KALI_BROWSER_MCP_URL: ""
